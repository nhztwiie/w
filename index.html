<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhật Huy | Bio Link</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome & QRCode Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================
       BẢNG MÀU TƯƠNG PHẢN CAO & HIỆU ỨNG LIQUID GLASS
       ========================================================== */
    :root[data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 25px 50px rgba(14, 165, 233, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.95);
      --glass-glow: rgba(56, 189, 248, 0.35);
      
      /* Tương phản cao cho Light Mode */
      --text-title: #0f172a;       /* Chữ đen xanh đậm rất rõ nét */
      --text-sub: #0369a1;         /* Chữ phụ xanh đậm */
      --text-link: #0f172a;
      
      --nav-bg: rgba(255, 255, 255, 0.65);
      --indicator-bg: #0284c7;     /* Khối chọn xanh nổi bật */
      --indicator-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
      --nav-icon-active: #ffffff;
      --nav-icon-inactive: #64748b;

      --link-bg: rgba(255, 255, 255, 0.75);
      --link-border: rgba(255, 255, 255, 0.95);
      --link-hover: #ffffff;
      --link-shadow: 0 10px 20px rgba(186, 230, 253, 0.4);

      --orb-1: #38bdf8;
      --orb-2: #93c5fd;
      --orb-3: #fda4af;
      --orb-4: #fde047;
      --orb-5: #c084fc;
    }

    :root[data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a 0%, #090d16 60%, #020617 100%);
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(56, 189, 248, 0.35);
      --glass-shadow: 0 25px 50px rgba(0, 0, 0, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.15);
      --glass-glow: rgba(56, 189, 248, 0.4);

      /* Tương phản cao cho Dark Mode */
      --text-title: #ffffff;       /* Chữ trắng tinh nổi bật trên nền tối */
      --text-sub: #38bdf8;         /* Chữ phụ xanh neon */
      --text-link: #f8fafc;

      --nav-bg: rgba(30, 41, 59, 0.8);
      --indicator-bg: #38bdf8;     /* Khối chọn xanh neon */
      --indicator-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
      --nav-icon-active: #0f172a;
      --nav-icon-inactive: #94a3b8;

      --link-bg: rgba(30, 41, 59, 0.8);
      --link-border: rgba(56, 189, 248, 0.3);
      --link-hover: rgba(51, 65, 85, 0.95);
      --link-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);

      --orb-1: #0284c7;
      --orb-2: #1e3a8a;
      --orb-3: #e11d48;
      --orb-4: #ca8a04;
      --orb-5: #7e22ce;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 15px;
      transition: background 0.5s ease;
    }

    /* ==========================================================
       HỆ THỐNG 5 HÌNH CẦU LIQUID & PARTICLES
       ========================================================== */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.8;
      animation: floatFluid 14s infinite ease-in-out alternate;
    }

    .orb-1 { width: 340px; height: 340px; background: var(--orb-1); top: -80px; left: -80px; animation-duration: 11s; }
    .orb-2 { width: 360px; height: 360px; background: var(--orb-2); bottom: -100px; right: -60px; animation-duration: 15s; }
    .orb-3 { width: 260px; height: 260px; background: var(--orb-3); top: 18%; right: 10%; animation-duration: 12s; }
    .orb-4 { width: 280px; height: 280px; background: var(--orb-4); bottom: 25%; left: 8%; animation-duration: 13s; }
    .orb-5 { width: 220px; height: 220px; background: var(--orb-5); top: 45%; left: 45%; animation-duration: 10s; }

    @keyframes floatFluid {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(50px, 40px) scale(1.1) rotate(180deg); }
      100% { transform: translate(-40px, 70px) scale(0.92) rotate(360deg); }
    }

    .sparkle {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffffff, 0 0 24px var(--text-sub);
      animation: sparkleAnim 3s infinite ease-in-out alternate;
    }

    @keyframes sparkleAnim {
      0% { opacity: 0.2; transform: scale(0.5); }
      100% { opacity: 0.9; transform: scale(1.3); }
    }

    /* ==========================================================
       MAIN CARD CONTAINER (LIQUID GLASS MOLD)
       ========================================================== */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      height: 720px;
      max-height: 92vh;
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 2px solid var(--glass-border);
      border-radius: 42px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: glassAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes glassAppear {
      from { opacity: 0; transform: scale(0.93) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ==========================================================
       TOP BAR & CHUẨN CÂN BẰNG KHỐI THEME TOGGLE (100% CÂN ĐỐI)
       ========================================================== */
    .top-bar {
      padding: 22px 24px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Khung ngoài Toggle Pill */
    .theme-toggle-pill {
      position: relative;
      width: 72px;
      height: 38px;
      background: rgba(255, 255, 255, 0.35);
      border: 1.5px solid var(--glass-border);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(15px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }

    /* Khối tròn di chuyển ôm khít Icon */
    .theme-indicator {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    [data-theme="dark"] .theme-indicator {
      transform: translateX(34px);
      background: #38bdf8;
    }

    .theme-btn-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      z-index: 2;
      color: var(--nav-icon-inactive);
      transition: color 0.3s;
    }

    .theme-btn-icon.active {
      color: var(--nav-icon-active);
    }

    /* Nút QR Top Right */
    .qr-glass-btn {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.45);
      border: 1.5px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.15rem;
      cursor: pointer;
      backdrop-filter: blur(15px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qr-glass-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 20px var(--glass-glow);
    }

    /* ==========================================================
       HEADER THÔNG TIN NHẬT HUY (ĐỒNG BỘ CÂN ĐỐI 3 TAB)
       ========================================================== */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 24px 0;
      z-index: 5;
    }

    .avatar-frame {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 4px;
      background: rgba(255, 255, 255, 0.65);
      border: 2px solid var(--glass-border);
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.25), 0 0 20px var(--glass-glow);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.35s ease;
    }

    .avatar-frame:hover {
      transform: scale(1.05);
    }

    .avatar-frame:hover img {
      filter: grayscale(0%);
    }

    .profile-name-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 12px;
      letter-spacing: -0.5px;
    }

    .profile-subtitle {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* ==========================================================
       VIEWPORT HỖ TRỢ CHUYỂN 3 TAB VUỐT
       ========================================================== */
    .viewport {
      flex: 1;
      display: flex;
      width: 300%;
      transform: translateX(-33.333%); /* Mặc định Tab Home */
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: grab;
      margin-top: 15px;
    }

    .viewport:active { cursor: grabbing; }

    .tab-page {
      width: 33.333%;
      height: 100%;
      padding: 5px 24px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* LINK CARDS BO TRÒN */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .liquid-link-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-link);
      font-weight: 700;
      font-size: 1rem;
      backdrop-filter: blur(20px);
      box-shadow: var(--link-shadow);
      animation: floatCard 6s infinite ease-in-out alternate;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .liquid-link-item:nth-child(1) { animation-delay: 0s; }
    .liquid-link-item:nth-child(2) { animation-delay: 1.2s; }
    .liquid-link-item:nth-child(3) { animation-delay: 2.4s; }
    .liquid-link-item:nth-child(4) { animation-delay: 3.6s; }

    @keyframes floatCard {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    .liquid-link-item:hover {
      animation-play-state: paused;
      transform: translateY(-4px) scale(1.02) !important;
      background: var(--link-hover);
      box-shadow: 0 12px 30px var(--glass-glow);
    }

    .link-app-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .link-text-label { flex: 1; text-align: left; color: var(--text-link); }
    .link-chevron { font-size: 0.85rem; color: var(--text-sub); transition: transform 0.3s; }

    .liquid-link-item:hover .link-chevron {
      transform: translateX(4px);
    }

    /* ==========================================================
       THANH CHUYỂN 3 TAB BÊN DƯỚI (BOTTOM DOCK NAV) - RÕ RÀNG
       ========================================================== */
    .bottom-nav-container {
      padding: 0 20px 20px;
      z-index: 10;
    }

    .bottom-nav-glass {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-bg);
      border: 2px solid var(--glass-border);
      border-radius: 35px;
      padding: 5px;
      backdrop-filter: blur(25px);
      box-shadow: 0 12px 32px rgba(2, 132, 199, 0.18);
    }

    /* Khối Indicator ôm vừa khít 100% nút tab */
    .nav-indicator-pill {
      position: absolute;
      top: 5px;
      left: 5px;
      width: calc(33.333% - 6.66px);
      height: calc(100% - 10px);
      background: var(--indicator-bg);
      border-radius: 30px;
      box-shadow: var(--indicator-shadow);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    .nav-tab-btn {
      flex: 1;
      height: 48px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--nav-icon-inactive);
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: color 0.3s, transform 0.3s;
    }

    .nav-tab-btn.active {
      color: var(--nav-icon-active);
      transform: scale(1.12);
    }

    /* ==========================================================
       TINH CHỈNH MÀU KHUNG QR CODE HÀI HÒA HƠN
       ========================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(35px);
      border: 2px solid var(--glass-border);
      border-radius: 36px;
      padding: 26px 22px;
      width: 88%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 30px var(--glass-glow);
      transform: scale(0.88);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .qr-glass-card {
      transform: scale(1);
    }

    .qr-modal-header {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-title);
      margin-bottom: 16px;
    }

    /* Khung QR viền mờ cao cấp hợp nền */
    .qr-box-wrapper {
      position: relative;
      width: 185px;
      height: 185px;
      margin: 0 auto;
      padding: 10px;
      background: #ffffff;
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 26px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas {
      width: 100% !important;
      height: 100% !important;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode-canvas img {
      border-radius: 12px;
    }

    .qr-center-avatar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      object-fit: cover;
      pointer-events: none;
    }

    .copy-link-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      background: var(--indicator-bg);
      color: var(--nav-icon-active);
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.3);
      transition: all 0.25s ease;
    }

    .copy-link-btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .close-modal-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .close-modal-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- BACKGROUND BLING BLING & LIQUID ORBS -->
  <div class="bg-canvas">
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
    <div class="liquid-orb orb-3"></div>
    <div class="liquid-orb orb-4"></div>
    <div class="liquid-orb orb-5"></div>

    <div class="sparkle" style="top: 18%; left: 22%; width: 6px; height: 6px; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 32%; right: 18%; width: 8px; height: 8px; animation-delay: 1s;"></div>
    <div class="sparkle" style="top: 68%; left: 14%; width: 5px; height: 5px; animation-delay: 1.5s;"></div>
    <div class="sparkle" style="top: 82%; right: 28%; width: 7px; height: 7px; animation-delay: 0.5s;"></div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card" id="main-card">
    
    <!-- TOP BAR (CÂN ĐỐI KHỐI TOGGLE) -->
    <div class="top-bar">
      <div class="theme-toggle-pill" id="theme-toggle">
        <div class="theme-indicator"></div>
        <span class="theme-btn-icon active" id="icon-moon"><i class="fa-solid fa-moon"></i></span>
        <span class="theme-btn-icon" id="icon-sun"><i class="fa-solid fa-sun"></i></span>
      </div>

      <button class="qr-glass-btn" id="open-qr-btn" aria-label="Open QR">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>

    <!-- HEADER THÔNG TIN NHẬT HUY (CÂN ĐỐI TẤT CẢ TABS) -->
    <header class="profile-header">
      <div class="avatar-frame">
        <img src="" alt="Avatar Nhật Huy" class="user-avatar-img">
      </div>
      <h1 class="profile-name-title">Nhật Huy</h1>
      <p class="profile-subtitle">ung dung.</p>
    </header>

    <!-- VIEWPORT WITH 3 SWIPEABLE TABS -->
    <div class="viewport" id="viewport">

      <!-- TAB 1: SOCIAL MEDIA -->
      <section class="tab-page" id="page-social">
        <div class="links-list" id="social-links-list"></div>
      </section>

      <!-- TAB 2: HOME (BỎ CONTACT ME, TỐI GIẢN) -->
      <section class="tab-page" id="page-home"></section>

      <!-- TAB 3: WORK -->
      <section class="tab-page" id="page-work">
        <div class="links-list" id="work-links-list"></div>
      </section>

    </div>

    <!-- THANH CHUYỂN 3 TAB BÊN DƯỚI (HIỂN THỊ RÕ RÀNG) -->
    <div class="bottom-nav-container">
      <nav class="bottom-nav-glass">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social Tab">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home Tab">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work Tab">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- QR CODE MODAL CÂN ĐỐI -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="qr-glass-card">
      <h3 class="qr-modal-header">Scan QR Code</h3>
      
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="" alt="Avatar Center" class="qr-center-avatar user-avatar-img">
      </div>

      <button class="copy-link-btn" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>

      <button class="close-modal-btn" id="close-qr-btn">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Render Avatars & Content
      const avatars = document.querySelectorAll(".user-avatar-img");
      avatars.forEach(img => img.src = bioData.profile.avatar);

      renderLinks("social-links-list", bioData.tabs.social);
      renderLinks("work-links-list", bioData.tabs.work);

      // 2. Initialize Features
      initTabNavigation();
      initSwipeGesture();
      initThemeToggle();
      initQRCodeModal();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="liquid-link-item">
          <img src="${item.icon}" alt="${item.title}" class="link-app-icon">
          <span class="link-text-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-chevron"></i>
        </a>
      `).join('');
    }

    let currentTabIndex = 1; // Mặc định Tab Home (Index = 1)

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");

      function switchTab(index) {
        currentTabIndex = index;
        viewport.style.transform = `translateX(-${index * 33.333}%)`;
        indicator.style.transform = `translateX(${index * 100}%)`;

        navBtns.forEach((btn, i) => {
          if (i === index) btn.classList.add("active");
          else btn.classList.remove("active");
        });
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      window.switchTabGlobal = switchTab;
    }

    function initSwipeGesture() {
      const viewport = document.getElementById("viewport");
      let startX = 0;
      let currentX = 0;
      let isSwiping = false;

      viewport.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
        isSwiping = true;
      }, { passive: true });

      viewport.addEventListener("touchmove", (e) => {
        if (!isSwiping) return;
        currentX = e.touches[0].clientX;
      }, { passive: true });

      viewport.addEventListener("touchend", () => {
        if (!isSwiping) return;
        const diffX = startX - currentX;

        if (diffX > 50 && currentTabIndex < 2) {
          window.switchTabGlobal(currentTabIndex + 1);
        } else if (diffX < -50 && currentTabIndex > 0) {
          window.switchTabGlobal(currentTabIndex - 1);
        }

        isSwiping = false;
      });
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const iconMoon = document.getElementById("icon-moon");
      const iconSun = document.getElementById("icon-sun");
      
      const savedTheme = localStorage.getItem("liquid-theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      updateToggleIcons(savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("liquid-theme", newTheme);
        updateToggleIcons(newTheme);
      });

      function updateToggleIcons(theme) {
        if (theme === "dark") {
          iconMoon.classList.remove("active");
          iconSun.classList.add("active");
        } else {
          iconMoon.classList.add("active");
          iconSun.classList.remove("active");
        }
      }
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = bioData.profile.shareUrl || window.location.href;
      let qrGenerated = false;

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 165,
            height: 165,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";
          copyBtn.style.color = "#ffffff";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--indicator-bg)";
            copyBtn.style.color = "var(--nav-icon-active)";
          }, 2000);
        });
      });

      closeBtn.addEventListener("click", () => modal.classList.remove("active"));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("active");
      });
    }
  </script>
</body>
</html>
