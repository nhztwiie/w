<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nhật Huy | w.bio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Fonts & Icons & QRCode JS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

  <style>
    :root[data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a 0%, #030712 65%, #000000 100%);
      --glass-bg: rgba(15, 23, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-highlight: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      --glass-glow: rgba(56, 189, 248, 0.35);

      --text-title: #ffffff;
      --text-sub: #38bdf8;
      --text-quote: #f8fafc;
      --text-author: #94a3b8;

      --pill-bg: rgba(255, 255, 255, 0.08);
      --pill-border: rgba(255, 255, 255, 0.18);
      --pill-hover-bg: rgba(56, 189, 248, 0.18);
      --pill-hover-border: rgba(56, 189, 248, 0.6);

      --dock-bg: rgba(15, 23, 42, 0.65);
      --dock-border: rgba(255, 255, 255, 0.22);
      --indicator-bg: linear-gradient(135deg, rgba(56, 189, 248, 0.45) 0%, rgba(129, 140, 248, 0.35) 100%);
      --indicator-border: rgba(56, 189, 248, 0.75);

      --orb-1: rgba(99, 102, 241, 0.6);
      --orb-2: rgba(56, 189, 248, 0.5);
      --orb-3: rgba(236, 72, 153, 0.4);
    }

    :root[data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #bae6fd 50%, #38bdf8 100%);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-border-highlight: rgba(255, 255, 255, 1);
      --glass-shadow: 0 15px 35px rgba(14, 165, 233, 0.2);
      --glass-glow: rgba(2, 132, 199, 0.25);

      --text-title: #0f172a;
      --text-sub: #0284c7;
      --text-quote: #0f172a;
      --text-author: #475569;

      --pill-bg: rgba(255, 255, 255, 0.82);
      --pill-border: rgba(255, 255, 255, 0.95);
      --pill-hover-bg: rgba(255, 255, 255, 0.98);
      --pill-hover-border: #0284c7;

      --dock-bg: rgba(255, 255, 255, 0.75);
      --dock-border: rgba(255, 255, 255, 0.95);
      --indicator-bg: linear-gradient(135deg, rgba(186, 230, 253, 0.95) 0%, rgba(125, 211, 252, 0.8) 100%);
      --indicator-border: rgba(2, 132, 199, 0.7);

      --orb-1: rgba(14, 165, 233, 0.6);
      --orb-2: rgba(56, 189, 248, 0.5);
      --orb-3: rgba(244, 114, 182, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 16px;
    }

    /* BACKGROUND ORBS - TOI UU CANVAS GPU */
    .ios26-bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      animation: floatFluid 16s infinite ease-in-out alternate;
    }

    .orb-primary {
      width: 320px; height: 320px;
      top: -60px; left: -60px;
      background: radial-gradient(circle, var(--orb-1) 0%, transparent 70%);
    }

    .orb-secondary {
      width: 300px; height: 300px;
      bottom: -60px; right: -50px;
      background: radial-gradient(circle, var(--orb-2) 0%, transparent 70%);
      animation-duration: 12s;
    }

    .orb-accent {
      width: 250px; height: 250px;
      top: 40%; left: 20%;
      background: radial-gradient(circle, var(--orb-3) 0%, transparent 70%);
      animation-duration: 18s;
    }

    @keyframes floatFluid {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(40px, -30px, 0) scale(1.1); }
      100% { transform: translate3d(-30px, 30px, 0) scale(0.95); }
    }

    /* MAIN CARD CONTAINER */
    .liquid-card-ios26 {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 414px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      border-radius: 36px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      will-change: transform;
      transform: translateZ(0);
    }

    .liquid-card-ios26::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--glass-border-highlight), transparent);
      z-index: 15;
    }

    /* TOP BAR */
    .top-bar {
      padding: 16px 20px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-track {
      position: relative;
      width: 68px;
      height: 38px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 2px;
      cursor: pointer;
    }

    .theme-orb-indicator {
      position: absolute;
      top: 2px; left: 2px;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8 0%, #818cf8 100%);
      border: 1.5px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }

    .orb-icon {
      font-size: 0.85rem;
      position: absolute;
      transition: opacity 0.3s ease;
    }

    .icon-sun { opacity: 0; color: #f59e0b; }
    .icon-moon { opacity: 1; color: #ffffff; }

    [data-theme="light"] .theme-orb-indicator {
      transform: translate3d(30px, 0, 0);
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fde047 100%);
    }
    [data-theme="light"] .icon-sun { opacity: 1; }
    [data-theme="light"] .icon-moon { opacity: 0; }

    .glass-btn-ios26 {
      width: 38px; height: 38px;
      border-radius: 16px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1rem;
      cursor: pointer;
    }

    .music-btn.playing i {
      animation: spinMusic 3s linear infinite;
      color: var(--text-sub);
    }

    @keyframes spinMusic {
      100% { transform: rotate(360deg); }
    }

    /* PROFILE HEADER TOI UU TRANSFORM */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8px 20px 4px;
      z-index: 15;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .avatar-ring {
      width: 90px; height: 90px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.1) 100%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .profile-meta {
      transition: opacity 0.3s ease, transform 0.3s ease;
      will-change: opacity, transform;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 8px;
      letter-spacing: -0.02em;
    }

    .profile-tagline {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* CO CO QUAN TRONG: THU NHO HEADER KHONG GAY REFLOW */
    .liquid-card-ios26.compact-mode .profile-header {
      transform: translate3d(0, -10px, 0) scale(0.75);
      margin-bottom: -45px;
    }

    .liquid-card-ios26.compact-mode .profile-meta {
      opacity: 0;
      transform: translate3d(0, -10px, 0);
      pointer-events: none;
    }

    /* VIEWPORT SLIDER - GRID SYSTEM PHONG TRANH PHAN TICH CHIEU CAO DONG */
    .viewport-wrapper {
      width: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }

    .viewport {
      width: 300%;
      display: flex;
      align-items: flex-start;
      transform: translate3d(-33.3333%, 0, 0);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .tab-page {
      width: 33.3333%;
      padding: 8px 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 140px;
    }

    .ios26-quote-card {
      margin: 6px 0;
      padding: 18px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
    }

    .quote-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-quote);
      line-height: 1.5;
    }

    .quote-author {
      font-size: 0.82rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 10px;
      display: block;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ios26-link-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .link-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      margin-right: 12px;
      object-fit: cover;
    }

    .link-label { flex: 1; text-align: left; }
    .link-arrow { font-size: 0.8rem; color: var(--text-sub); }

    /* BOTTOM NAV DOCK */
    .bottom-nav-container {
      padding: 4px 18px 16px;
      z-index: 30;
      width: 100%;
    }

    .ios26-nav-dock {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--dock-bg);
      border: 1.5px solid var(--dock-border);
      border-radius: 36px;
      padding: 4px;
    }

    .nav-indicator-pill {
      position: absolute;
      top: 4px; left: 4px;
      width: calc((100% - 8px) / 3);
      height: calc(100% - 8px);
      background: var(--indicator-bg);
      border: 1.5px solid var(--indicator-border);
      border-radius: 30px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
      z-index: 1;
    }

    .nav-tab-btn {
      flex: 1;
      height: 42px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .nav-tab-btn i {
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    [data-theme="light"] .nav-tab-btn i { color: #64748b; }

    .nav-tab-btn.active i {
      color: var(--text-title);
      transform: scale(1.15);
    }

    [data-theme="light"] .nav-tab-btn.active i { color: #0284c7; }

    /* MODAL QR CODE */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(3, 7, 18, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .qr-glass-card {
      background: var(--glass-bg);
      border: 1.5px solid var(--glass-border-highlight);
      border-radius: 32px;
      padding: 24px 20px;
      width: 85%;
      max-width: 300px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }

    .modal-backdrop.active .qr-glass-card { transform: scale(1); }
    .qr-title { font-size: 1.1rem; font-weight: 700; color: var(--text-title); margin-bottom: 14px; }

    .qr-box-wrapper {
      position: relative;
      width: 160px; height: 160px;
      margin: 0 auto;
      padding: 10px;
      background: #ffffff;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas { width: 100% !important; height: 100% !important; }

    .qr-avatar-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      object-fit: cover;
    }

    .btn-copy-link {
      width: 160px;
      margin: 14px auto 0;
      padding: 10px;
      border: none;
      background: var(--text-sub);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-close-modal {
      margin-top: 10px;
      width: 100%;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND SPHERES -->
  <div class="ios26-bg-canvas">
    <div class="liquid-orb orb-primary"></div>
    <div class="liquid-orb orb-secondary"></div>
    <div class="liquid-orb orb-accent"></div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card-ios26" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="theme-toggle-track" id="theme-toggle" role="button" aria-label="Toggle Theme">
        <div class="theme-orb-indicator">
          <i class="fa-solid fa-moon orb-icon icon-moon"></i>
          <i class="fa-solid fa-sun orb-icon icon-sun"></i>
        </div>
      </div>

      <div class="top-bar-controls">
        <button class="glass-btn-ios26 music-btn" id="music-toggle-btn" aria-label="Toggle Music">
          <i class="fa-solid fa-music" id="music-icon"></i>
        </button>

        <button class="glass-btn-ios26" id="open-qr-btn" aria-label="Open QR Code">
          <i class="fa-solid fa-qrcode"></i>
        </button>
      </div>
    </div>

    <!-- PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-ring">
        <img src="images/Huy.png" alt="Avatar Nhật Huy" loading="eager">
      </div>
      <div class="profile-meta">
        <h1 class="profile-name">Nhật Huy</h1>
        <p class="profile-tagline">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT SLIDER -->
    <div class="viewport-wrapper" id="viewport-wrapper">
      <div class="viewport" id="viewport">

        <!-- TAB 1: SOCIAL -->
        <section class="tab-page" id="page-social">
          <div class="links-list" id="social-links-list"></div>
        </section>

        <!-- TAB 2: HOME (QUOTE) -->
        <section class="tab-page" id="page-home">
          <div class="ios26-quote-card">
            <p class="quote-text">“<br>Even the darkest night will end,<br>and the sun will rise.</p>
            <span class="quote-author">Les Misérables - Victor Hugo</span>
          </div>
        </section>

        <!-- TAB 3: WORK -->
        <section class="tab-page" id="page-work">
          <div class="links-list" id="work-links-list"></div>
        </section>

      </div>
    </div>

    <!-- NAVIGATION DOCK -->
    <div class="bottom-nav-container">
      <nav class="ios26-nav-dock">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal" role="dialog" aria-hidden="true">
    <div class="qr-glass-card">
      <h3 class="qr-title">Scan QR Code</h3>
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar" class="qr-avatar-center">
      </div>
      <button class="btn-copy-link" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>
      <button class="btn-close-modal" id="close-qr-btn">Close</button>
    </div>
  </div>

  <!-- AUDIO ELEMENT -->
  <audio id="bg-music" src="audio/neungayay.mp3" loop preload="auto"></audio>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof bioData !== 'undefined' && bioData.tabs) {
        renderLinks("social-links-list", bioData.tabs.social);
        renderLinks("work-links-list", bioData.tabs.work);
      }

      initTabNavigation();
      initThemeToggle();
      initQRCodeModal();
      initAudioPlayer();
      initTouchGestures();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !Array.isArray(items)) return;

      const fragment = document.createDocumentFragment();
      items.forEach(item => {
        const a = document.createElement('a');
        a.href = item.url || '#';
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "ios26-link-item";
        a.innerHTML = `
          <img src="${item.icon}" alt="${item.title}" class="link-icon" loading="lazy">
          <span class="link-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        `;
        fragment.appendChild(a);
      });

      container.innerHTML = '';
      container.appendChild(fragment);
    }

    let currentTabIndex = 1;

    function switchTab(index) {
      currentTabIndex = index;
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");

      viewport.style.transform = `translate3d(-${index * 33.3333}%, 0, 0)`;

      const activeBtn = navBtns[index];
      if (activeBtn && indicator) {
        indicator.style.transform = `translate3d(${activeBtn.offsetLeft - 4}px, 0, 0)`;
      }

      navBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));

      if (index === 1) {
        mainCard.classList.remove("compact-mode");
      } else {
        mainCard.classList.add("compact-mode");
      }
    }

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      // Khoi tao Tab ban dau
      requestAnimationFrame(() => switchTab(1));
    }

    /* THAO TAC VUOT TIMELINE BAM NAY CHO MOBILE */
    function initTouchGestures() {
      const wrapper = document.getElementById("viewport-wrapper");
      let touchStartX = 0;
      let touchEndX = 0;

      wrapper.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      wrapper.addEventListener("touchend", (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        const threshold = 40;
        if (touchStartX - touchEndX > threshold && currentTabIndex < 2) {
          switchTab(currentTabIndex + 1); // Vuot sang trai -> Next Tab
        } else if (touchEndX - touchStartX > threshold && currentTabIndex > 0) {
          switchTab(currentTabIndex - 1); // Vuot sang phai -> Prev Tab
        }
      }
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("ios26-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("ios26-theme", newTheme);
      });
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      function openModal() {
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 140,
            height: 140,
            colorDark: "#030712",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      }

      function closeModal() {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
      }

      openBtn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--text-sub)";
          }, 2000);
        });
      });
    }

    function initAudioPlayer() {
      const musicBtn = document.getElementById("music-toggle-btn");
      const musicIcon = document.getElementById("music-icon");
      const audio = document.getElementById("bg-music");

      if (!audio || !musicBtn) return;
      audio.volume = 0.4;
      let isPlaying = false;

      musicBtn.addEventListener("click", () => {
        if (isPlaying) {
          audio.pause();
          musicBtn.classList.remove("playing");
          musicIcon.className = "fa-solid fa-music";
        } else {
          audio.play().then(() => {
            musicBtn.classList.add("playing");
            musicIcon.className = "fa-solid fa-compact-disc";
          }).catch(() => {});
        }
        isPlaying = !isPlaying;
      });
    }
  </script>
</body>
</html>
