  <style>
    /* ==========================================================
       TITANIUM & LIQUID GLASS SYSTEM - ENHANCED MOTION & LIGHTING
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #2a2d32 0%, #111317 65%, #08090a 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-highlight: rgba(255, 255, 255, 0.45);
      --glass-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.35),
        inset 0 -1px 2px rgba(0, 0, 0, 0.7);
      --glass-glow: rgba(224, 224, 224, 0.15);

      --spotlight-color: rgba(255, 255, 255, 0.11);
      --spotlight-border: rgba(255, 255, 255, 0.55);

      --text-title: #ffffff;
      --text-sub: #d1d5db;
      --text-quote: #f3f4f6;
      --text-author: #9ca3af;

      --pill-bg: rgba(255, 255, 255, 0.06);
      --pill-border: rgba(255, 255, 255, 0.18);
      --pill-hover-bg: rgba(255, 255, 255, 0.14);
      --pill-hover-border: rgba(255, 255, 255, 0.5);
      --pill-hover-glow: 0 12px 32px rgba(255, 255, 255, 0.15);

      --dock-bg: rgba(20, 22, 26, 0.55);
      --dock-border: rgba(255, 255, 255, 0.22);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(160, 160, 160, 0.18) 100%);
      --indicator-border: rgba(255, 255, 255, 0.45);

      --orb-1: rgba(255, 255, 255, 0.35);
      --orb-2: rgba(160, 170, 190, 0.4);
      --orb-3: rgba(210, 215, 225, 0.3);
      --shimmer-beam: rgba(255, 255, 255, 0.95);
    }

    :root[data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #f3f4f6 0%, #e5e7eb 60%, #cbd5e1 100%);

      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-border-highlight: rgba(255, 255, 255, 1);
      --glass-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.08),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.03);
      --glass-glow: rgba(0, 0, 0, 0.05);

      --spotlight-color: rgba(255, 255, 255, 0.65);
      --spotlight-border: rgba(107, 114, 128, 0.55);

      --text-title: #111827;
      --text-sub: #4b5563;
      --text-quote: #111827;
      --text-author: #6b7280;

      --pill-bg: rgba(255, 255, 255, 0.75);
      --pill-border: rgba(255, 255, 255, 0.95);
      --pill-hover-bg: rgba(255, 255, 255, 0.95);
      --pill-hover-border: #9ca3af;
      --pill-hover-glow: 0 12px 30px rgba(0, 0, 0, 0.08);

      --dock-bg: rgba(255, 255, 255, 0.72);
      --dock-border: rgba(255, 255, 255, 0.95);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(229, 231, 235, 0.85) 100%);
      --indicator-border: rgba(156, 163, 175, 0.5);

      --orb-1: rgba(255, 255, 255, 0.9);
      --orb-2: rgba(203, 213, 225, 0.6);
      --orb-3: rgba(226, 232, 240, 0.7);
      --shimmer-beam: rgba(245, 158, 11, 0.85);
    }

    /* VIEW TRANSITIONS API (CIRCULAR THEME REVEAL) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) {
      z-index: 1;
    }
    ::view-transition-new(root) {
      z-index: 9999;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px;
    }

    /* BACKGROUND CANVAS & ORBS */
    .ios26-bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
      transform: translateZ(0);
    }

    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      mix-blend-mode: overlay;
      will-change: transform, opacity;
      opacity: 0.85;
      z-index: 1;
    }

    .orb-primary {
      width: 420px; height: 420px;
      top: -80px; left: -60px;
      background: radial-gradient(circle at 35% 35%, var(--orb-1) 0%, rgba(255,255,255,0.1) 60%, transparent 80%);
      animation: floatFluid1 12s infinite ease-in-out alternate;
    }

    .orb-secondary {
      width: 380px; height: 380px;
      bottom: -60px; right: -50px;
      background: radial-gradient(circle at 35% 35%, var(--orb-2) 0%, rgba(255,255,255,0.08) 60%, transparent 80%);
      animation: floatFluid2 15s infinite ease-in-out alternate;
    }

    .orb-accent {
      width: 300px; height: 300px;
      top: 40%; left: 30%;
      background: radial-gradient(circle at 35% 35%, var(--orb-3) 0%, rgba(255,255,255,0.1) 60%, transparent 80%);
      animation: floatFluid3 10s infinite ease-in-out alternate;
    }

    @keyframes floatFluid1 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(120px, 80px, 0) scale(1.15) rotate(15deg); }
      100% { transform: translate3d(40px, 140px, 0) scale(0.9) rotate(-10deg); }
    }

    @keyframes floatFluid2 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(-100px, -90px, 0) scale(1.2) rotate(-20deg); }
      100% { transform: translate3d(-40px, -150px, 0) scale(0.95) rotate(10deg); }
    }

    @keyframes floatFluid3 {
      0% { transform: translate3d(0, 0, 0) scale(0.9); }
      50% { transform: translate3d(-90px, 70px, 0) scale(1.25); }
      100% { transform: translate3d(100px, -60px, 0) scale(0.85); }
    }

    .glass-mesh-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 20px 20px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.3;
    }

    /* ==========================================================
       CURSOR SPOTLIGHT & BORDER GLOW SYSTEM (RAYCAST / VERCEL)
       ========================================================== */
    .spotlight-surface {
      position: relative;
      --mouse-x: -999px;
      --mouse-y: -999px;
    }

    /* Quầng sáng nội bề mặt */
    .spotlight-surface::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        260px circle at var(--mouse-x) var(--mouse-y),
        var(--spotlight-color),
        transparent 80%
      );
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 1;
    }

    .spotlight-surface:hover::after {
      opacity: 1;
    }

    /* Viền sáng theo con trỏ chuột (Border Glow) */
    .spotlight-border {
      position: absolute;
      inset: -1.5px;
      border-radius: inherit;
      padding: 1.5px;
      background: radial-gradient(
        200px circle at var(--mouse-x) var(--mouse-y),
        var(--spotlight-border),
        transparent 75%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 16;
    }

    .spotlight-surface:hover > .spotlight-border {
      opacity: 1;
    }

    /* MAIN CARD CONTAINER */
    .liquid-card-ios26 {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 414px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1.5px solid var(--glass-border);
      border-radius: 44px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.55s cubic-bezier(0.32, 0.72, 0, 1), background 0.4s ease, border-color 0.4s ease;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .liquid-card-ios26::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--glass-border-highlight), transparent);
      z-index: 15;
    }

    /* TOP BAR */
    .top-bar {
      padding: 20px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* HAPTIC FEEDBACK CHO TẤT CẢ NÚT BẤM */
    .haptic-btn {
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }
    .haptic-btn:active {
      transform: scale(0.96) !important;
    }

    .theme-toggle-track {
      position: relative;
      width: 78px;
      height: 42px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .theme-toggle-track:hover { transform: scale(1.04); }

    .theme-orb-indicator {
      position: absolute;
      top: 3px; left: 3px;
      width: 33px; height: 33px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%);
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), background 0.4s ease;
      will-change: transform;
    }

    .orb-icon {
      font-size: 0.9rem;
      transition: opacity 0.3s ease, transform 0.3s ease;
      position: absolute;
    }

    .icon-sun { opacity: 0; transform: scale(0.5) rotate(-90deg); color: #111827; }
    .icon-moon { opacity: 1; transform: scale(1) rotate(0deg); color: #111827; }

    [data-theme="light"] .theme-orb-indicator {
      transform: translate3d(36px, 0, 0);
      background: linear-gradient(135deg, #ffffff 0%, #d1d5db 100%);
    }
    [data-theme="light"] .icon-sun { opacity: 1; transform: scale(1) rotate(0deg); }
    [data-theme="light"] .icon-moon { opacity: 0; transform: scale(0.5) rotate(90deg); }

    .glass-btn-ios26 {
      width: 42px; height: 42px;
      border-radius: 18px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.05rem;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
    }

    .glass-btn-ios26:hover {
      transform: translateY(-2px) scale(1.06);
      border-color: var(--text-sub);
      background: var(--pill-hover-bg);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.5);
    }

    .music-btn.playing i {
      animation: spinMusic 3s linear infinite;
      color: var(--text-sub);
      will-change: transform;
    }

    @keyframes spinMusic {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ==========================================================
       PROFILE HEADER & AVATAR BREATHING + TILT 3D
       ========================================================== */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 24px 8px;
      z-index: 15;
      flex-shrink: 0;
      perspective: 800px;
      transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), margin 0.5s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform, margin;
    }

    @keyframes avatarBreathing {
      0%, 100% {
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3), 0 0 18px rgba(255, 255, 255, 0.12);
      }
      50% {
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35), 0 0 34px rgba(255, 255, 255, 0.32);
      }
    }

    .avatar-ring {
      position: relative;
      width: 104px; height: 104px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.08) 100%);
      border: 1.5px solid var(--glass-border);
      animation: avatarBreathing 4.5s ease-in-out infinite;
      transform-style: preserve-3d;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
      cursor: pointer;
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.45s ease, transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      pointer-events: none;
    }

    .avatar-ring:hover img { 
      filter: grayscale(0%); 
      transform: translateZ(12px) scale(1.03);
    }

    .profile-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .profile-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 12px;
      letter-spacing: -0.03em;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .profile-tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 2px;
      letter-spacing: -0.01em;
    }

    .liquid-card-ios26.compact-mode .profile-header {
      transform: translate3d(0, 0, 0) scale(0.8);
      margin-bottom: -58px;
    }

    .liquid-card-ios26.compact-mode .profile-meta {
      opacity: 0;
      transform: translate3d(0, -15px, 0);
      pointer-events: none;
    }

    /* ==========================================================
       SPRING-BASED VIEWPORT & TAB TRANSITIONS (LINEAR / FAMILY)
       ========================================================== */
    .viewport-wrapper {
      width: 100%;
      overflow: hidden;
      flex: 1;
      z-index: 10;
    }

    .viewport {
      width: 300%;
      display: flex;
      align-items: flex-start;
      transform: translate3d(-33.3333%, 0, 0);
      transition: transform 0.55s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
    }

    .tab-page {
      width: 33.3333%;
      padding: 12px 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0.45;
      transform: scale(0.95);
      filter: blur(4px);
      transition: 
        opacity 0.45s cubic-bezier(0.32, 0.72, 0, 1),
        transform 0.55s cubic-bezier(0.32, 0.72, 0, 1),
        filter 0.45s ease;
    }

    .tab-page.active-tab {
      opacity: 1;
      transform: scale(1);
      filter: blur(0px);
    }

    /* ==========================================================
       TEXT SHIMMER & BLUR REVEAL CHO QUOTE (STRIPE / CRON)
       ========================================================== */
    .ios26-quote-card {
      margin: 8px 0 16px;
      padding: 24px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--glass-border);
      border-radius: 30px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .ios26-quote-card:hover {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--text-sub);
      box-shadow: 0 15px 35px rgba(255, 255, 255, 0.08), inset 0 1px 3px rgba(255, 255, 255, 0.4);
    }

    .quote-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-quote);
      line-height: 1.65;
    }

    /* Từng từ xuất hiện với Blur Reveal + Sunlight Shimmer */
    .reveal-word {
      display: inline-block;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(10px);
      animation: wordBlurReveal 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes wordBlurReveal {
      to {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0);
      }
    }

    /* Hiệu ứng vệt nắng ấm lướt qua câu trích dẫn */
    .sunlight-shimmer-wrap {
      display: inline;
      background: linear-gradient(
        110deg,
        var(--text-quote) 35%,
        var(--shimmer-beam) 50%,
        var(--text-quote) 65%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: sunSweep 5.5s ease-in-out infinite;
    }

    @keyframes sunSweep {
      0%, 15% { background-position: 120% 0; }
      55%, 100% { background-position: -120% 0; }
    }

    .quote-author {
      font-size: 0.88rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 14px;
      display: block;
      opacity: 0;
      filter: blur(4px);
      transform: translateY(6px);
      animation: wordBlurReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
    }

    /* LINKS LIST */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ios26-link-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 26px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .ios26-link-item:hover {
      transform: translateY(-4px) scale(1.025);
      background: var(--pill-hover-bg);
      border-color: var(--pill-hover-border);
      box-shadow: var(--pill-hover-glow);
    }

    .ios26-link-item:active { transform: translateY(-1px) scale(0.96) !important; }

    .link-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      margin-right: 14px;
      object-fit: cover;
      position: relative;
      z-index: 2;
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .ios26-link-item:hover .link-icon {
      transform: scale(1.12) rotate(5deg);

    /* ==========================================================
       1. TEXT SHIMMER & BLUR REVEAL CHO QUOTE
       ========================================================== */
    function initQuoteBlurReveal() {
      const quoteEl = document.getElementById("animated-quote");
      if (!quoteEl) return;

      const lines = [
        "“",
        "Even the darkest night will end,",
        "and the sun will rise."
      ];

      let wordIndex = 0;
      const htmlLines = lines.map((line) => {
        const words = line.split(" ");
        return words.map((word) => {
          const delay = (wordIndex * 0.075).toFixed(3);
          wordIndex++;
          return `<span class="reveal-word" style="animation-delay: ${delay}s">${word}</span>`;
        }).join(" ");
      });

      quoteEl.innerHTML = `<span class="sunlight-shimmer-wrap">${htmlLines.join("<br>")}</span>`;
    }

    /* ==========================================================
       2. CURSOR SPOTLIGHT & BORDER GLOW (RAYCAST / VERCEL)
       ========================================================== */
    function initSpotlightEffect() {
      document.addEventListener("mousemove", (e) => {
        const surfaces = document.querySelectorAll(".spotlight-surface");
        surfaces.forEach((surface) => {
          const rect = surface.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          surface.style.setProperty("--mouse-x", `${x}px`);
          surface.style.setProperty("--mouse-y", `${y}px`);
        });
      }, { passive: true });
    }

    /* ==========================================================
       3. APPLE MACOS MAGNETIC DOCK (SPRING PHYSICS INTERPOLATION)
       ========================================================== */
    function initMagneticDock() {
      const dock = document.getElementById("macos-dock");
      const items = Array.from(dock.querySelectorAll(".nav-tab-btn"));
      if (!dock || items.length === 0) return;

      // Trạng thái spring vật lý cho từng icon (scale & translateX)
      const springs = items.map(() => ({
        scale: 1,
        targetScale: 1,
        vScale: 0,
        x: 0,
        targetX: 0,
        vX: 0
      }));

      const maxDistance = 120;
      const maxScale = 1.38;
      const maxPush = 10;

      dock.addEventListener("mousemove", (e) => {
        const mouseX = e.clientX;
        items.forEach((item, idx) => {
          const rect = item.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const diff = mouseX - centerX;
          const dist = Math.abs(diff);

          if (dist < maxDistance) {
            // Nội suy Cosine mượt mà kiểu macOS Dock
            const ratio = Math.cos((dist / maxDistance) * (Math.PI / 2));
            springs[idx].targetScale = 1 + (maxScale - 1) * ratio;
            // Đẩy nhẹ các icon bên cạnh ra hai phía
            springs[idx].targetX = -Math.sign(diff) * Math.sin((dist / maxDistance) * Math.PI) * maxPush;
          } else {
            springs[idx].targetScale = 1;
            springs[idx].targetX = 0;
          }
        });
      });

      dock.addEventListener("mouseleave", () => {
        springs.forEach((s) => {
          s.targetScale = 1;
          s.targetX = 0;
        });
      });

      // Vòng lặp Spring Physics (stiffness: 0.18, damping: 0.72)
      function animateDock() {
        const stiffness = 0.18;
        const damping = 0.72;

        items.forEach((item, idx) => {
          const s = springs[idx];
          const forceScale = (s.targetScale - s.scale) * stiffness;
          s.vScale = (s.vScale + forceScale) * damping;
          s.scale += s.vScale;

          const forceX = (s.targetX - s.x) * stiffness;
          s.vX = (s.vX + forceX) * damping;
          s.x += s.vX;

          const translateY = -(s.scale - 1) * 14;
          item.style.transform = `translate3d(${s.x.toFixed(2)}px, ${translateY.toFixed(2)}px, 0) scale(${s.scale.toFixed(3)})`;
        });

        requestAnimationFrame(animateDock);
      }
      requestAnimationFrame(animateDock);
    }

    /* ==========================================================
       4. AVATAR 3D TILT PARALLAX
       ========================================================== */
    function initAvatar3DTilt() {
      const avatar = document.getElementById("avatar-3d");
      if (!avatar) return;

      avatar.addEventListener("mousemove", (e) => {
        const rect = avatar.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        const rotateX = (-y * 24).toFixed(2);
        const rotateY = (x * 24).toFixed(2);
        avatar.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.06)`;
      });

      avatar.addEventListener("mouseleave", () => {
        avatar.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
      });
    }

    /* ==========================================================
       5. INTERACTIVE AMBIENT CANVAS (ĐOM ĐÓM TỤ LẠI / ĐỐM NẮNG BOKEH)
       ========================================================== */
    function initAmbientCanvas() {
      const canvas = document.getElementById("ambient-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const mouse = { x: -9999, y: -9999, active: false };
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      }, { passive: true });

      window.addEventListener("mouseleave", () => {
        mouse.active = false;
      });

      const particleCount = 38;
      const particles = Array.from({ length: particleCount }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45 - 0.15,
        baseRadius: Math.random() * 2.2 + 1.2,
        bokehRadius: Math.random() * 14 + 6,
        phase: Math.random() * Math.PI * 2,
        speedPhase: Math.random() * 0.02 + 0.01
      }));

      function renderCanvas() {
        ctx.clearRect(0, 0, width, height);
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";

        particles.forEach((p) => {
          p.phase += p.speedPhase;

          // Lực hút nhẹ tụ lại khi con trỏ chuột đi qua
          if (mouse.active) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.hypot(dx, dy);
            const attractRadius = 210;

            if (dist < attractRadius && dist > 18) {
              const force = (1 - dist / attractRadius) * 0.035;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
            }
          }

          // Ma sát nhẹ giữ chuyển động ung dung, chậm rãi
          p.vx *= 0.985;
          p.vy *= 0.985;

          // Duy trì trôi lơ lửng tự nhiên
          p.x += p.vx + Math.sin(p.phase) * 0.18;
          p.y += p.vy + Math.cos(p.phase * 0.8) * 0.15;

          if (p.x < -30) p.x = width + 30;
          if (p.x > width + 30) p.x = -30;
          if (p.y < -30) p.y = height + 30;
          if (p.y > height + 30) p.y = -30;

          const pulse = 0.5 + 0.5 * Math.sin(p.phase);

          if (isDark) {
            // Dark Mode: Đom đóm / bụi sao lấp lánh
            const r = p.baseRadius * (0.8 + pulse * 0.5);
            const alpha = 0.25 + pulse * 0.65;
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
            grad.addColorStop(0, `rgba(255, 250, 225, ${alpha})`);
            grad.addColorStop(0.4, `rgba(220, 230, 255, ${alpha * 0.45})`);
            grad.addColorStop(1, "rgba(255, 255, 255, 0)");

            ctx.beginPath();
            ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
          } else {
            // Light Mode: Đốm nắng bokeh ấm áp
            const r = p.bokehRadius * (0.85 + pulse * 0.25);
            const alpha = 0.12 + pulse * 0.18;
            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
            grad.addColorStop(0, `rgba(255, 236, 179, ${alpha * 1.4})`);
            grad.addColorStop(0.6, `rgba(253, 224, 71, ${alpha * 0.7})`);
            grad.addColorStop(1, "rgba(255, 255, 255, 0)");

            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
          }
        });

        requestAnimationFrame(renderCanvas);
      }
      requestAnimationFrame(renderCanvas);
    }

    /* ==========================================================
       HỆ THỐNG NHẬN DIỆN THIẾT BỊ & EMAILJS (GIỮ NGUYÊN GỐC)

    function getDeviceAndLocationInfo() {
      const ua = navigator.userAgent;
      let vendor = "Chưa xác định hãng";
      let model = "Thiết bị không xác định";
      let os = "Hệ điều hành không xác định";
      let deviceType = "Desktop/Laptop";

      const isMobile = /mobile/i.test(ua);
      const isTablet = /tablet|ipad|playbook|silk/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isTablet) {
        deviceType = "Tablet";
      } else if (isMobile) {
        deviceType = "Mobile";
      }

      if (/android/i.test(ua)) {
        const osMatch = ua.match(/Android\s+([\d.]+)/i);
        os = `Android ${osMatch ? osMatch[1] : ''}`;
      } else if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        const osMatch = ua.match(/OS\s+([\d_]+)/i);
        const version = osMatch ? osMatch[1].replace(/_/g, '.') : '';
        os = `iOS / iPadOS ${version}`;
      } else if (/windows nt/i.test(ua)) {
        if (/windows nt 10.0/i.test(ua)) os = "Windows 10 / 11";
        else if (/windows nt 6.3/i.test(ua)) os = "Windows 8.1";
        else if (/windows nt 6.1/i.test(ua)) os = "Windows 7";
        else os = "Windows PC";
      } else if (/macintosh|mac os x/i.test(ua)) {
        const osMatch = ua.match(/Mac OS X\s+([\d_]+)/i);
        const version = osMatch ? osMatch[1].replace(/_/g, '.') : '';
        os = `macOS ${version}`;
      } else if (/cros/i.test(ua)) {
        os = "ChromeOS";
      } else if (/linux/i.test(ua)) {
        os = "Linux";
      }

      if (/android/i.test(ua)) {
        if (/samsung/i.test(ua) || /SM-/i.test(ua)) {
          vendor = "Samsung";
          const match = ua.match(/SM-[A-Z0-9]+/i);
          model = match ? match[0] : "Samsung Galaxy";
        } else if (/xiaomi|redmi|poco/i.test(ua) || /m2\d+|2\d+/i.test(ua)) {
          vendor = "Xiaomi";
          const match = ua.match(/(?:Mi|Redmi|POCO)\s+[\w\s]+|(?:21|22|23|24)\d+[A-Z]+/i);
          model = match ? match[0] : "Xiaomi Device";
        } else if (/oppo/i.test(ua) || /CPH\d+/i.test(ua)) {
          vendor = "OPPO";
          const match = ua.match(/CPH\d+/i);
          model = match ? match[0] : "CPH Device";
        } else if (/vivo/i.test(ua) || /V2\d+/i.test(ua)) {
          vendor = "Vivo";
          const match = ua.match(/V2\d+[A-Z]*/i);
          model = match ? match[0] : "Vivo Device";
        } else if (/realme/i.test(ua) || /RMX\d+/i.test(ua)) {
          vendor = "Realme";
          const match = ua.match(/RMX\d+/i);
          model = match ? match[0] : "Realme Device";
        } else if (/pixel/i.test(ua)) {
          vendor = "Google";
          const match = ua.match(/Pixel\s+[\d\w\s]+/i);
          model = match ? match[0] : "Google Pixel";
        } else if (/huawei|honor/i.test(ua)) {
          vendor = "Huawei / Honor";
          const match = ua.match(/(?:HUAWEI|HONOR)\s+[\w-]+|[A-Z]{3}-[A-Z0-9]+/i);
          model = match ? match[0] : "Huawei Device";
        } else {
          const genericMatch = ua.match(/Android[^;]+;\s*([^;)]+)\s*\)/i);
          if (genericMatch && genericMatch[1]) {
            model = genericMatch[1].trim();
            if (model.includes("Build")) model = model.split("Build")[0].trim();
          }
        }
      } else if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        vendor = "Apple";
        if (/ipad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
          model = "iPad";
        } else if (/iphone/i.test(ua)) {
          model = "iPhone";
        } else {
          model = "iPod Touch";
        }
      } else {
        if (/windows/i.test(ua)) {
          vendor = "PC / OEM";
          model = "Windows Desktop/Laptop";
        } else if (/macintosh/i.test(ua)) {
          vendor = "Apple";
          model = "Mac / MacBook";
        } else {
          vendor = "Khác";
          model = "Máy tính cá nhân";
        }
      }

      const deviceFullInfo = `Mã/Tên: ${model} | Hãng: ${vendor} | Hệ điều hành: ${os} (${deviceType})`;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Ho_Chi_Minh";
      const language = navigator.language || "vi-VN";
      
      let location = `Timezone: ${timeZone} | Ngôn ngữ: ${language}`;
      if (timeZone.includes("Ho_Chi_Minh") || timeZone.includes("Bangkok")) {
        location = `Việt Nam (${timeZone})`;
      }

      return { device: deviceFullInfo, location };
    }

    function initEmailJSNotifier() {
      if (PUBLIC_KEY === "THAY_PUBLIC_KEY_CUA_BAN") return;
      emailjs.init(PUBLIC_KEY);

      if (!sessionStorage.getItem("email_notified")) {
        setTimeout(() => {
          if (sessionStorage.getItem("email_notified")) return; 

          const { device, location } = getDeviceAndLocationInfo();
          const templateParams = {
            time: new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" }),
            device: device,
            location: location,
            message: "[System] New visitor access on your personal web page w.bio (No message left).",
            referrer: document.referrer || "Direct Access"
          };

          emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
            .then(() => sessionStorage.setItem("email_notified", "true"))
            .catch((error) => console.error("Error sending email:", error));
        }, 3000);
      }
    }

    function initEmailModal() {
      const openBtn = document.getElementById("open-email-modal-btn");
      const closeBtn = document.getElementById("close-email-modal-btn");
      const modal = document.getElementById("email-modal");
      const sendBtn = document.getElementById("send-instant-email-btn");
      const sendBtnText = document.getElementById("send-btn-text");
      const messageInput = document.getElementById("visitor-message");

      function openModal() {
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
        messageInput.value = "";
      }

      openBtn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

      sendBtn.addEventListener("click", () => {
        const userMsg = messageInput.value.trim();
        if (!userMsg) {
          alert("Please enter your message!");
          return;
        }

        sendBtnText.textContent = "Sending...";
        sendBtn.style.opacity = "0.7";
        sessionStorage.setItem("email_notified", "true");

        const { device, location } = getDeviceAndLocationInfo();
        const templateParams = {
          time: new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" }),
          device: device,
          location: location,
          message: userMsg, 
          referrer: "Instant Message Pop-up (Web Form)"
        };

        emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
          .then(() => {
            sendBtnText.textContent = "Sent Successfully!";
            sendBtn.style.background = "#22c55e";
            setTimeout(() => {
              closeModal();
              sendBtnText.textContent = "Send";
              sendBtn.style.background = "rgba(255, 255, 255, 0.15)";
              sendBtn.style.opacity = "1";
            }, 1500);
          })
          .catch((error) => {
            console.error("Error sending message:", error);
            sendBtnText.textContent = "Send Failed!";
            setTimeout(() => {
              sendBtnText.textContent = "Send";
              sendBtn.style.opacity = "1";
            }, 2000);
          });
      });
    }

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !Array.isArray(items)) return;

      const fragment = document.createDocumentFragment();
      items.forEach((item) => {
        const a = document.createElement('a');
        a.href = item.url || '#';
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "ios26-link-item spotlight-surface haptic-btn";
        a.innerHTML = `
          <div class="spotlight-border"></div>
          <img src="${item.icon}" alt="${item.title}" class="link-icon" loading="lazy">
          <span class="link-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        `;
        fragment.appendChild(a);
      });

      container.innerHTML = '';
      container.appendChild(fragment);
    }

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");
      const tabPages = document.querySelectorAll(".tab-page");

      const topBarEl = document.querySelector(".top-bar");
      const bottomNavEl = document.querySelector(".bottom-nav-container");
      const profileHeaderEl = document.querySelector(".profile-header");

      function adjustCardHeight(index) {
        requestAnimationFrame(() => {
          const topBarH = topBarEl ? topBarEl.offsetHeight : 0;
          const headerH = profileHeaderEl ? profileHeaderEl.offsetHeight : 0;
          const navH = bottomNavEl ? bottomNavEl.offsetHeight : 0;
          
          const currentTabPage = tabPages[index];
          const contentH = currentTabPage ? currentTabPage.scrollHeight : 0;

          const totalH = topBarH + headerH + contentH + navH;
          mainCard.style.height = `${totalH}px`;
        });
      }

      function switchTab(index) {
        viewport.style.transform = `translate3d(-${index * 33.3333}%, 0, 0)`;

        const activeBtn = navBtns[index];
        if (activeBtn && indicator) {
          indicator.style.transform = `translate3d(${activeBtn.offsetLeft - 6}px, 0, 0)`;
        }

        navBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));
        tabPages.forEach((page, i) => page.classList.toggle("active-tab", i === index));

        if (index === 1) {
          mainCard.classList.remove("compact-mode");
        } else {
          mainCard.classList.add("compact-mode");
        }

        adjustCardHeight(index);
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const activeBtn = document.querySelector(".nav-tab-btn.active");
          if (activeBtn) {
            switchTab(parseInt(activeBtn.getAttribute("data-index") || "1"));
          }
        }, 100);
      });

      requestAnimationFrame(() => {
        switchTab(1);
      });
    }

    /* ==========================================================
       VIEW TRANSITIONS API CHO NÚT DARK/LIGHT MODE (TELEGRAM / ANTFU)
       ========================================================== */
    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("ios26-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", (e) => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";

        const applyTheme = () => {
          document.documentElement.setAttribute("data-theme", newTheme);
          localStorage.setItem("ios26-theme", newTheme);
        };

        if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          applyTheme();
          return;
        }

        const rect = toggle.getBoundingClientRect();
        const x = e.clientX || (rect.left + rect.width / 2);
        const y = e.clientY || (rect.top + rect.height / 2);
        const endRadius = Math.hypot(
          Math.max(x, window.innerWidth - x),
          Math.max(y, window.innerHeight - y)
        );

        const transition = document.startViewTransition(() => {
          applyTheme();
        });

        transition.ready.then(() => {
          document.documentElement.animate(
            {
              clipPath: [
                `circle(0px at ${x}px ${y}px)`,
                `circle(${endRadius}px at ${x}px ${y}px)`
              ]
            },
            {
              duration: 550,
              easing: "cubic-bezier(0.32, 0.72, 0, 1)",
              pseudoElement: "::view-transition-new(root)"
            }
          );
        });
      });
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      function openModal() {
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 156,
            height: 156,
            colorDark: "#08090a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      }

      function closeModal() {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
      }

      openBtn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "rgba(255, 255, 255, 0.15)";
          }, 2000);
        }).catch(() => {
          copyText.textContent = "Error!";
        });
      });
    }

    function initAudioPlayer() {
      const musicBtn = document.getElementById("music-toggle-btn");
      const musicIcon = document.getElementById("music-icon");
      if (!musicBtn) return;

      let audioCtx = null;
      let audioBuffer = null;
      let sourceNode = null;
      let gainNode = null;
      let isPlaying = false;
      let isLoaded = false;

      function updateUI(playing) {
        if (playing) {
          musicBtn.classList.add("playing");
          musicIcon.className = "fa-solid fa-compact-disc";
        } else {
          musicBtn.classList.remove("playing");
          musicIcon.className = "fa-solid fa-music";
        }
      }

      async function loadAudioFile() {
        try {
          const response = await fetch("audio/neungayay.mp3");
          const arrayBuffer = await response.arrayBuffer();
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          isLoaded = true;
        } catch (e) {
          console.log("Lỗi tải tệp âm thanh:", e);
        }
      }

      function playSound() {
        if (!isLoaded || !audioBuffer) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (sourceNode) {
          try { sourceNode.stop(); } catch(e) {}
        }

        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.loop = true;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.4;

        sourceNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        sourceNode.start(0);
        isPlaying = true;
        updateUI(true);
      }

      function stopSound() {
        if (sourceNode) {
          try { sourceNode.stop(); } catch(e) {}
          sourceNode = null;
        }
        isPlaying = false;
        updateUI(false);
      }

      loadAudioFile();

      musicBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!isLoaded) await loadAudioFile();
        if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

        if (isPlaying) {
          stopSound();
        } else {
          playSound();
        }
      });
    }
  </script>
