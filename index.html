<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhật Huy | Bio Link</title>

  <!-- Favicon từ images/email.png -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Font Google Inter & Plus Jakarta Sans (Đơn giản, sang trọng) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome & QRCode JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================
       BẢNG MÀU & HIỆU ỨNG LIQUID GLASS MỜ NHẸ (THẤY NỀN ĐỘNG)
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-base: #060913;
      --bg-gradient: radial-gradient(circle at 50% 30%, #172554 0%, #0b1329 55%, #030712 100%);
      
      /* Mờ vừa phải để thấy khối cầu phía sau */
      --glass-bg: rgba(15, 23, 42, 0.35);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      --glass-glow: rgba(56, 189, 248, 0.3);

      --text-title: #ffffff;
      --text-sub: #38bdf8;
      --text-quote: #e2e8f0;
      --text-author: #94a3b8;

      --pill-bg: rgba(30, 41, 59, 0.45);
      --pill-border: rgba(255, 255, 255, 0.18);
      
      --nav-bg: rgba(15, 23, 42, 0.5);
      --indicator-bg: #38bdf8;
      --indicator-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      --nav-icon-active: #0f172a;
      --nav-icon-inactive: #94a3b8;

      --link-bg: rgba(30, 41, 59, 0.4);
      --link-border: rgba(255, 255, 255, 0.15);
      --link-hover: rgba(51, 65, 85, 0.7);

      --arc-1: rgba(30, 58, 138, 0.6);
      --arc-2: rgba(30, 27, 75, 0.7);
      --arc-edge: rgba(186, 230, 253, 0.4);
    }

    :root[data-theme="light"] {
      --bg-base: #e0f2fe;
      --bg-gradient: radial-gradient(circle at 50% 30%, #f0f9ff 0%, #bae6fd 60%, #7dd3fc 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.38);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 25px 50px rgba(14, 165, 233, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.95);
      --glass-glow: rgba(2, 132, 199, 0.2);

      --text-title: #0f172a;
      --text-sub: #0284c7;
      --text-quote: #1e293b;
      --text-author: #475569;

      --pill-bg: rgba(255, 255, 255, 0.45);
      --pill-border: rgba(255, 255, 255, 0.8);

      --nav-bg: rgba(255, 255, 255, 0.5);
      --indicator-bg: #0284c7;
      --indicator-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
      --nav-icon-active: #ffffff;
      --nav-icon-inactive: #64748b;

      --link-bg: rgba(255, 255, 255, 0.48);
      --link-border: rgba(255, 255, 255, 0.85);
      --link-hover: rgba(255, 255, 255, 0.85);

      --arc-1: rgba(186, 230, 253, 0.7);
      --arc-2: rgba(125, 211, 252, 0.5);
      --arc-edge: rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-base);
      background-image: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 15px;
      transition: background 0.5s ease;
    }

    /* ==========================================================
       BACKGROUND NỀN CHUYỂN ĐỘNG LIQUID SPHERES
       ========================================================== */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glass-arc-sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, var(--arc-1) 0%, var(--arc-2) 70%, transparent 100%);
      border: 1.5px solid var(--arc-edge);
      box-shadow: 0 0 50px rgba(2, 132, 199, 0.15), inset 0 0 30px var(--arc-edge);
      backdrop-filter: blur(6px);
      animation: floatArc 16s infinite ease-in-out alternate;
    }

    .arc-1 { width: 500px; height: 500px; top: -140px; left: -160px; animation-duration: 18s; }
    .arc-2 { width: 460px; height: 460px; bottom: -110px; right: -130px; animation-duration: 14s; }
    .arc-center { width: 300px; height: 300px; top: 45%; left: 48%; transform: translate(-50%, -50%); opacity: 0.7; animation-duration: 12s; }

    @keyframes floatArc {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(35px, 25px) scale(1.05) rotate(8deg); }
      100% { transform: translate(-25px, 45px) scale(0.95) rotate(-8deg); }
    }

    /* ==========================================================
       MAIN CARD CONTAINER (KHUNG KÍNH MỜ BẢO ĐẢM THẤY NỀN)
       ========================================================== */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      height: 740px;
      max-height: 94vh;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: glassAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes glassAppear {
      from { opacity: 0; transform: scale(0.95) translateY(15px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ==========================================================
       TOP BAR - TOGGLE DARK/LIGHT CÂN ĐỐI NÓNG LẠNH CHUẨN YÊU CẦU
       ========================================================== */
    .top-bar {
      padding: 20px 24px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .theme-toggle-pill {
      position: relative;
      width: 72px;
      height: 36px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 2px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* Khối đánh dấu tròn trượt chính xác */
    .theme-indicator {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    /* QUY TẮC THEME DỰA VÀO CÂU HỎI:
       - Dark Theme -> Đánh dấu ở Icon Dark (Mặt trăng)
       - Light Theme -> Đánh dấu ở Icon Light (Mặt trời)
    */
    [data-theme="dark"] .theme-indicator {
      transform: translateX(0px); /* Nằm ở Mặt trăng bên trái */
      background: #38bdf8;
    }

    [data-theme="light"] .theme-indicator {
      transform: translateX(35px); /* Nằm ở Mặt trời bên phải */
      background: #f59e0b;
    }

    .theme-icon-box {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      z-index: 2;
      transition: color 0.3s ease;
    }

    [data-theme="dark"] .icon-moon { color: #0f172a; }
    [data-theme="dark"] .icon-sun { color: #94a3b8; }

    [data-theme="light"] .icon-moon { color: #64748b; }
    [data-theme="light"] .icon-sun { color: #ffffff; }

    .qr-glass-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qr-glass-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 18px var(--glass-glow);
    }

    /* ==========================================================
       DYNAMIC HEADER (AVATAR HUY.PNG & CAPTION CHÍNH GIỮA)
       ========================================================== */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 24px 0;
      z-index: 5;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-frame {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 3px;
      background: rgba(255, 255, 255, 0.5);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15), 0 0 20px var(--glass-glow);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.35s ease;
    }

    .avatar-frame:hover img { filter: grayscale(0%); }

    /* Nội dung Profile */
    .profile-info-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .profile-name-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 10px;
      letter-spacing: -0.3px;
    }

    .profile-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 1px;
    }

    /* CAPTION CÂU NÓI TRANG HOME */
    .home-quote-box {
      margin-top: 20px;
      padding: 0 15px;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    .quote-text {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--text-quote);
      line-height: 1.5;
      letter-spacing: 0.2px;
    }

    .quote-author {
      font-size: 0.82rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 8px;
      display: block;
    }

    /* TÍCH HỢP AUDIO PLAYER LIQUID GLASS */
    .audio-player-glass {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .audio-player-glass:hover {
      transform: scale(1.03);
      background: var(--link-hover);
    }

    .audio-play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--indicator-bg);
      color: var(--nav-icon-active);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .audio-info {
      text-align: left;
    }

    .audio-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-title);
    }

    .audio-sub {
      font-size: 0.72rem;
      color: var(--text-author);
    }

    /* KHI Ở TAB WORK/SOCIAL: CHỈ GIỮ AVATAR THU NHỎ */
    .liquid-card.compact-mode .avatar-frame {
      width: 78px;
      height: 78px;
    }

    .liquid-card.compact-mode .profile-info-block {
      opacity: 0;
      max-height: 0;
      transform: translateY(-8px);
      pointer-events: none;
      overflow: hidden;
    }

    /* ==========================================================
       VIEWPORT & SWIPEABLE TAB CONTENT
       ========================================================== */
    .viewport {
      flex: 1;
      display: flex;
      width: 300%;
      transform: translateX(-33.333%);
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: grab;
      margin-top: 10px;
    }

    .viewport:active { cursor: grabbing; }

    .tab-page {
      width: 33.333%;
      height: 100%;
      padding: 10px 24px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow-y: auto;
    }

    /* LINK CARDS */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .liquid-link-item {
      display: flex;
      align-items: center;
      padding: 13px 18px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(15px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .liquid-link-item:hover {
      transform: translateY(-3px) scale(1.02);
      background: var(--link-hover);
      box-shadow: 0 10px 25px var(--glass-glow);
    }

    .link-app-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 14px;
    }

    .link-text-label { flex: 1; text-align: left; }
    .link-chevron { font-size: 0.85rem; color: var(--text-sub); transition: transform 0.3s; }
    .liquid-link-item:hover .link-chevron { transform: translateX(4px); }

    /* ==========================================================
       THANH CHUYỂN TAB BÊN DƯỚI (100% HIỂN THỊ ĐẸP CẢ DESKTOP & MOBILE)
       ========================================================== */
    .bottom-nav-container {
      padding: 0 20px 20px;
      z-index: 20;
      width: 100%;
    }

    .bottom-nav-glass {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 32px;
      padding: 4px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    /* Khối Indicator trượt chuẩn 100% không lệch */
    .nav-indicator-pill {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(33.333% - 5.33px);
      height: calc(100% - 8px);
      background: var(--indicator-bg);
      border-radius: 28px;
      box-shadow: var(--indicator-shadow);
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    .nav-tab-btn {
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: var(--nav-icon-inactive);
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: color 0.3s, transform 0.3s;
    }

    .nav-tab-btn.active {
      color: var(--nav-icon-active);
      transform: scale(1.1);
    }

    /* ==========================================================
       MODAL QR CODE CÂN ĐỐI
       ========================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(6, 9, 19, 0.6);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      border: 1.5px solid var(--glass-border);
      border-radius: 36px;
      padding: 24px 20px;
      width: 88%;
      max-width: 310px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 0 25px var(--glass-glow);
      transform: scale(0.88);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .qr-glass-card { transform: scale(1); }

    .qr-modal-header {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-title);
      margin-bottom: 14px;
    }

    .qr-box-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
      padding: 10px;
      background: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas {
      width: 100% !important;
      height: 100% !important;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode-canvas img { border-radius: 10px; }

    .qr-center-avatar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      object-fit: cover;
      pointer-events: none;
    }

    .copy-link-btn {
      width: 100%;
      margin-top: 16px;
      padding: 11px;
      border: none;
      background: var(--indicator-bg);
      color: var(--nav-icon-active);
      font-weight: 700;
      font-size: 0.92rem;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      transition: all 0.25s ease;
    }

    .close-modal-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND LIQUID SPHERES -->
  <div class="bg-canvas">
    <div class="glass-arc-sphere arc-1"></div>
    <div class="glass-arc-sphere arc-2"></div>
    <div class="glass-arc-sphere arc-center"></div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <!-- Theme Switcher với quy tắc hiển thị chuẩn -->
      <div class="theme-toggle-pill" id="theme-toggle">
        <div class="theme-indicator"></div>
        <div class="theme-icon-box icon-moon"><i class="fa-solid fa-moon"></i></div>
        <div class="theme-icon-box icon-sun"><i class="fa-solid fa-sun"></i></div>
      </div>

      <button class="qr-glass-btn" id="open-qr-btn" aria-label="Open QR">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>

    <!-- DYNAMIC PROFILE HEADER (AVATAR: images/Huy.png) -->
    <header class="profile-header">
      <div class="avatar-frame">
        <img src="images/Huy.png" alt="Avatar Nhật Huy">
      </div>
      <div class="profile-info-block">
        <h1 class="profile-name-title">Nhật Huy</h1>
        <p class="profile-subtitle">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT CHUYỂN TAB -->
    <div class="viewport" id="viewport">

      <!-- TAB 1: SOCIAL MEDIA -->
      <section class="tab-page" id="page-social">
        <div class="links-list" id="social-links-list"></div>
      </section>

      <!-- TAB 2: HOME (CAPTION & AUDIO PLAYER) -->
      <section class="tab-page" id="page-home">
        <div class="home-quote-box">
          <p class="quote-text">“Even the darkest night will end,<br>and the sun will rise”</p>
          <span class="quote-author">Les Misérables - Victor Hugo</span>
        </div>

        <!-- Trình phát nhạc tự chọn -->
        <div class="audio-player-glass" id="audio-toggle-btn">
          <button class="audio-play-btn" id="play-icon">
            <i class="fa-solid fa-play"></i>
          </button>
          <div class="audio-info">
            <div class="audio-title">Phát nhạc nền</div>
            <div class="audio-sub">Một Đứa Trẻ Gai Góc</div>
          </div>
        </div>

        <!-- File âm thanh liên kết ngầm -->
        <audio id="bg-audio" loop src="https://v16-webapp-prime.us.tiktok.com/video/tos/useast2a/tos-useast2a-pve-0037c001-aiso/oAnQyMCEfA05iDE3XIBIebg3pIBPgeD7eUARi7/?a=1988&bti=OU1TOTY1QDRjM2M1Y2A1&ch=0&cr=3&dr=0&lr=all&cd=0%7C0%7C0%7C&cv=1&br=2560&bt=1280&cs=0&ds=6&ft=4b~KM4yq8Zmo0dC2c64jV4m4PpWrK2m~p~E&mime_type=video_mp4&qs=0&rc=Z2U0N2UzZmg3ODg1N2k1OEBpM2V1dng5cnN1czMzNzczM0A1Y142LTIvXzExNTQxLjMuYSNuMXJqcjRvcG1gLS1kLTRzc3M%3D&btag=e00090000&expire=1728038400&l=20261003135900&ply_type=2&policy=2&signature=0&tk=tt_chain_token"></audio>
      </section>

      <!-- TAB 3: WORK -->
      <section class="tab-page" id="page-work">
        <div class="links-list" id="work-links-list"></div>
      </section>

    </div>

    <!-- THANH CHUYỂN TAB BÊN DƯỚI -->
    <div class="bottom-nav-container">
      <nav class="bottom-nav-glass">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social Tab">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home Tab">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work Tab">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="qr-glass-card">
      <h3 class="qr-modal-header">Scan QR Code</h3>
      
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar Center" class="qr-center-avatar">
      </div>

      <button class="copy-link-btn" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>

      <button class="close-modal-btn" id="close-qr-btn">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderLinks("social-links-list", bioData.tabs.social);
      renderLinks("work-links-list", bioData.tabs.work);

      initTabNavigation();
      initSwipeGesture();
      initThemeToggle();
      initQRCodeModal();
      initAudioPlayer();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="liquid-link-item">
          <img src="${item.icon}" alt="${item.title}" class="link-app-icon">
          <span class="link-text-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-chevron"></i>
        </a>
      `).join('');
    }

    let currentTabIndex = 1; // Mặc định ở Tab Home (Index = 1)

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");

      function switchTab(index) {
        currentTabIndex = index;

        // Trượt Viewport
        viewport.style.transform = `translateX(-${index * 33.333}%)`;
        
        // Trượt Indicator chính xác
        indicator.style.transform = `translateX(${index * 100}%)`;

        navBtns.forEach((btn, i) => {
          if (i === index) btn.classList.add("active");
          else btn.classList.remove("active");
        });

        // Toggle chế độ thu nhỏ Avatar khi sang Tab Social/Work
        if (index === 1) {
          mainCard.classList.remove("compact-mode");
        } else {
          mainCard.classList.add("compact-mode");
        }
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      window.switchTabGlobal = switchTab;
    }

    function initSwipeGesture() {
      const viewport = document.getElementById("viewport");
      let startX = 0;
      let currentX = 0;
      let isSwiping = false;

      viewport.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
        isSwiping = true;
      }, { passive: true });

      viewport.addEventListener("touchmove", (e) => {
        if (!isSwiping) return;
        currentX = e.touches[0].clientX;
      }, { passive: true });

      viewport.addEventListener("touchend", () => {
        if (!isSwiping) return;
        const diffX = startX - currentX;

        if (diffX > 45 && currentTabIndex < 2) {
          window.switchTabGlobal(currentTabIndex + 1);
        } else if (diffX < -45 && currentTabIndex > 0) {
          window.switchTabGlobal(currentTabIndex - 1);
        }

        isSwiping = false;
      });
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("liquid-theme") || "dark";
      
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("liquid-theme", newTheme);
      });
    }

    function initAudioPlayer() {
      const audioBtn = document.getElementById("audio-toggle-btn");
      const audio = document.getElementById("bg-audio");
      const playIcon = document.getElementById("play-icon").querySelector("i");
      let isPlaying = false;

      audioBtn.addEventListener("click", () => {
        if (isPlaying) {
          audio.pause();
          playIcon.className = "fa-solid fa-play";
        } else {
          audio.play().catch(e => console.log("Audio play blocked", e));
          playIcon.className = "fa-solid fa-pause";
        }
        isPlaying = !isPlaying;
      });
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = bioData.profile.shareUrl || window.location.href;
      let qrGenerated = false;

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 160,
            height: 160,
            colorDark: "#060913",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";
          copyBtn.style.color = "#ffffff";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--indicator-bg)";
            copyBtn.style.color = "var(--nav-icon-active)";
          }, 2000);
        });
      });

      closeBtn.addEventListener("click", () => modal.classList.remove("active"));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("active");
      });
    }
  </script>
</body>
</html>
