<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link - Nhật Huy</title>
    <!-- Font chữ Inter thanh lịch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện QRCodeJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root[data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 50%, #f3e8ff 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-color: #2d3748;
            --text-sub: #718096;
            --btn-bg: rgba(255, 255, 255, 0.85);
            --btn-hover-bg: #ffffff;
            --btn-border: rgba(226, 232, 240, 0.8);
            --shadow-color: rgba(148, 163, 184, 0.12);
            --shadow-hover: rgba(148, 163, 184, 0.25);
            --modal-bg: rgba(255, 255, 255, 0.95);
            --accent-color: #6366f1;
        }

        :root[data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --btn-bg: rgba(30, 41, 59, 0.8);
            --btn-hover-bg: rgba(51, 65, 85, 0.9);
            --btn-border: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(0, 0, 0, 0.5);
            --modal-bg: rgba(30, 41, 59, 0.95);
            --accent-color: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        /* Container Chính */
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px var(--shadow-color);
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Thanh Nút Bấm Top */
        .top-tools {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .tool-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 4px 10px var(--shadow-color);
        }

        .tool-btn:hover {
            transform: scale(1.08);
            background: var(--btn-hover-bg);
        }

        /* Profile */
        .profile {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--btn-hover-bg);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* Khung Nút Bấm Link */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 50px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 12px var(--shadow-color);
            position: relative;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: var(--btn-hover-bg);
            box-shadow: 0 8px 20px var(--shadow-hover);
        }

        .app-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: #fff;
            padding: 2px;
        }

        .link-title {
            flex: 1;
        }

        .arrow-icon {
            color: var(--text-sub);
            font-size: 0.85rem;
            opacity: 0.6;
            margin-right: 4px;
        }

        .link-card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(3px);
        }

        /* Pop-up Modal QR Code Tích Hợp Link Chia Sẻ */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            max-width: 340px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .qr-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
            padding: 14px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        /* Khung Link bên trong Modal */
        .link-box {
            display: flex;
            align-items: center;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-top: 12px;
            gap: 8px;
        }

        .link-input {
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 0.82rem;
            width: 100%;
            outline: none;
            text-overflow: ellipsis;
        }

        .copy-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .download-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: var(--btn-hover-bg);
        }

        .footer-text {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nút Công Cụ Top -->
        <div class="top-tools">
            <button class="tool-btn" id="qrBtn" title="Chia sẻ Mã QR">
                <i class="fa-solid fa-qrcode"></i>
            </button>
            <button class="tool-btn" id="themeToggleBtn" title="Đổi giao diện">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>

        <!-- Khung Profile -->
        <div class="profile">
            <div class="avatar-wrapper">
                <img id="userAvatar" class="avatar" src="" alt="Avatar">
            </div>
            <h1 id="userName" class="profile-name"></h1>
            <p id="userBio" class="profile-bio"></p>
        </div>

        <!-- Danh sách liên kết -->
        <div class="links-list" id="linksContainer"></div>

        <div class="footer-text">
            © <span id="year"></span> Nhật Huy. All rights reserved.
        </div>
    </div>

    <!-- Modal hiển thị QR Code & Chia Sẻ Link -->
    <div class="modal" id="qrModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <h3 style="margin-bottom: 4px; font-size: 1.1rem;">Mã QR Chia Sẻ</h3>
            <p style="font-size: 0.82rem; color: var(--text-sub);">Quét để xem trang cá nhân của Nhật Huy</p>
            
            <!-- Khung chứa ảnh mã QR -->
            <div class="qr-box">
                <div id="qrcode"></div>
            </div>

            <!-- Khung chứa Link & Sao chép -->
            <div class="link-box">
                <input type="text" id="shareUrlInput" class="link-input" readonly>
                <button class="copy-btn" id="copyBtn">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <!-- Nút tải ảnh QR về máy -->
            <button class="download-btn" id="downloadQrBtn">
                <i class="fa-solid fa-download"></i> Tải ảnh QR
            </button>
        </div>
    </div>

    <!-- Nhập tệp data.js -->
    <script src="data.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Render Dữ liệu từ data.js
            document.getElementById("userName").textContent = bioData.profile.name;
            document.getElementById("userBio").textContent = bioData.profile.bio;
            document.getElementById("userAvatar").src = bioData.profile.avatar;
            document.getElementById("year").textContent = new Date().getFullYear();

            // Link dùng để chia sẻ (Ưu tiên shareUrl trong data.js, nếu trống sẽ tự lấy link trang hiện tại)
            const targetShareUrl = bioData.profile.shareUrl && bioData.profile.shareUrl.trim() !== "" 
                ? bioData.profile.shareUrl 
                : window.location.href;

            document.getElementById("shareUrlInput").value = targetShareUrl;

            // Render Danh sách Link
            const container = document.getElementById("linksContainer");
            bioData.links.forEach(link => {
                const a = document.createElement("a");
                a.className = "link-card";
                a.href = link.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                
                a.innerHTML = `
                    <img class="app-icon" src="${link.icon}" alt="${link.title}">
                    <span class="link-title">${link.title}</span>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                `;
                container.appendChild(a);
            });

            // 2. Chức năng Đổi Theme Light/Dark Mode
            const themeToggleBtn = document.getElementById("themeToggleBtn");
            const themeIcon = document.getElementById("themeIcon");
            const htmlTag = document.documentElement;

            themeToggleBtn.addEventListener("click", () => {
                const currentTheme = htmlTag.getAttribute("data-theme");
                const newTheme = currentTheme === "light" ? "dark" : "light";
                htmlTag.setAttribute("data-theme", newTheme);
                
                themeIcon.className = newTheme === "light" ? "fa-solid fa-moon" : "fa-solid fa-sun";
            });

            // 3. Xử lý Mã QR & Link Chia Sẻ
            const qrBtn = document.getElementById("qrBtn");
            const qrModal = document.getElementById("qrModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const qrContainer = document.getElementById("qrcode");
            const copyBtn = document.getElementById("copyBtn");
            const downloadQrBtn = document.getElementById("downloadQrBtn");
            let qrGenerated = false;

            // Mở Modal và tạo Mã QR
            qrBtn.addEventListener("click", () => {
                qrModal.classList.add("active");
                if (!qrGenerated) {
                    new QRCode(qrContainer, {
                        text: targetShareUrl,
                        width: 170,
                        height: 170,
                        colorDark : "#1e293b",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                    qrGenerated = true;
                }
            });

            // Đóng Modal
            closeModalBtn.addEventListener("click", () => qrModal.classList.remove("active"));
            qrModal.addEventListener("click", (e) => {
                if (e.target === qrModal) qrModal.classList.remove("active");
            });

            // Sao chép Link
            copyBtn.addEventListener("click", () => {
                const copyText = document.getElementById("shareUrlInput");
                navigator.clipboard.writeText(copyText.value).then(() => {
                    copyBtn.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    setTimeout(() => {
                        copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i>`;
                    }, 2000);
                });
            });

            // Tải Ảnh Mã QR về máy
            downloadQrBtn.addEventListener("click", () => {
                const img = qrContainer.querySelector("img");
                if (img) {
                    const a = document.createElement("a");
                    a.href = img.src;
                    a.download = "Bio-QR-NhatHuy.png";
                    a.click();
                }
            });
        });
    </script>
</body>
</html>
