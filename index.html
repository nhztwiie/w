<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Nhật Huy | w.bio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Icons & QRCode JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

  <style>
    /* ==========================================================
       iOS 26 LIQUID GLASS SYSTEM - HIGH PERFORMANCE MOBILE ENGINE
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a 0%, #030712 65%, #000000 100%);
      
      --glass-bg: rgba(15, 23, 42, 0.42);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-highlight: rgba(255, 255, 255, 0.5);
      --glass-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(255, 255, 255, 0.35),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5);
      --glass-glow: rgba(56, 189, 248, 0.35);

      --text-title: #ffffff;
      --text-sub: #38bdf8;
      --text-quote: #f8fafc;
      --text-author: #94a3b8;

      --pill-bg: rgba(255, 255, 255, 0.07);
      --pill-border: rgba(255, 255, 255, 0.2);
      --pill-hover-bg: rgba(56, 189, 248, 0.18);
      --pill-hover-border: rgba(56, 189, 248, 0.6);
      --pill-hover-glow: 0 10px 25px rgba(56, 189, 248, 0.3);

      --dock-bg: rgba(15, 23, 42, 0.58);
      --dock-border: rgba(255, 255, 255, 0.25);
      --indicator-bg: linear-gradient(135deg, rgba(56, 189, 248, 0.45) 0%, rgba(129, 140, 248, 0.35) 100%);
      --indicator-border: rgba(56, 189, 248, 0.75);

      --orb-1: rgba(99, 102, 241, 0.65);
      --orb-2: rgba(56, 189, 248, 0.55);
      --orb-3: rgba(236, 72, 153, 0.45);
    }

    :root[data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #bae6fd 50%, #38bdf8 100%);

      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-border-highlight: rgba(255, 255, 255, 1);
      --glass-shadow: 
        0 20px 45px rgba(14, 165, 233, 0.2),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 3px rgba(14, 165, 233, 0.15);
      --glass-glow: rgba(2, 132, 199, 0.25);

      --text-title: #0f172a;
      --text-sub: #0284c7;
      --text-quote: #0f172a;
      --text-author: #475569;

      --pill-bg: rgba(255, 255, 255, 0.78);
      --pill-border: rgba(255, 255, 255, 0.95);
      --pill-hover-bg: rgba(255, 255, 255, 0.98);
      --pill-hover-border: #0284c7;
      --pill-hover-glow: 0 10px 25px rgba(14, 165, 233, 0.25);

      --dock-bg: rgba(255, 255, 255, 0.68);
      --dock-border: rgba(255, 255, 255, 0.95);
      --indicator-bg: linear-gradient(135deg, rgba(186, 230, 253, 0.95) 0%, rgba(125, 211, 252, 0.8) 100%);
      --indicator-border: rgba(2, 132, 199, 0.7);

      --orb-1: rgba(14, 165, 233, 0.7);
      --orb-2: rgba(56, 189, 248, 0.6);
      --orb-3: rgba(244, 114, 182, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px;
      transition: background 0.4s ease;
    }

    /* DYNAMIC BACKGROUND SPHERES - GPU OPTIMIZED */
    .ios26-bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      will-change: transform;
      animation: floatFluid 14s infinite ease-in-out alternate;
    }

    .orb-primary {
      width: 380px; height: 380px;
      top: -100px; left: -80px;
      background: radial-gradient(circle at 35% 35%, var(--orb-1) 0%, transparent 70%);
      animation-duration: 12s;
    }

    .orb-secondary {
      width: 350px; height: 350px;
      bottom: -80px; right: -60px;
      background: radial-gradient(circle at 35% 35%, var(--orb-2) 0%, transparent 70%);
      animation-duration: 10s;
    }

    .orb-accent {
      width: 280px; height: 280px;
      top: 35%; left: 20%;
      background: radial-gradient(circle at 35% 35%, var(--orb-3) 0%, transparent 70%);
      animation-duration: 15s;
    }

    @keyframes floatFluid {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(40px, -30px, 0) scale(1.1); }
      100% { transform: translate3d(-30px, 30px, 0) scale(0.95); }
    }

    .glass-mesh-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.4;
    }

    /* MAIN CARD CONTAINER */
    .liquid-card-ios26 {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 414px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.3s ease, border-color 0.3s ease;
      will-change: transform;
      transform: translate3d(0,0,0);
    }

    .liquid-card-ios26::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--glass-border-highlight), transparent);
      z-index: 15;
    }

    /* TOP BAR */
    .top-bar {
      padding: 18px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-track {
      position: relative;
      width: 74px;
      height: 40px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.2s ease;
    }

    .theme-toggle-track:active { transform: scale(0.95); }

    .theme-orb-indicator {
      position: absolute;
      top: 3px; left: 3px;
      width: 31px; height: 31px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8 0%, #818cf8 100%);
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }

    .orb-icon {
      font-size: 0.85rem;
      transition: opacity 0.25s ease, transform 0.25s ease;
      position: absolute;
    }

    .icon-sun { 
      opacity: 0; 
      transform: scale(0.5) rotate(-90deg); 
      color: #f59e0b;
    }
    
    .icon-moon { 
      opacity: 1; 
      transform: scale(1) rotate(0deg); 
      color: #ffffff;
    }

    [data-theme="light"] .theme-orb-indicator {
      transform: translate3d(34px, 0, 0);
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fef08a 60%, #fde047 100%);
    }
    [data-theme="light"] .icon-sun { opacity: 1; transform: scale(1) rotate(0deg); }
    [data-theme="light"] .icon-moon { opacity: 0; transform: scale(0.5) rotate(90deg); }

    .glass-btn-ios26 {
      width: 40px; height: 40px;
      border-radius: 16px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
      transition: transform 0.2s ease;
    }

    .glass-btn-ios26:active { transform: scale(0.92); }

    .music-btn.playing i {
      animation: spinMusic 3s linear infinite;
      color: var(--text-sub);
    }

    @keyframes spinMusic {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* PROFILE HEADER */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 20px 4px;
      z-index: 15;
      flex-shrink: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      will-change: transform, opacity;
    }

    .avatar-ring {
      position: relative;
      width: 96px; height: 96px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.1) 100%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25), 0 0 25px var(--glass-glow);
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.3s ease;
    }

    .avatar-ring:active img { filter: grayscale(0%); }

    .profile-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      will-change: transform, opacity;
    }

    .profile-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 10px;
      letter-spacing: -0.02em;
    }

    .profile-tagline {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* COMPACT MODE FOR TABS */
    .liquid-card-ios26.compact-mode .profile-header {
      transform: translate3d(0, -8px, 0) scale(0.85);
      margin-bottom: -35px;
    }

    .liquid-card-ios26.compact-mode .profile-meta {
      opacity: 0;
      transform: translate3d(0, -10px, 0);
      pointer-events: none;
    }

    /* VIEWPORT SLIDER */
    .viewport-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .viewport {
      width: 300%;
      display: flex;
      align-items: flex-start;
      transform: translate3d(-33.3333%, 0, 0);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .tab-page {
      width: 33.3333%;
      padding: 10px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .ios26-quote-card {
      margin: 6px 0 12px;
      padding: 20px 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--glass-border);
      border-radius: 26px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }

    .quote-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-quote);
      line-height: 1.5;
    }

    .quote-author {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 12px;
      display: block;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ios26-link-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 12px 18px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.92rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.25);
      overflow: hidden;
      transition: transform 0.2s ease, background 0.2s ease;
      will-change: transform;
    }

    .ios26-link-item:active { transform: scale(0.97); }

    .link-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      margin-right: 12px;
      object-fit: cover;
    }

    .link-label { flex: 1; text-align: left; }
    .link-arrow { font-size: 0.8rem; color: var(--text-sub); }

    /* BOTTOM NAV DOCK */
    .bottom-nav-container {
      padding: 4px 18px 18px;
      z-index: 30;
      width: 100%;
      flex-shrink: 0;
    }

    .ios26-nav-dock {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--dock-bg);
      border: 1.5px solid var(--dock-border);
      border-radius: 36px;
      padding: 5px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.3), 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 5px; left: 5px;
      width: calc((100% - 10px) / 3);
      height: calc(100% - 10px);
      background: var(--indicator-bg);
      border: 1.5px solid var(--indicator-border);
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
      will-change: transform;
    }

    .nav-tab-btn {
      flex: 1;
      height: 42px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .nav-tab-btn i {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.25s ease, transform 0.25s ease;
    }

    [data-theme="light"] .nav-tab-btn i { color: #64748b; }

    .nav-tab-btn.active i {
      color: var(--text-title);
      transform: scale(1.15);
    }

    [data-theme="light"] .nav-tab-btn.active i { color: #0284c7; }

    /* MODAL QR CODE */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(3, 7, 18, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .qr-glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid var(--glass-border-highlight);
      border-radius: 36px;
      padding: 24px 20px;
      width: 85%;
      max-width: 300px;
      text-align: center;
      transform: translate3d(0, 15px, 0) scale(0.92);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
      box-shadow: var(--glass-shadow);
    }

    .modal-backdrop.active .qr-glass-card { transform: translate3d(0, 0, 0) scale(1); }
    .qr-title { font-size: 1.15rem; font-weight: 700; color: var(--text-title); margin-bottom: 16px; }

    .qr-box-wrapper {
      position: relative;
      width: 170px; height: 170px;
      margin: 0 auto;
      padding: 10px;
      background: #ffffff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas { width: 100% !important; height: 100% !important; display: flex; justify-content: center; align-items: center; }
    #qrcode-canvas img { border-radius: 10px; }

    .qr-avatar-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      object-fit: cover;
    }

    .btn-copy-link {
      width: 170px;
      margin: 16px auto 0;
      padding: 10px;
      border: none;
      background: var(--text-sub);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-close-modal {
      margin-top: 12px;
      width: 100%;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND SPHERES -->
  <div class="ios26-bg-canvas">
    <div class="liquid-orb orb-primary"></div>
    <div class="liquid-orb orb-secondary"></div>
    <div class="liquid-orb orb-accent"></div>
  </div>
  <div class="glass-mesh-overlay"></div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card-ios26" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="theme-toggle-track" id="theme-toggle" role="button" aria-label="Toggle Theme">
        <div class="theme-orb-indicator">
          <i class="fa-solid fa-moon orb-icon icon-moon"></i>
          <i class="fa-solid fa-sun orb-icon icon-sun"></i>
        </div>
      </div>

      <div class="top-bar-controls">
        <button class="glass-btn-ios26 music-btn" id="music-toggle-btn" aria-label="Toggle Music">
          <i class="fa-solid fa-music" id="music-icon"></i>
        </button>

        <button class="glass-btn-ios26" id="open-qr-btn" aria-label="Open QR Code">
          <i class="fa-solid fa-qrcode"></i>
        </button>
      </div>
    </div>

    <!-- PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-ring">
        <img src="images/Huy.png" alt="Avatar Nhật Huy" loading="eager">
      </div>
      <div class="profile-meta">
        <h1 class="profile-name">Nhật Huy</h1>
        <p class="profile-tagline">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT SLIDER -->
    <div class="viewport-wrapper">
      <div class="viewport" id="viewport">

        <!-- TAB 1: SOCIAL -->
        <section class="tab-page" id="page-social">
          <div class="links-list" id="social-links-list"></div>
        </section>

        <!-- TAB 2: HOME (QUOTE) -->
        <section class="tab-page" id="page-home">
          <div class="ios26-quote-card">
            <p class="quote-text">“<br>Even the darkest night will end,<br>and the sun will rise.</p>
            <span class="quote-author">Les Misérables - Victor Hugo</span>
          </div>
        </section>

        <!-- TAB 3: WORK -->
        <section class="tab-page" id="page-work">
          <div class="links-list" id="work-links-list"></div>
        </section>

      </div>
    </div>

    <!-- NAVIGATION DOCK CAPSULE -->
    <div class="bottom-nav-container">
      <nav class="ios26-nav-dock">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal" role="dialog" aria-hidden="true">
    <div class="qr-glass-card">
      <h3 class="qr-title">Scan QR Code</h3>
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar" class="qr-avatar-center">
      </div>
      <button class="btn-copy-link" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>
      <button class="btn-close-modal" id="close-qr-btn">Close</button>
    </div>
  </div>

  <!-- AUDIO ELEMENT -->
  <audio id="bg-music" src="audio/neungayay.mp3" loop preload="auto"></audio>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof bioData !== 'undefined' && bioData.tabs) {
        renderLinks("social-links-list", bioData.tabs.social);
        renderLinks("work-links-list", bioData.tabs.work);
      }

      initTabNavigation();
      initThemeToggle();
      initQRCodeModal();
      initParallaxEffect();
      initAudioPlayer();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !Array.isArray(items)) return;

      const fragment = document.createDocumentFragment();
      items.forEach(item => {
        const a = document.createElement('a');
        a.href = item.url || '#';
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "ios26-link-item";
        a.innerHTML = `
          <img src="${item.icon}" alt="${item.title}" class="link-icon" loading="lazy">
          <span class="link-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        `;
        fragment.appendChild(a);
      });

      container.innerHTML = '';
      container.appendChild(fragment);
    }

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");

      function switchTab(index) {
        // Dùng CSS Transform 3D giúp mượt hơn trên GPU
        viewport.style.transform = `translate3d(-${index * 33.3333}%, 0, 0)`;

        const activeBtn = navBtns[index];
        if (activeBtn && indicator) {
          indicator.style.transform = `translate3d(${activeBtn.offsetLeft - 5}px, 0, 0)`;
        }

        navBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));

        if (index === 1) {
          mainCard.classList.remove("compact-mode");
        } else {
          mainCard.classList.add("compact-mode");
        }
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      // Mặc định mở Tab Home (index 1)
      switchTab(1);
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("ios26-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("ios26-theme", newTheme);
      });
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      function openModal() {
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
        if (!qrGenerated && typeof QRCode !== 'undefined') {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 150,
            height: 150,
            colorDark: "#030712",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      }

      function closeModal() {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
      }

      openBtn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--text-sub)";
          }, 2000);
        }).catch(() => {
          copyText.textContent = "Error!";
        });
      });
    }

    function initParallaxEffect() {
      const card = document.getElementById("main-card");
      // Bỏ qua parallax trên màn hình cảm ứng để tiết kiệm pin & tối ưu FPS
      if (!card || window.innerWidth < 768 || ('ontouchstart' in window)) return;

      let ticking = false;
      document.addEventListener("mousemove", (e) => {
        if (!ticking) {
          window.requestAnimationFrame(() => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `translate3d(0,0,0) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            ticking = false;
          });
          ticking = true;
        }
      });
    }

    function initAudioPlayer() {
      const musicBtn = document.getElementById("music-toggle-btn");
      const musicIcon = document.getElementById("music-icon");
      const audio = document.getElementById("bg-music");

      if (!audio || !musicBtn) return;

      audio.volume = 0.4;
      let isPlaying = false;

      function toggleMusic() {
        if (isPlaying) {
          audio.pause();
          musicBtn.classList.remove("playing");
          musicIcon.className = "fa-solid fa-music";
        } else {
          audio.play().then(() => {
            musicBtn.classList.add("playing");
            musicIcon.className = "fa-solid fa-compact-disc";
          }).catch(err => {
            console.log("Không thể phát nhạc:", err);
          });
        }
        isPlaying = !isPlaying;
      }

      musicBtn.addEventListener("click", toggleMusic);
    }
  </script>
</body>
