<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhật Huy | Bio Link</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome & QRCode Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================
       BẢNG MÀU & HIỆU ỨNG LIQUID GLASS SYSTEM
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-base: #030712;
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      
      --glass-bg: rgba(15, 23, 42, 0.52);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.3);
      --glass-glow: rgba(56, 189, 248, 0.35);

      --text-title: #ffffff;
      --text-sub: #38bdf8;
      --text-quote: #f8fafc;
      --text-author: #94a3b8;

      --toggle-track-bg: rgba(255, 255, 255, 0.12);
      --toggle-track-border: rgba(255, 255, 255, 0.25);
      --toggle-orb-bg: radial-gradient(circle at 35% 35%, #38bdf8 0%, #818cf8 50%, #1e1b4b 100%);
      --toggle-orb-glow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.8);

      --nav-dock-bg: rgba(15, 23, 42, 0.65);
      --nav-dock-border: rgba(255, 255, 255, 0.25);
      --nav-dock-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.4), inset 0 -2px 6px rgba(0, 0, 0, 0.5), 0 20px 45px rgba(0, 0, 0, 0.5);
      
      --indicator-pill-bg: rgba(56, 189, 248, 0.25);
      --indicator-pill-border: rgba(56, 189, 248, 0.6);
      --indicator-pill-glow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.6);
      
      --nav-icon-active: #ffffff;
      --nav-icon-inactive: rgba(255, 255, 255, 0.55);

      --link-bg: rgba(255, 255, 255, 0.08);
      --link-border: rgba(255, 255, 255, 0.18);
      --link-hover: rgba(56, 189, 248, 0.2);
      --link-shadow: 0 8px 22px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3);

      --qr-modal-bg: rgba(3, 7, 18, 0.75);
      --qr-card-bg: rgba(15, 23, 42, 0.75);
      --qr-card-border: rgba(255, 255, 255, 0.22);

      --arc-1: rgba(99, 102, 241, 0.35);
      --arc-2: rgba(56, 189, 248, 0.25);
      --arc-edge: rgba(255, 255, 255, 0.35);
    }

    :root[data-theme="light"] {
      --bg-base: #f0f9ff;
      --bg-gradient: radial-gradient(circle at 50% 20%, #ffffff 0%, #bae6fd 50%, #38bdf8 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 25px 50px rgba(14, 165, 233, 0.2), inset 0 1.5px 2px rgba(255, 255, 255, 1);
      --glass-glow: rgba(2, 132, 199, 0.35);

      --text-title: #0f172a;
      --text-sub: #0284c7;
      --text-quote: #0f172a;
      --text-author: #475569;

      --toggle-track-bg: rgba(255, 255, 255, 0.85);
      --toggle-track-border: rgba(255, 255, 255, 1);
      --toggle-orb-bg: radial-gradient(circle at 50% 50%, #fffbeb 0%, #fef08a 30%, #7dd3fc 85%, #38bdf8 100%);
      --toggle-orb-glow: 0 4px 18px rgba(253, 224, 71, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.95);

      --nav-dock-bg: rgba(255, 255, 255, 0.75);
      --nav-dock-border: rgba(255, 255, 255, 0.95);
      --nav-dock-shadow: inset 0 2px 4px rgba(255, 255, 255, 1), inset 0 -2px 6px rgba(14, 165, 233, 0.12), 0 20px 40px rgba(14, 165, 233, 0.25);
      
      --indicator-pill-bg: rgba(2, 132, 199, 0.25);
      --indicator-pill-border: rgba(2, 132, 199, 0.6);
      --indicator-pill-glow: 0 6px 20px rgba(2, 132, 199, 0.35), inset 0 1.5px 2px rgba(255, 255, 255, 0.95);
      
      --nav-icon-active: #0284c7;
      --nav-icon-inactive: #64748b;

      --link-bg: rgba(255, 255, 255, 0.78);
      --link-border: #ffffff;
      --link-hover: rgba(255, 255, 255, 0.95);
      --link-shadow: 0 10px 25px rgba(2, 132, 199, 0.22), inset 0 2px 3px rgba(255, 255, 255, 1);

      --qr-modal-bg: rgba(186, 230, 253, 0.65);
      --qr-card-bg: rgba(255, 255, 255, 0.92);
      --qr-card-border: rgba(255, 255, 255, 1);

      --arc-1: rgba(186, 230, 253, 0.85);
      --arc-2: rgba(125, 211, 252, 0.65);
      --arc-edge: rgba(255, 255, 255, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-base);
      background-image: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 20px 15px;
      transition: background 0.5s ease;
    }

    /* BACKGROUND SPHERES */
    .bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glass-arc-sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--arc-1) 0%, var(--arc-2) 70%, transparent 100%);
      border: 1.5px solid var(--arc-edge);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.2), inset 0 0 35px var(--arc-edge);
      backdrop-filter: blur(8px);
      animation: floatArc 18s infinite ease-in-out alternate;
      will-change: transform;
      transform: translateZ(0);
    }

    .arc-1 { width: 520px; height: 520px; top: -150px; left: -170px; animation-duration: 20s; }
    .arc-2 { width: 480px; height: 480px; bottom: -120px; right: -140px; animation-duration: 16s; }
    .arc-center { width: 320px; height: 320px; top: 45%; left: 50%; transform: translate(-50%, -50%); opacity: 0.65; animation-duration: 14s; }

    @keyframes floatArc {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(40px, 30px, 0) scale(1.06) rotate(10deg); }
      100% { transform: translate3d(-30px, 50px, 0) scale(0.94) rotate(-10deg); }
    }

    /* ==========================================================
       MAIN CARD CONTAINER (ĐÃ CỐ ĐỊNH LAYOUT ĐỂ KHÔNG MẤT TAB)
       ========================================================== */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(200%);
      -webkit-backdrop-filter: blur(22px) saturate(200%);
      border: 1.5px solid var(--glass-border);
      border-radius: 42px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.4s ease, border-color 0.4s ease;
      will-change: height;
    }

    /* TOP BAR */
    .top-bar {
      padding: 18px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    .theme-toggle-track {
      position: relative;
      width: 82px;
      height: 44px;
      background: var(--toggle-track-bg);
      border: 1.5px solid var(--toggle-track-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), 0 8px 20px rgba(0, 0, 0, 0.08);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .theme-orb-indicator {
      position: absolute;
      top: 3px; left: 3px;
      width: 35px; height: 35px;
      border-radius: 50%;
      background: var(--toggle-orb-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: var(--toggle-orb-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease, box-shadow 0.4s ease;
      z-index: 2;
    }

    .theme-orb-indicator .orb-icon-svg {
      width: 20px; height: 20px;
      transition: opacity 0.3s ease, transform 0.35s ease;
      position: absolute;
    }

    .orb-sun-svg { opacity: 0; transform: scale(0.5) rotate(-90deg); }
    .orb-moon { color: #ffffff; font-size: 1rem; text-shadow: 0 0 8px rgba(56, 189, 248, 0.8); opacity: 1; transform: scale(1) rotate(0deg); }

    [data-theme="light"] .theme-orb-indicator { transform: translate3d(38px, 0, 0); }
    [data-theme="light"] .orb-sun-svg { opacity: 1; transform: scale(1) rotate(0deg); }
    [data-theme="light"] .orb-moon { opacity: 0; transform: scale(0.5) rotate(90deg); }

    .qr-glass-btn {
      width: 42px; height: 42px;
      border-radius: 16px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(14px);
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.4);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qr-glass-btn:hover { transform: scale(1.08) rotate(5deg); }

    /* PROFILE HEADER */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 24px 8px;
      z-index: 5;
      flex-shrink: 0;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), margin 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-frame {
      position: relative;
      width: 100px; height: 100px;
      border-radius: 50%;
      padding: 4px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.2) 100%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22), 0 0 30px var(--glass-glow);
    }

    .avatar-frame img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.4s ease;
    }

    .avatar-frame:hover img { filter: grayscale(0%); }

    .profile-info-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.35s ease;
    }

    .profile-name-title {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 12px;
    }

    .profile-subtitle {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Thu gọn Header khi ở Social/Work tab */
    .liquid-card.compact-mode .profile-header {
      transform: scale(0.8);
      margin-bottom: -55px;
    }

    .liquid-card.compact-mode .profile-info-block {
      opacity: 0;
      transform: translate3d(0, -10px, 0);
      pointer-events: none;
    }

    /* VIEWPORT SLIDER CONTAINER */
    .viewport-wrapper {
      width: 100%;
      overflow: hidden;
      flex: 1;
    }

    .viewport {
      width: 300%;
      display: flex;
      align-items: flex-start;
      transform: translate3d(-33.3333%, 0, 0);
      transition: transform 0.42s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .tab-page {
      width: 33.3333%;
      padding: 10px 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    /* HOME TAB QUOTE */
    .home-quote-box {
      margin: 10px 0 15px;
      padding: 22px 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      width: 100%;
    }

    .quote-text {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text-quote);
      line-height: 1.65;
    }

    .quote-author {
      font-size: 0.88rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 14px;
      display: block;
    }

    /* LINK CARDS LIST */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .liquid-link-item {
      display: flex;
      align-items: center;
      padding: 13px 18px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 24px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.92rem;
      backdrop-filter: blur(16px);
      box-shadow: var(--link-shadow);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
    }

    .liquid-link-item:hover {
      transform: translate3d(0, -3px, 0) scale(1.015);
      background: var(--link-hover);
    }

    .link-app-icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      margin-right: 14px;
    }

    .link-text-label { flex: 1; text-align: left; }
    .link-chevron { font-size: 0.85rem; color: var(--text-sub); }

    /* ==========================================================
       NAV DOCK CAPSULE (CỐ ĐỊNH LUÔN NẰM TRONG KHUNG)
       ========================================================== */
    .bottom-nav-container {
      padding: 6px 22px 20px;
      z-index: 50;
      width: 100%;
      flex-shrink: 0;
      position: relative;
    }

    .bottom-nav-glass {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-dock-bg);
      border: 1.5px solid var(--nav-dock-border);
      border-radius: 40px;
      padding: 5px;
      backdrop-filter: blur(28px);
      box-shadow: var(--nav-dock-shadow);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 5px; left: 5px;
      width: calc((100% - 10px) / 3);
      height: calc(100% - 10px);
      background: var(--indicator-pill-bg);
      border: 1.5px solid var(--indicator-pill-border);
      border-radius: 32px;
      box-shadow: var(--indicator-pill-glow);
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    .nav-tab-btn {
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .nav-tab-btn i {
      font-size: 1.3rem;
      color: var(--nav-icon-inactive);
      transition: color 0.35s ease, transform 0.35s ease;
    }

    .nav-tab-btn.active i {
      color: var(--nav-icon-active);
      transform: scale(1.15);
    }

    /* MODAL QR CODE */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: var(--qr-modal-bg);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .qr-glass-card {
      background: var(--qr-card-bg);
      backdrop-filter: blur(30px);
      border: 1.5px solid var(--qr-card-border);
      border-radius: 38px;
      padding: 26px 20px;
      width: 88%;
      max-width: 310px;
      text-align: center;
      transform: scale(0.88);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .qr-glass-card { transform: scale(1); }
    .qr-modal-header { font-size: 1.15rem; font-weight: 700; color: var(--text-title); margin-bottom: 16px; }

    .qr-box-wrapper {
      position: relative;
      width: 175px; height: 175px;
      margin: 0 auto;
      padding: 10px;
      background: #ffffff;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas { width: 100% !important; height: 100% !important; display: flex; justify-content: center; align-items: center; }
    #qrcode-canvas img { border-radius: 12px; }

    .qr-center-avatar {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      object-fit: cover;
    }

    .copy-link-btn {
      width: 175px;
      margin: 16px auto 0;
      padding: 11px;
      border: none;
      background: var(--text-sub);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.88rem;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .close-modal-btn {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="bg-canvas">
    <div class="glass-arc-sphere arc-1"></div>
    <div class="glass-arc-sphere arc-2"></div>
    <div class="glass-arc-sphere arc-center"></div>
  </div>

  <main class="liquid-card" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="theme-toggle-track" id="theme-toggle">
        <div class="theme-orb-indicator" id="theme-indicator">
          <i class="fa-solid fa-moon orb-moon"></i>
          <svg class="orb-icon-svg orb-sun-svg" viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="18" fill="#fef08a" />
            <path d="M50 15 C47 22, 47 26, 50 28 C53 26, 53 22, 50 15 Z" fill="#fef08a" />
            <path d="M50 85 C47 78, 47 74, 50 72 C53 74, 53 78, 50 85 Z" fill="#fef08a" />
            <path d="M15 50 C22 47, 26 47, 28 50 C26 53, 22 53, 15 50 Z" fill="#fef08a" />
            <path d="M85 50 C78 47, 74 47, 72 50 C74 53, 78 53, 85 50 Z" fill="#fef08a" />
          </svg>
        </div>
      </div>

      <button class="qr-glass-btn" id="open-qr-btn">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>

    <!-- PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-frame">
        <img src="images/Huy.png" alt="Avatar Nhật Huy">
      </div>
      <div class="profile-info-block">
        <h1 class="profile-name-title">Nhật Huy</h1>
        <p class="profile-subtitle">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT CHUYỂN TAB -->
    <div class="viewport-wrapper">
      <div class="viewport" id="viewport">

        <!-- TAB 1: SOCIAL -->
        <section class="tab-page" id="page-social">
          <div class="links-list" id="social-links-list"></div>
        </section>

        <!-- TAB 2: HOME (QUOTE) -->
        <section class="tab-page" id="page-home">
          <div class="home-quote-box">
            <p class="quote-text">“<br>Even the darkest night will end,<br>and the sun will rise.</p>
            <span class="quote-author">Les Misérables - Victor Hugo</span>
          </div>
        </section>

        <!-- TAB 3: WORK -->
        <section class="tab-page" id="page-work">
          <div class="links-list" id="work-links-list"></div>
        </section>

      </div>
    </div>

    <!-- THANH TAB NAV DOCK (LUÔN NẰM TRONG CARD) -->
    <div class="bottom-nav-container">
      <nav class="bottom-nav-glass">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="qr-glass-card">
      <h3 class="qr-modal-header">Scan QR Code</h3>
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar" class="qr-center-avatar">
      </div>
      <button class="copy-link-btn" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>
      <button class="close-modal-btn" id="close-qr-btn">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof bioData !== 'undefined' && bioData.tabs) {
        renderLinks("social-links-list", bioData.tabs.social);
        renderLinks("work-links-list", bioData.tabs.work);
      }

      initTabNavigation();
      initThemeToggle();
      initQRCodeModal();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !items) return;
      container.innerHTML = items.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="liquid-link-item">
          <img src="${item.icon}" alt="${item.title}" class="link-app-icon">
          <span class="link-text-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-chevron"></i>
        </a>
      `).join('');
    }

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");
      const tabPages = document.querySelectorAll(".tab-page");

      // Cập nhật chiều cao chuẩn xác cho Card
      function adjustCardHeight(index) {
        requestAnimationFrame(() => {
          const topBarH = document.querySelector(".top-bar").offsetHeight;
          const headerH = document.querySelector(".profile-header").offsetHeight;
          const navH = document.querySelector(".bottom-nav-container").offsetHeight;
          
          const currentTabPage = tabPages[index];
          const contentH = currentTabPage ? currentTabPage.scrollHeight : 0;

          const totalH = topBarH + headerH + contentH + navH;
          mainCard.style.height = `${totalH}px`;
        });
      }

      function switchTab(index) {
        viewport.style.transform = `translate3d(-${index * 33.3333}%, 0, 0)`;

        const activeBtn = navBtns[index];
        if (activeBtn && indicator) {
          indicator.style.transform = `translate3d(${activeBtn.offsetLeft - 5}px, 0, 0)`;
        }

        navBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));

        if (index === 1) {
          mainCard.classList.remove("compact-mode");
        } else {
          mainCard.classList.add("compact-mode");
        }

        adjustCardHeight(index);
      }

      navBtns.forEach((btn, i) => btn.addEventListener("click", () => switchTab(i)));

      window.addEventListener("resize", () => {
        const activeBtn = document.querySelector(".nav-tab-btn.active");
        if (activeBtn) {
          switchTab(parseInt(activeBtn.getAttribute("data-index") || "1"));
        }
      });

      setTimeout(() => { switchTab(1); }, 60);
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("liquid-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("liquid-theme", newTheme);
      });
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 155,
            height: 155,
            colorDark: "#060913",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--text-sub)";
          }, 2000);
        });
      });

      closeBtn.addEventListener("click", () => modal.classList.remove("active"));
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });
    }
  </script>
</body>
</html>
