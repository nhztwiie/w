<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link - Nhật Huy</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện QRCodeJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* Tông màu Pastel Xanh Lam Tươi Sáng */
        :root[data-theme="light"] {
            --bg-grad-1: #e0f2fe;
            --bg-grad-2: #f0f9ff;
            --bg-grad-3: #e0e7ff;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-sub: #64748b;
            --btn-bg: rgba(255, 255, 255, 0.85);
            --btn-hover: #ffffff;
            --btn-border: rgba(224, 242, 254, 0.8);
            --tab-active-bg: #38bdf8;
            --tab-active-text: #ffffff;
            --shadow-color: rgba(56, 189, 248, 0.15);
            --shadow-hover: rgba(56, 189, 248, 0.28);
            --modal-bg: rgba(255, 255, 255, 0.95);
            --accent-color: #0284c7;
            --blob-1: #bae6fd;
            --blob-2: #c7d2fe;
        }

        :root[data-theme="dark"] {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #0c4a6e;
            --bg-grad-3: #1e1b4b;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f0f9ff;
            --text-sub: #94a3b8;
            --btn-bg: rgba(30, 41, 59, 0.8);
            --btn-hover: rgba(51, 65, 85, 0.9);
            --btn-border: rgba(255, 255, 255, 0.08);
            --tab-active-bg: #0284c7;
            --tab-active-text: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-hover: rgba(2, 132, 199, 0.3);
            --modal-bg: rgba(15, 23, 42, 0.95);
            --accent-color: #38bdf8;
            --blob-1: #0369a1;
            --blob-2: #312e81;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Dynamic Moving Background Blobs */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-blob {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }

        .blob-1 {
            background: var(--blob-1);
            top: -50px;
            left: -50px;
        }

        .blob-2 {
            background: var(--blob-2);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.15); }
        }

        /* Main Glassmorphism Card Container */
        .container {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 32px 22px;
            box-shadow: 0 20px 50px var(--shadow-color);
            position: relative;
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top Bar Tools */
        .top-tools {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .tool-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .tool-btn:hover {
            transform: scale(1.1) rotate(5deg);
            background: var(--btn-hover);
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--btn-hover);
            box-shadow: 0 8px 24px var(--shadow-color);
        }

        .profile-name {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .profile-bio {
            font-size: 0.88rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* Navigation Tabs Switcher */
        .tab-navigation {
            display: flex;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid var(--btn-border);
            padding: 5px;
            border-radius: 50px;
            margin-bottom: 20px;
            position: relative;
        }

        :root[data-theme="dark"] .tab-navigation {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.88rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 1;
        }

        .tab-btn.active {
            color: var(--tab-active-text);
            background: var(--tab-active-bg);
            box-shadow: 0 4px 15px var(--shadow-hover);
        }

        /* Link Container Smooth Transitions */
        .links-wrapper {
            position: relative;
            min-height: 220px;
        }

        .tab-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .tab-content.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }

        /* Link Items */
        .link-card {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 50px; /* Bo tròn hoàn toàn */
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.98rem;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .link-card:hover {
            transform: translateY(-3px) scale(1.02);
            background: var(--btn-hover);
            box-shadow: 0 10px 25px var(--shadow-hover);
        }

        .app-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%; /* Icon ứng dụng hình tròn */
            object-fit: cover;
            margin-right: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            background: #ffffff;
            padding: 2px;
        }

        .link-title {
            flex: 1;
        }

        .arrow-icon {
            color: var(--text-sub);
            font-size: 0.85rem;
            opacity: 0.6;
            margin-right: 2px;
        }

        .link-card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(4px);
            color: var(--accent-color);
        }

        /* Pop-up Modal QR Code */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            padding: 26px;
            border-radius: 28px;
            text-align: center;
            max-width: 330px;
            width: 100%;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .qr-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 16px 0;
            padding: 14px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.04);
        }

        .link-box {
            display: flex;
            align-items: center;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 14px;
            padding: 8px 12px;
            margin-top: 12px;
            gap: 8px;
        }

        .link-input {
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 0.82rem;
            width: 100%;
            outline: none;
            text-overflow: ellipsis;
        }

        .copy-btn {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .download-btn {
            width: 100%;
            margin-top: 12px;
            padding: 11px;
            background: transparent;
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: var(--btn-hover);
        }

        .footer-text {
            margin-top: 28px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <!-- Animated Background Blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container">
        <!-- Top Toolbar -->
        <div class="top-tools">
            <button class="tool-btn" id="qrBtn" title="Chia sẻ Mã QR">
                <i class="fa-solid fa-qrcode"></i>
            </button>
            <button class="tool-btn" id="themeToggleBtn" title="Đổi theme Pastel Dark/Light">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>

        <!-- Profile Section -->
        <div class="profile">
            <div class="avatar-wrapper">
                <img id="userAvatar" class="avatar" src="" alt="Avatar">
            </div>
            <h1 id="userName" class="profile-name"></h1>
            <p id="userBio" class="profile-bio"></p>
        </div>

        <!-- Tab Controls Switcher -->
        <div class="tab-navigation">
            <button class="tab-btn active" data-tab="social">
                <i class="fa-solid fa-share-nodes"></i> Social Media
            </button>
            <button class="tab-btn" data-tab="work">
                <i class="fa-solid fa-briefcase"></i> Work
            </button>
        </div>

        <!-- Links Container -->
        <div class="links-wrapper">
            <div class="tab-content active" id="socialTab"></div>
            <div class="tab-content" id="workTab"></div>
        </div>

        <div class="footer-text">
            © <span id="year"></span> Nhật Huy. All rights reserved.
        </div>
    </div>

    <!-- QR Code Modal -->
    <div class="modal" id="qrModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <h3 style="margin-bottom: 4px; font-size: 1.1rem;">Mã QR Chia Sẻ</h3>
            <p style="font-size: 0.82rem; color: var(--text-sub);">Quét mã để truy cập Bio của Nhật Huy</p>
            
            <div class="qr-box">
                <div id="qrcode"></div>
            </div>

            <div class="link-box">
                <input type="text" id="shareUrlInput" class="link-input" readonly>
                <button class="copy-btn" id="copyBtn">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <button class="download-btn" id="downloadQrBtn">
                <i class="fa-solid fa-download"></i> Tải ảnh QR
            </button>
        </div>
    </div>

    <!-- Load data.js -->
    <script src="data.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Render Dữ liệu từ data.js
            document.getElementById("userName").textContent = bioData.profile.name;
            document.getElementById("userBio").textContent = bioData.profile.bio;
            document.getElementById("userAvatar").src = bioData.profile.avatar;
            document.getElementById("year").textContent = new Date().getFullYear();

            // Link dùng cho QR Code Chia Sẻ
            const targetShareUrl = bioData.profile.shareUrl && bioData.profile.shareUrl.trim() !== "" 
                ? bioData.profile.shareUrl 
                : window.location.href;

            document.getElementById("shareUrlInput").value = targetShareUrl;

            // Hàm tạo các nút Link
            const renderLinks = (items, containerId) => {
                const container = document.getElementById(containerId);
                items.forEach(link => {
                    const a = document.createElement("a");
                    a.className = "link-card";
                    a.href = link.url;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    
                    a.innerHTML = `
                        <img class="app-icon" src="${link.icon}" alt="${link.title}">
                        <span class="link-title">${link.title}</span>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    `;
                    container.appendChild(a);
                });
            };

            renderLinks(bioData.tabs.social, "socialTab");
            renderLinks(bioData.tabs.work, "workTab");

            // 2. Chuyển Đổi Tab Mượt Mà
            const tabButtons = document.querySelectorAll(".tab-btn");
            const tabContents = document.querySelectorAll(".tab-content");

            tabButtons.forEach(btn => {
                btn.addEventListener("click", () => {
                    const targetTab = btn.getAttribute("data-tab");

                    tabButtons.forEach(b => b.classList.remove("active"));
                    tabContents.forEach(c => c.classList.remove("active"));

                    btn.classList.add("active");
                    document.getElementById(`${targetTab}Tab`).classList.add("active");
                });
            });

            // 3. Chuyển Đổi Theme Dark/Light Mode Pastel Xanh Lam
            const themeToggleBtn = document.getElementById("themeToggleBtn");
            const themeIcon = document.getElementById("themeIcon");
            const htmlTag = document.documentElement;

            themeToggleBtn.addEventListener("click", () => {
                const currentTheme = htmlTag.getAttribute("data-theme");
                const newTheme = currentTheme === "light" ? "dark" : "light";
                htmlTag.setAttribute("data-theme", newTheme);
                
                themeIcon.className = newTheme === "light" ? "fa-solid fa-moon" : "fa-solid fa-sun";
            });

            // 4. Xử lý QR Code & Chia Sẻ Link
            const qrBtn = document.getElementById("qrBtn");
            const qrModal = document.getElementById("qrModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const qrContainer = document.getElementById("qrcode");
            const copyBtn = document.getElementById("copyBtn");
            const downloadQrBtn = document.getElementById("downloadQrBtn");
            let qrGenerated = false;

            qrBtn.addEventListener("click", () => {
                qrModal.classList.add("active");
                if (!qrGenerated) {
                    new QRCode(qrContainer, {
                        text: targetShareUrl,
                        width: 170,
                        height: 170,
                        colorDark : "#0f172a",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                    qrGenerated = true;
                }
            });

            closeModalBtn.addEventListener("click", () => qrModal.classList.remove("active"));
            qrModal.addEventListener("click", (e) => {
                if (e.target === qrModal) qrModal.classList.remove("active");
            });

            // Sao chép Link
            copyBtn.addEventListener("click", () => {
                const copyText = document.getElementById("shareUrlInput");
                navigator.clipboard.writeText(copyText.value).then(() => {
                    copyBtn.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    setTimeout(() => {
                        copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i>`;
                    }, 2000);
                });
            });

            // Tải Ảnh Mã QR về máy
            downloadQrBtn.addEventListener("click", () => {
                const img = qrContainer.querySelector("img");
                if (img) {
                    const a = document.createElement("a");
                    a.href = img.src;
                    a.download = "Bio-QR-NhatHuy.png";
                    a.click();
                }
            });
        });
    </script>
</body>
</html>
