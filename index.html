<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhật Huy | Bio Link</title>

  <!-- Favicon từ images/email.png -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome & QRCode Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================
       THEME VARIABLES - LIQUID GLASS TRANSPARENT
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-base: #060913;
      --bg-gradient: radial-gradient(circle at 50% 30%, #172554 0%, #0b1329 55%, #030712 100%);
      
      /* Độ mờ vừa phải để thấy nền lấp lánh chuyển động phía sau */
      --glass-bg: rgba(15, 23, 42, 0.42);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      --glass-glow: rgba(56, 189, 248, 0.35);

      --text-title: #ffffff;
      --text-sub: #38bdf8;
      --text-link: #f8fafc;

      --pill-bg: rgba(30, 41, 59, 0.45);
      --pill-border: rgba(255, 255, 255, 0.2);
      
      --nav-bg: rgba(15, 23, 42, 0.55);
      --indicator-bg: #38bdf8;
      --indicator-shadow: 0 0 20px rgba(56, 189, 248, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      --nav-icon-active: #0f172a;
      --nav-icon-inactive: #94a3b8;

      --link-bg: rgba(30, 41, 59, 0.35);
      --link-border: rgba(255, 255, 255, 0.18);
      --link-hover: rgba(51, 65, 85, 0.65);
      --link-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);

      --arc-1: rgba(30, 58, 138, 0.7);
      --arc-2: rgba(30, 27, 75, 0.85);
      --arc-edge: rgba(186, 230, 253, 0.5);
    }

    :root[data-theme="light"] {
      --bg-base: #e0f2fe;
      --bg-gradient: radial-gradient(circle at 50% 30%, #f0f9ff 0%, #bae6fd 60%, #7dd3fc 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 25px 50px rgba(14, 165, 233, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.95);
      --glass-glow: rgba(2, 132, 199, 0.3);

      --text-title: #0f172a;
      --text-sub: #0284c7;
      --text-link: #0f172a;

      --pill-bg: rgba(255, 255, 255, 0.45);
      --pill-border: rgba(255, 255, 255, 0.85);

      --nav-bg: rgba(255, 255, 255, 0.55);
      --indicator-bg: #0284c7;
      --indicator-shadow: 0 6px 18px rgba(2, 132, 199, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.8);
      --nav-icon-active: #ffffff;
      --nav-icon-inactive: #64748b;

      --link-bg: rgba(255, 255, 255, 0.45);
      --link-border: rgba(255, 255, 255, 0.95);
      --link-hover: rgba(255, 255, 255, 0.85);
      --link-shadow: 0 8px 20px rgba(186, 230, 253, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.9);

      --arc-1: rgba(186, 230, 253, 0.85);
      --arc-2: rgba(125, 211, 252, 0.6);
      --arc-edge: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-base);
      background-image: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 15px;
      transition: background 0.5s ease;
    }

    /* ==========================================================
       BACKGROUND LIQUID COBALT ARCS & SPARKLES
       ========================================================== */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glass-arc-sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, var(--arc-1) 0%, var(--arc-2) 70%, transparent 100%);
      border: 1.5px solid var(--arc-edge);
      box-shadow: 0 0 50px rgba(2, 132, 199, 0.2), inset 0 0 30px var(--arc-edge);
      backdrop-filter: blur(8px);
      animation: floatArc 16s infinite ease-in-out alternate;
    }

    .arc-1 {
      width: 520px;
      height: 520px;
      top: -150px;
      left: -180px;
      animation-duration: 18s;
    }

    .arc-2 {
      width: 480px;
      height: 480px;
      bottom: -120px;
      right: -150px;
      animation-duration: 14s;
    }

    .arc-center {
      width: 320px;
      height: 320px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.65;
      animation-duration: 12s;
    }

    @keyframes floatArc {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(40px, 30px) scale(1.05) rotate(10deg); }
      100% { transform: translate(-30px, 50px) scale(0.95) rotate(-10deg); }
    }

    .sparkle {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff, 0 0 20px var(--text-sub);
      animation: sparkleAnim 3.5s infinite ease-in-out alternate;
    }

    @keyframes sparkleAnim {
      0% { opacity: 0.1; transform: scale(0.4); }
      100% { opacity: 0.85; transform: scale(1.2); }
    }

    /* ==========================================================
       MAIN CARD CONTAINER (DESKTOP & MOBILE COMPATIBLE)
       ========================================================== */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      height: 730px;
      max-height: 94vh;
      background: var(--glass-bg);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1.5px solid var(--glass-border);
      border-radius: 42px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: glassAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes glassAppear {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ==========================================================
       TOP BAR (THEME TOGGLE, MUSIC PLAYER & QR CODE)
       ========================================================== */
    .top-bar {
      padding: 20px 24px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Theme Switcher Cân Đối 100% */
    .theme-toggle-pill {
      position: relative;
      width: 76px;
      height: 38px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(15px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    }

    /* Đánh dấu Dark = Bên Trái (Mặt trăng), Light = Bên Phải (Mặt trời) */
    .theme-indicator {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.35s;
      z-index: 1;
    }

    [data-theme="light"] .theme-indicator {
      transform: translateX(38px);
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .theme-icon-box {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      z-index: 2;
      transition: color 0.3s ease;
    }

    .icon-moon { color: #ffffff; }
    .icon-sun { color: #f59e0b; }

    [data-theme="light"] .icon-moon { color: #64748b; }
    [data-theme="light"] .icon-sun { color: #d97706; }

    .top-right-group {
      display: flex;
      gap: 10px;
    }

    .top-action-btn {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.15rem;
      cursor: pointer;
      backdrop-filter: blur(15px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-action-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px var(--glass-glow);
    }

    .music-btn.playing {
      animation: pulseGlow 2s infinite ease-in-out;
      color: var(--text-sub);
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 10px var(--glass-glow); }
      50% { box-shadow: 0 0 25px var(--glass-glow); }
    }

    /* ==========================================================
       DYNAMIC PROFILE HEADER & CAPTION MỚI
       ========================================================== */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 24px 0;
      z-index: 5;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-frame {
      position: relative;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      padding: 4px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid var(--glass-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2), 0 0 25px var(--glass-glow);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.35s ease;
    }

    .avatar-frame:hover { transform: scale(1.05); }
    .avatar-frame:hover img { filter: grayscale(0%); }

    .profile-info-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 1;
      max-height: 140px;
      transform: translateY(0);
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .profile-name-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 10px;
      letter-spacing: -0.5px;
    }

    /* Caption Mới ở Tab Home */
    .quote-main {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 6px;
      max-width: 280px;
      line-height: 1.35;
    }

    .quote-author {
      font-size: 0.78rem;
      font-style: italic;
      color: var(--text-title);
      opacity: 0.8;
      margin-top: 3px;
    }

    /* Thu nhỏ khi sang Tab Work/Social */
    .liquid-card.compact-mode .avatar-frame {
      width: 80px;
      height: 80px;
    }

    .liquid-card.compact-mode .profile-info-block {
      opacity: 0;
      max-height: 0;
      transform: translateY(-10px);
      pointer-events: none;
      overflow: hidden;
    }

    /* ==========================================================
       VIEWPORT & TAB PAGE CONTENT
       ========================================================== */
    .viewport {
      flex: 1;
      display: flex;
      width: 300%;
      transform: translateX(-33.333%); /* Mặc định Tab Home */
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: grab;
      margin-top: 10px;
    }

    .viewport:active { cursor: grabbing; }

    .tab-page {
      width: 33.333%;
      height: 100%;
      padding: 10px 24px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .liquid-link-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 24px;
      text-decoration: none;
      color: var(--text-link);
      font-weight: 700;
      font-size: 0.98rem;
      backdrop-filter: blur(20px);
      box-shadow: var(--link-shadow);
      overflow: hidden;
      animation: floatCard 6s infinite ease-in-out alternate;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .liquid-link-item:nth-child(1) { animation-delay: 0s; }
    .liquid-link-item:nth-child(2) { animation-delay: 1.2s; }
    .liquid-link-item:nth-child(3) { animation-delay: 2.4s; }
    .liquid-link-item:nth-child(4) { animation-delay: 3.6s; }

    @keyframes floatCard {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    .liquid-link-item:hover {
      animation-play-state: paused;
      transform: translateY(-4px) scale(1.02) !important;
      background: var(--link-hover);
      box-shadow: 0 12px 30px var(--glass-glow);
    }

    .link-app-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .link-text-label { flex: 1; text-align: left; }
    .link-chevron { font-size: 0.88rem; color: var(--text-sub); transition: transform 0.3s; }

    .liquid-link-item:hover .link-chevron { transform: translateX(5px); }

    /* ==========================================================
       THANH CHUYỂN TAB DƯỚI ĐÁY (DESKTOP & MOBILE FIX)
       ========================================================== */
    .bottom-nav-container {
      padding: 0 20px 20px;
      z-index: 10;
      width: 100%;
    }

    .bottom-nav-glass {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 35px;
      padding: 5px;
      backdrop-filter: blur(25px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 5px;
      left: 5px;
      width: calc(33.333% - 6.66px);
      height: calc(100% - 10px);
      background: var(--indicator-bg);
      border-radius: 30px;
      box-shadow: var(--indicator-shadow);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    .nav-tab-btn {
      flex: 1;
      height: 50px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: var(--nav-icon-inactive);
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: color 0.3s, transform 0.3s;
    }

    .nav-tab-btn.active {
      color: var(--nav-icon-active);
      transform: scale(1.12);
    }

    /* ==========================================================
       MODAL QR CODE HÀI HÒA
       ========================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(6, 9, 19, 0.65);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      border: 1.5px solid var(--glass-border);
      border-radius: 36px;
      padding: 26px 22px;
      width: 88%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 30px var(--glass-glow);
      transform: scale(0.88);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .qr-glass-card { transform: scale(1); }

    .qr-modal-header {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-title);
      margin-bottom: 16px;
    }

    .qr-box-wrapper {
      position: relative;
      width: 185px;
      height: 185px;
      margin: 0 auto;
      padding: 10px;
      background: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas {
      width: 100% !important;
      height: 100% !important;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode-canvas img { border-radius: 12px; }

    .qr-center-avatar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      object-fit: cover;
      pointer-events: none;
    }

    .copy-link-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      background: var(--indicator-bg);
      color: var(--nav-icon-active);
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
      transition: all 0.25s ease;
    }

    .copy-link-btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .close-modal-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .close-modal-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- TRÌNH PHÁT NHẠC ẨN -->
  <audio id="audio-player" loop preload="auto">
    <source src="https://v16m-default.akamaized.net/video/tos/useast2a/tos-useast2a-pve-0037c001-aiso/oADhE7wQvAEC8qDMB0InEAD0Y5zL4BfgC3A3k1/?a=0&ch=0&cr=0&dr=0&lr=all&cd=0%7C0%7C0%7C0&cv=1&br=256&bt=128&cs=0&ds=3&ft=4b~WyM038Zi3n.8kLq8Zmo&mime=audio_mp4&qs=0&rc=M3RkZGhnZmdkOjs0Njo3OEBpM25seTQ6Zjs4dDMzODczNEAzNjExL18xNmMxXjI1LWE1YSNvNDBscjRfZTJgLS1kMTZzc14%3D&l=20261003065300B4C82E8D2E143E4E81C9" type="audio/mp4">
  </audio>

  <!-- BACKGROUND LIQUID COBALT ARCS -->
  <div class="bg-canvas">
    <div class="glass-arc-sphere arc-1"></div>
    <div class="glass-arc-sphere arc-2"></div>
    <div class="glass-arc-sphere arc-center"></div>

    <div class="sparkle" style="top: 20%; left: 22%; width: 6px; height: 6px; animation-delay: 0s;"></div>
    <div class="sparkle" style="top: 35%; right: 18%; width: 8px; height: 8px; animation-delay: 1.2s;"></div>
    <div class="sparkle" style="top: 70%; left: 15%; width: 5px; height: 5px; animation-delay: 1.8s;"></div>
    <div class="sparkle" style="top: 82%; right: 26%; width: 7px; height: 7px; animation-delay: 0.6s;"></div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <!-- Theme Switcher -->
      <div class="theme-toggle-pill" id="theme-toggle">
        <div class="theme-indicator"></div>
        <div class="theme-icon-box icon-moon"><i class="fa-solid fa-moon"></i></div>
        <div class="theme-icon-box icon-sun"><i class="fa-solid fa-sun"></i></div>
      </div>

      <!-- Nút Âm Nhạc & Mã QR -->
      <div class="top-right-group">
        <button class="top-action-btn music-btn" id="music-toggle-btn" aria-label="Toggle Music">
          <i class="fa-solid fa-music"></i>
        </button>
        <button class="top-action-btn" id="open-qr-btn" aria-label="Open QR">
          <i class="fa-solid fa-qrcode"></i>
        </button>
      </div>
    </div>

    <!-- PROFILE HEADER CÓ CAPTION TẠI PAGE HOME -->
    <header class="profile-header">
      <div class="avatar-frame">
        <!-- Đã cập nhật ảnh từ images/Huy.png -->
        <img src="images/Huy.png" alt="Avatar Nhật Huy" class="user-avatar-img">
      </div>
      <div class="profile-info-block">
        <h1 class="profile-name-title">Nhật Huy</h1>
        <p class="quote-main">“Even the darkest night wiil end, and the sun will rise”</p>
        <p class="quote-author">Les Misérables - Victor Hugo</p>
      </div>
    </header>

    <!-- VIEWPORT 3 TAB CHUYỂN ĐỔI -->
    <div class="viewport" id="viewport">

      <!-- TAB 1: SOCIAL MEDIA -->
      <section class="tab-page" id="page-social">
        <div class="links-list" id="social-links-list"></div>
      </section>

      <!-- TAB 2: HOME (CHỈ GIỮ AVATAR VÀ CAPTION) -->
      <section class="tab-page" id="page-home"></section>

      <!-- TAB 3: WORK -->
      <section class="tab-page" id="page-work">
        <div class="links-list" id="work-links-list"></div>
      </section>

    </div>

    <!-- THANH CHUYỂN TAB BÊN DƯỚI DÁY -->
    <div class="bottom-nav-container">
      <nav class="bottom-nav-glass">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social Tab">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home Tab">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work Tab">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- QR CODE MODAL -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="qr-glass-card">
      <h3 class="qr-modal-header">Scan QR Code</h3>
      
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar Center" class="qr-center-avatar user-avatar-img">
      </div>

      <button class="copy-link-btn" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>

      <button class="close-modal-btn" id="close-qr-btn">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Render Links từ data.js
      renderLinks("social-links-list", bioData.tabs.social);
      renderLinks("work-links-list", bioData.tabs.work);

      // 2. Kích hoạt tính năng
      initTabNavigation();
      initSwipeGesture();
      initThemeToggle();
      initQRCodeModal();
      initMusicPlayer();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="liquid-link-item">
          <img src="${item.icon}" alt="${item.title}" class="link-app-icon">
          <span class="link-text-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-chevron"></i>
        </a>
      `).join('');
    }

    let currentTabIndex = 1; // Mặc định ở Tab Home (Index = 1)

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");

      function switchTab(index) {
        currentTabIndex = index;

        // Trượt Viewport sang Tab tương ứng
        viewport.style.transform = `translateX(-${index * 33.333}%)`;
        
        // Trượt Khối đánh dấu Indicator
        indicator.style.transform = `translateX(${index * 100}%)`;

        navBtns.forEach((btn, i) => {
          if (i === index) btn.classList.add("active");
          else btn.classList.remove("active");
        });

        // Ẩn bớt Caption khi chuyển sang Tab Work/Social
        if (index === 1) {
          mainCard.classList.remove("compact-mode");
        } else {
          mainCard.classList.add("compact-mode");
        }
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      window.switchTabGlobal = switchTab;
    }

    function initSwipeGesture() {
      const viewport = document.getElementById("viewport");
      let startX = 0;
      let currentX = 0;
      let isSwiping = false;

      viewport.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
        isSwiping = true;
      }, { passive: true });

      viewport.addEventListener("touchmove", (e) => {
        if (!isSwiping) return;
        currentX = e.touches[0].clientX;
      }, { passive: true });

      viewport.addEventListener("touchend", () => {
        if (!isSwiping) return;
        const diffX = startX - currentX;

        if (diffX > 45 && currentTabIndex < 2) {
          window.switchTabGlobal(currentTabIndex + 1);
        } else if (diffX < -45 && currentTabIndex > 0) {
          window.switchTabGlobal(currentTabIndex - 1);
        }

        isSwiping = false;
      });
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("liquid-theme") || "dark";
      
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("liquid-theme", newTheme);
      });
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 165,
            height: 165,
            colorDark: "#060913",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";
          copyBtn.style.color = "#ffffff";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--indicator-bg)";
            copyBtn.style.color = "var(--nav-icon-active)";
          }, 2000);
        });
      });

      closeBtn.addEventListener("click", () => modal.classList.remove("active"));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("active");
      });
    }

    // XỬ LÝ TRÌNH PHÁT NHẠC
    function initMusicPlayer() {
      const musicBtn = document.getElementById("music-toggle-btn");
      const audioPlayer = document.getElementById("audio-player");
      let isPlaying = false;

      musicBtn.addEventListener("click", () => {
        if (isPlaying) {
          audioPlayer.pause();
          musicBtn.classList.remove("playing");
          musicBtn.innerHTML = '<i class="fa-solid fa-music"></i>';
          isPlaying = false;
        } else {
          audioPlayer.play().then(() => {
            musicBtn.classList.add("playing");
            musicBtn.innerHTML = '<i class="fa-solid fa-compact-disc fa-spin"></i>';
            isPlaying = true;
          }).catch(err => console.log("Cần tương tác người dùng để phát nhạc:", err));
        }
      });
    }
  </script>
</body>
</html>
