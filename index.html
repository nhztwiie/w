<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhật Huy | Bio Link</title>
  
  <!-- Font Google Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons & QRCode Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root[data-theme="light"] {
      --bg-base: #f0f7ff;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent-pastel: #38bdf8;
      --accent-hover: #0284c7;
      --tab-bg: rgba(224, 242, 254, 0.7);
      --tab-active: #ffffff;
      --link-bg: rgba(255, 255, 255, 0.92);
      --link-border: rgba(186, 230, 253, 0.6);
      --link-hover: #ffffff;
      --shadow: 0 20px 50px rgba(56, 189, 248, 0.18);
      
      /* Vibrant Floating Orb Colors - Light Theme */
      --orb-1: rgba(56, 189, 248, 0.65);
      --orb-2: rgba(244, 114, 182, 0.55);
      --orb-3: rgba(168, 85, 247, 0.55);
      --orb-4: rgba(52, 211, 153, 0.5);
    }

    :root[data-theme="dark"] {
      --bg-base: #0b1329;
      --card-bg: rgba(20, 31, 56, 0.82);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-pastel: #38bdf8;
      --accent-hover: #7dd3fc;
      --tab-bg: rgba(15, 23, 42, 0.7);
      --tab-active: #1e293b;
      --link-bg: rgba(30, 41, 59, 0.85);
      --link-border: rgba(255, 255, 255, 0.08);
      --link-hover: #334155;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      
      /* Floating Orb Colors - Dark Theme */
      --orb-1: rgba(14, 165, 233, 0.5);
      --orb-2: rgba(236, 72, 153, 0.45);
      --orb-3: rgba(139, 92, 246, 0.45);
      --orb-4: rgba(16, 185, 129, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 30px 15px;
    }

    .bg-orbs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.85;
      will-change: transform;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: var(--orb-1);
      top: -80px;
      left: -60px;
      animation: floatOrb1 12s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      background: var(--orb-2);
      bottom: -100px;
      right: -80px;
      animation: floatOrb2 15s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      background: var(--orb-3);
      top: 35%;
      left: 60%;
      animation: floatOrb3 10s ease-in-out infinite alternate;
    }

    .orb-4 {
      width: 280px;
      height: 280px;
      background: var(--orb-4);
      bottom: 20%;
      left: 10%;
      animation: floatOrb4 14s ease-in-out infinite alternate;
    }

    /* Clear, visible floating animations for background spheres */
    @keyframes floatOrb1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(120px, 90px) scale(1.25); }
      100% { transform: translate(-60px, 150px) scale(0.95); }
    }

    @keyframes floatOrb2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-140px, -110px) scale(1.2); }
      100% { transform: translate(80px, -180px) scale(0.9); }
    }

    @keyframes floatOrb3 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-150px, 120px) scale(1.3); }
      100% { transform: translate(100px, -80px) scale(0.85); }
    }

    @keyframes floatOrb4 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(130px, -100px) scale(1.15); }
      100% { transform: translate(-90px, -60px) scale(1.05); }
    }

    .bio-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 2px solid var(--card-border);
      border-radius: 32px;
      padding: 38px 26px;
      box-shadow: var(--shadow);
      text-align: center;
      animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Top control buttons */
    .top-controls {
      position: absolute;
      top: 22px;
      left: 22px;
      right: 22px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--tab-bg);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-btn:hover {
      transform: scale(1.12);
      background: var(--accent-pastel);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }

    .avatar-wrapper {
      width: 115px;
      height: 115px;
      margin: 8px auto 18px;
      position: relative;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 12px 28px rgba(56, 189, 248, 0.25);
      transition: transform 0.3s ease;
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.05);
    }

    .profile-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.4px;
    }

    .profile-bio {
      font-size: 0.93rem;
      color: var(--text-sub);
      margin-bottom: 26px;
      line-height: 1.4;
    }

    .tab-navigation {
      display: flex;
      background: var(--tab-bg);
      border-radius: 20px;
      padding: 6px;
      margin-bottom: 24px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.93rem;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      color: var(--text-main);
      background: var(--tab-active);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .tab-content-container {
      min-height: 230px;
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .tab-panel.active {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .link-item {
      display: flex;
      align-items: center;
      padding: 13px 20px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.98rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .link-item:hover {
      transform: translateY(-4px);
      background: var(--link-hover);
      border-color: var(--accent-pastel);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.22);
    }

    .app-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .link-title {
      flex: 1;
      text-align: left;
    }

    .link-arrow {
      font-size: 0.88rem;
      color: var(--text-sub);
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .link-item:hover .link-arrow {
      transform: translateX(5px);
      color: var(--accent-hover);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 32px 26px;
      width: 90%;
      max-width: 330px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 2px solid var(--card-border);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 16px 0;
      padding: 14px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .action-btn {
      flex: 1;
      padding: 11px 0;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .copy-btn {
      background: var(--tab-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .copy-btn:hover {
      background: var(--accent-pastel);
      color: #ffffff;
    }

    .close-btn {
      background: var(--accent-pastel);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }

    .close-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 200;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <main class="bio-card">
    <div class="top-controls">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button class="icon-btn" id="share-btn" aria-label="Share QR Code">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>

    <div class="avatar-wrapper">
      <img id="avatar-img" src="" alt="Avatar Nhật Huy" class="avatar-img">
    </div>

    <h1 class="profile-name" id="profile-name"></h1>
    <p class="profile-bio" id="profile-bio"></p>

    <!-- Navigation Tabs -->
    <nav class="tab-navigation">
      <button class="tab-btn active" data-tab="social">Social Media</button>
      <button class="tab-btn" data-tab="work">Work</button>
    </nav>

    <!-- Tab Panels Container -->
    <div class="tab-content-container">
      <div class="tab-panel active" id="social-panel"></div>
      <div class="tab-panel" id="work-panel"></div>
    </div>
  </main>

  <div class="modal-overlay" id="qr-modal">
    <div class="modal-card">
      <h3 class="modal-title">Chia sẻ trang Bio</h3>
      <div id="qrcode"></div>
      <p style="font-size: 0.82rem; color: var(--text-sub);">Quét mã QR để truy cập nhanh</p>
      
      <div class="modal-actions">
        <button class="action-btn copy-btn" id="copy-btn">
          <i class="fa-regular fa-copy"></i> Sao chép
        </button>
        <button class="action-btn close-btn" id="close-modal">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Đã sao chép liên kết!</div>

  <!-- External Data File -->
  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Render data from data.js
      if (typeof bioData !== 'undefined') {
        document.getElementById("avatar-img").src = bioData.profile.avatar;
        document.getElementById("profile-name").textContent = bioData.profile.name;
        document.getElementById("profile-bio").textContent = bioData.profile.bio;

        renderLinks("social-panel", bioData.tabs.social);
        renderLinks("work-panel", bioData.tabs.work);
      }

      // 2. Activate features
      initTabs();
      initTheme();
      initQRCode();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !items) return;

      container.innerHTML = items.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="link-item">
          <img src="${item.icon}" alt="${item.title}" class="app-icon" onerror="this.src='https://placehold.co/40x40/e0f2fe/0284c7?text=App'">
          <span class="link-title">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        </a>
      `).join('');
    }

    function initTabs() {
      const tabBtns = document.querySelectorAll(".tab-btn");
      const panels = {
        social: document.getElementById("social-panel"),
        work: document.getElementById("work-panel")
      };

      tabBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const targetTab = btn.dataset.tab;

          tabBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          Object.keys(panels).forEach(key => {
            if (key === targetTab) {
              panels[key].classList.add("active");
            } else {
              panels[key].classList.remove("active");
            }
          });
        });
      });
    }

    function initTheme() {
      const toggleBtn = document.getElementById("theme-toggle");
      const icon = toggleBtn.querySelector("i");
      
      const savedTheme = localStorage.getItem("bio-theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      updateIcon(savedTheme);

      toggleBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("bio-theme", newTheme);
        updateIcon(newTheme);
      });

      function updateIcon(theme) {
        icon.className = theme === "light" ? "fa-solid fa-moon" : "fa-solid fa-sun";
      }
    }

    function initQRCode() {
      const shareBtn = document.getElementById("share-btn");
      const closeBtn = document.getElementById("close-modal");
      const copyBtn = document.getElementById("copy-btn");
      const modal = document.getElementById("qr-modal");
      const qrContainer = document.getElementById("qrcode");
      const toast = document.getElementById("toast");

      let qrGenerated = false;

      shareBtn.addEventListener("click", () => {
        modal.classList.add("open");
        if (!qrGenerated) {
          const shareUrl = (typeof bioData !== 'undefined' && bioData.profile.shareUrl) 
            ? bioData.profile.shareUrl 
            : window.location.href;

          new QRCode(qrContainer, {
            text: shareUrl,
            width: 160,
            height: 160,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      });

      closeBtn.addEventListener("click", () => modal.classList.remove("open"));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("open");
      });

      // Copy Link function
      copyBtn.addEventListener("click", () => {
        const shareUrl = (typeof bioData !== 'undefined' && bioData.profile.shareUrl) 
          ? bioData.profile.shareUrl 
          : window.location.href;

        const tempInput = document.createElement("input");
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);

        // Show Toast Notification
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);
      });
    }
  </script>
</body>
</html>
