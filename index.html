<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhật Huy | Bio Link</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome & QRCode Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================
       BẢNG MÀU & HIỆU ỨNG LIQUID GLASS SYSTEM (DARK / LIGHT)
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-base: #030712;
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      
      --glass-bg: rgba(15, 23, 42, 0.5);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.3);
      --glass-glow: rgba(56, 189, 248, 0.3);

      --text-title: #ffffff;
      --text-sub: #38bdf8;
      --text-quote: #f8fafc;
      --text-author: #94a3b8;

      /* Liquid Toggle Theme Dark */
      --toggle-track-bg: rgba(255, 255, 255, 0.12);
      --toggle-track-border: rgba(255, 255, 255, 0.25);
      --toggle-orb-bg: radial-gradient(circle at 35% 35%, #38bdf8 0%, #818cf8 50%, #1e1b4b 100%);
      --toggle-orb-glow: 0 0 15px rgba(56, 189, 248, 0.5), inset 0 2px 3px rgba(255, 255, 255, 0.8);

      /* Liquid Glass Dock & Indicator Theme Dark */
      --nav-dock-bg: rgba(15, 23, 42, 0.65);
      --nav-dock-border: rgba(255, 255, 255, 0.25);
      --nav-dock-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.4), 0 15px 35px rgba(0, 0, 0, 0.5);
      
      --indicator-pill-bg: rgba(56, 189, 248, 0.25);
      --indicator-pill-border: rgba(56, 189, 248, 0.6);
      --indicator-pill-glow: 0 0 15px rgba(56, 189, 248, 0.4);
      
      --nav-icon-active: #ffffff;
      --nav-icon-inactive: rgba(255, 255, 255, 0.5);

      --link-bg: rgba(255, 255, 255, 0.08);
      --link-border: rgba(255, 255, 255, 0.18);
      --link-hover: rgba(56, 189, 248, 0.2);
      --link-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);

      --qr-modal-bg: rgba(3, 7, 18, 0.8);
      --qr-card-bg: rgba(15, 23, 42, 0.85);
      --qr-card-border: rgba(255, 255, 255, 0.22);

      --arc-1: rgba(99, 102, 241, 0.25);
      --arc-2: rgba(56, 189, 248, 0.2);
      --arc-edge: rgba(255, 255, 255, 0.25);
    }

    :root[data-theme="light"] {
      --bg-base: #f0f4f8;
      --bg-gradient: radial-gradient(circle at 50% 20%, #ffffff 0%, #e0f2fe 50%, #bae6fd 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-shadow: 0 20px 40px rgba(14, 165, 233, 0.15), inset 0 1.5px 2px rgba(255, 255, 255, 1);
      --glass-glow: rgba(2, 132, 199, 0.3);

      --text-title: #0f172a;
      --text-sub: #0284c7;
      --text-quote: #0f172a;
      --text-author: #475569;

      /* Liquid Toggle Theme Light */
      --toggle-track-bg: rgba(255, 255, 255, 0.9);
      --toggle-track-border: rgba(255, 255, 255, 1);
      --toggle-orb-bg: radial-gradient(circle at 45% 45%, #ffffff 0%, #fef08a 40%, #60a5fa 100%);
      --toggle-orb-glow: 0 4px 15px rgba(253, 224, 71, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.95);

      /* Liquid Glass Dock & Indicator Theme Light */
      --nav-dock-bg: rgba(255, 255, 255, 0.75);
      --nav-dock-border: rgba(255, 255, 255, 0.95);
      --nav-dock-shadow: inset 0 2px 4px rgba(255, 255, 255, 1), 0 15px 30px rgba(14, 165, 233, 0.2);
      
      --indicator-pill-bg: rgba(2, 132, 199, 0.2);
      --indicator-pill-border: rgba(2, 132, 199, 0.6);
      --indicator-pill-glow: 0 4px 15px rgba(2, 132, 199, 0.25);
      
      --nav-icon-active: #0284c7;
      --nav-icon-inactive: #64748b;

      --link-bg: rgba(255, 255, 255, 0.85);
      --link-border: rgba(255, 255, 255, 0.95);
      --link-hover: rgba(255, 255, 255, 1);
      --link-shadow: 0 8px 20px rgba(2, 132, 199, 0.12);

      --qr-modal-bg: rgba(186, 230, 253, 0.7);
      --qr-card-bg: rgba(255, 255, 255, 0.95);
      --qr-card-border: rgba(255, 255, 255, 1);

      --arc-1: rgba(186, 230, 253, 0.6);
      --arc-2: rgba(125, 211, 252, 0.4);
      --arc-edge: rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-base);
      background-image: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px 15px;
      transition: background 0.4s ease;
    }

    /* ==========================================================
       BACKGROUND SPHERES (GPU-ACCELERATED)
       ========================================================== */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glass-arc-sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--arc-1) 0%, var(--arc-2) 70%, transparent 100%);
      border: 1.5px solid var(--arc-edge);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: floatArc 18s infinite ease-in-out alternate;
      will-change: transform;
      transform: translateZ(0);
    }

    .arc-1 { width: 450px; height: 450px; top: -120px; left: -140px; animation-duration: 22s; }
    .arc-2 { width: 400px; height: 400px; bottom: -100px; right: -120px; animation-duration: 18s; }
    .arc-center { width: 280px; height: 280px; top: 45%; left: 50%; transform: translate(-50%, -50%); opacity: 0.5; animation-duration: 15s; }

    @keyframes floatArc {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); }
      100% { transform: translate3d(30px, 30px, 0) rotate(8deg); }
    }

    /* ==========================================================
       MAIN CARD CONTAINER
       ========================================================== */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      border-radius: 42px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateZ(0);
      will-change: transform;
    }

    /* ==========================================================
       TOP BAR & NÚT CHUYỂN THEME SẮC NÉT
       ========================================================== */
    .top-bar {
      padding: 18px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    .theme-toggle-track {
      position: relative;
      width: 78px;
      height: 42px;
      background: var(--toggle-track-bg);
      border: 1.5px solid var(--toggle-track-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.3s ease;
    }

    .theme-orb-indicator {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--toggle-orb-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: var(--toggle-orb-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
      will-change: transform;
    }

    /* ICON MẶT TRỜI CHUẨN SẮC NÉT - KHÔNG BỊ NHÒE */
    .orb-sun-svg {
      width: 22px;
      height: 22px;
      opacity: 0;
      transform: scale(0.6) rotate(-45deg);
      transition: opacity 0.25s ease, transform 0.35s ease;
      position: absolute;
      filter: none; /* Bỏ filter nhòe chói */
    }

    .orb-moon {
      color: #ffffff;
      font-size: 1rem;
      opacity: 1;
      transform: scale(1) rotate(0deg);
      transition: opacity 0.25s ease, transform 0.35s ease;
      position: absolute;
    }

    [data-theme="light"] .theme-orb-indicator {
      transform: translate3d(36px, 0, 0);
    }

    [data-theme="light"] .orb-sun-svg {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    [data-theme="light"] .orb-moon {
      opacity: 0;
      transform: scale(0.6) rotate(45deg);
    }

    .qr-glass-btn {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .qr-glass-btn:active {
      transform: scale(0.95);
    }

    /* ==========================================================
       DYNAMIC PROFILE HEADER
       ========================================================== */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 24px 10px;
      z-index: 5;
      flex-shrink: 0;
    }

    .avatar-frame {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      padding: 3px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.2) 100%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.3s ease;
    }

    .avatar-frame:hover img { filter: grayscale(0%); }

    .profile-info-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .profile-name-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 8px;
      letter-spacing: -0.3px;
    }

    .profile-subtitle {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 1px;
    }

    /* ==========================================================
       VIEWPORT & TAB CONTENT SLIDER
       ========================================================== */
    .tab-viewport-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .viewport {
      width: 300%;
      display: flex;
      align-items: flex-start;
      transform: translate3d(-33.333%, 0, 0);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .tab-page {
      width: 33.333%;
      padding: 8px 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .liquid-link-item {
      display: flex;
      align-items: center;
      padding: 13px 18px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.92rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--link-shadow);
      transition: transform 0.2s ease, background 0.2s ease;
      will-change: transform;
      transform: translateZ(0);
    }

    .liquid-link-item:active {
      transform: scale(0.98);
    }

    .liquid-link-item:hover {
      background: var(--link-hover);
      transform: translate3d(0, -2px, 0);
    }

    .link-app-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 14px;
    }

    .link-text-label { flex: 1; text-align: left; }
    .link-chevron { font-size: 0.8rem; color: var(--text-sub); }

    .home-quote-box {
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .quote-text {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-quote);
      line-height: 1.6;
    }

    .quote-author {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 10px;
      display: block;
    }

    /* ==========================================================
       THANH TAB BOTTOM NAV GLASS (HIỂN THỊ CỐ ĐỊNH RÕ RÀNG)
       ========================================================== */
    .bottom-nav-container {
      padding: 8px 22px 20px;
      z-index: 20;
      width: 100%;
      flex-shrink: 0;
      position: relative;
    }

    .bottom-nav-glass {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-dock-bg);
      border: 1.5px solid var(--nav-dock-border);
      border-radius: 36px;
      padding: 4px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--nav-dock-shadow);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      height: calc(100% - 8px);
      background: var(--indicator-pill-bg);
      border: 1.5px solid var(--indicator-pill-border);
      border-radius: 30px;
      box-shadow: var(--indicator-pill-glow);
      transform: translate3d(100%, 0, 0);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
      will-change: transform;
    }

    .nav-tab-btn {
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .nav-tab-btn i {
      font-size: 1.25rem;
      color: var(--nav-icon-inactive);
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .nav-tab-btn.active i {
      color: var(--nav-icon-active);
      transform: scale(1.1);
    }

    /* ==========================================================
       MODAL QR CODE
       ========================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--qr-modal-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-glass-card {
      background: var(--qr-card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid var(--qr-card-border);
      border-radius: 36px;
      padding: 24px 20px;
      width: 88%;
      max-width: 310px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .qr-glass-card { transform: scale(1); }

    .qr-modal-header {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-title);
      margin-bottom: 14px;
    }

    .qr-box-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto;
      padding: 8px;
      background: #ffffff;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas img { border-radius: 10px; }

    .qr-center-avatar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      object-fit: cover;
      pointer-events: none;
    }

    .copy-link-btn {
      width: 170px;
      margin: 14px auto 0;
      padding: 10px;
      border: none;
      background: var(--text-sub);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.88rem;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .close-modal-btn {
      margin-top: 10px;
      width: 100%;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND LIQUID SPHERES -->
  <div class="bg-canvas">
    <div class="glass-arc-sphere arc-1"></div>
    <div class="glass-arc-sphere arc-2"></div>
    <div class="glass-arc-sphere arc-center"></div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar" id="top-bar">
      <!-- Theme Switcher Orb (Sắc Nét) -->
      <div class="theme-toggle-track" id="theme-toggle" role="button" aria-label="Toggle Theme">
        <div class="theme-orb-indicator" id="theme-indicator">
          <i class="fa-solid fa-moon orb-moon"></i>
          
          <!-- ICON MẶT TRỜI SVG CHUẨN TIA NÉT - RÕ RÀNG KHÔNG MỜ CHÓI -->
          <svg class="orb-sun-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Vòng tròn lõi -->
            <circle cx="50" cy="50" r="21" fill="#fde047" />
            <!-- 8 Tia hạt nước / lá mềm mại bao quanh chuẩn vector -->
            <g fill="#fde047">
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" />
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" transform="rotate(45 50 50)" />
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" transform="rotate(90 50 50)" />
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" transform="rotate(135 50 50)" />
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" transform="rotate(180 50 50)" />
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" transform="rotate(225 50 50)" />
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" transform="rotate(270 50 50)" />
              <path d="M50 8 C53 16 53 22 50 24 C47 22 47 16 50 8 Z" transform="rotate(315 50 50)" />
            </g>
          </svg>

        </div>
      </div>

      <button class="qr-glass-btn" id="open-qr-btn" aria-label="Open QR Code">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>

    <!-- DYNAMIC PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-frame">
        <img src="images/Huy.png" alt="Avatar Nhật Huy">
      </div>
      <div class="profile-info-block">
        <h1 class="profile-name-title">Nhật Huy</h1>
        <p class="profile-subtitle">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT CHUYỂN TAB -->
    <div class="tab-viewport-wrapper">
      <div class="viewport" id="viewport">

        <!-- TAB 1: SOCIAL MEDIA -->
        <section class="tab-page" id="page-social">
          <div class="links-list" id="social-links-list"></div>
        </section>

        <!-- TAB 2: HOME (CAPTION QUOTE) -->
        <section class="tab-page" id="page-home">
          <div class="home-quote-box">
            <p class="quote-text">“<br>Even the darkest night will end,<br>and the sun will rise.</p>
            <span class="quote-author">Les Misérables - Victor Hugo</span>
          </div>
        </section>

        <!-- TAB 3: WORK -->
        <section class="tab-page" id="page-work">
          <div class="links-list" id="work-links-list"></div>
        </section>

      </div>
    </div>

    <!-- THANH TAB LIQUID GLASS DOCK (CỐ ĐỊNH TRÊN TẤT CẢ THIẾT BỊ) -->
    <div class="bottom-nav-container">
      <nav class="bottom-nav-glass">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social Tab">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home Tab">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work Tab">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="qr-glass-card">
      <h3 class="qr-modal-header">Scan QR Code</h3>
      
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar Center" class="qr-center-avatar">
      </div>

      <button class="copy-link-btn" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>

      <button class="close-modal-btn" id="close-qr-btn">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderLinks("social-links-list", typeof bioData !== 'undefined' ? bioData.tabs.social : []);
      renderLinks("work-links-list", typeof bioData !== 'undefined' ? bioData.tabs.work : []);

      initTabNavigation();
      initThemeToggle();
      initQRCodeModal();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !items) return;
      container.innerHTML = items.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="liquid-link-item">
          <img src="${item.icon}" alt="${item.title}" class="link-app-icon">
          <span class="link-text-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-chevron"></i>
        </a>
      `).join('');
    }

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");

      function switchTab(index) {
        // Chuyển Tab cực mượt bằng hardware-accelerated Transform 3D
        viewport.style.transform = `translate3d(-${index * 33.333}%, 0, 0)`;
        indicator.style.transform = `translate3d(${index * 100}%, 0, 0)`;

        navBtns.forEach((btn, i) => {
          if (i === index) btn.classList.add("active");
          else btn.classList.remove("active");
        });
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      // Mặc định chọn Home (Index 1)
      switchTab(1);
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("liquid-theme") || "dark";
      applyTheme(savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        applyTheme(newTheme);
        localStorage.setItem("liquid-theme", newTheme);
      });

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
      }
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 154,
            height: 154,
            colorDark: "#060913",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--text-sub)";
          }, 2000);
        });
      });

      closeBtn.addEventListener("click", () => modal.classList.remove("active"));
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("active");
      });
    }
  </script>
</body>
</html>
