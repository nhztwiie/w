<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nhật Huy | w.bio</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================
       TITANIUM LIQUID GLASS DESIGN SYSTEM
       ========================================================== */
    :root[data-theme="dark"] {
      /* Palette: Titanium Dark, Grayscale, Monochrome Gradients */
      --bg-surface: #0a0a0c;
      --bg-gradient: radial-gradient(circle at 50% 0%, #2a2d32 0%, #111317 55%, #050505 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-bg-hover: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-highlight: rgba(255, 255, 255, 0.45);
      --glass-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.8),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.3),
        inset 0 -1px 2px rgba(0, 0, 0, 0.7);

      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --text-muted: #71717a;

      --titanium-gradient: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #475569 100%);
      --titanium-glow: rgba(226, 232, 240, 0.25);

      --pill-bg: rgba(255, 255, 255, 0.04);
      --pill-border: rgba(255, 255, 255, 0.12);
      --pill-hover-bg: rgba(255, 255, 255, 0.09);
      --pill-hover-border: rgba(255, 255, 255, 0.35);

      --dock-bg: rgba(18, 18, 20, 0.55);
      --dock-border: rgba(255, 255, 255, 0.15);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.08) 100%);
      --indicator-border: rgba(255, 255, 255, 0.4);

      --orb-1: rgba(255, 255, 255, 0.15);
      --orb-2: rgba(161, 161, 170, 0.12);
      --orb-3: rgba(82, 82, 91, 0.2);
    }

    :root[data-theme="light"] {
      /* Palette: Titanium Light / Frost */
      --bg-surface: #f4f4f5;
      --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #e4e4e7 60%, #d4d4d8 100%);

      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-bg-hover: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.7);
      --glass-border-highlight: rgba(255, 255, 255, 1);
      --glass-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.08),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.05);

      --text-main: #09090b;
      --text-sub: #52525b;
      --text-muted: #71717a;

      --titanium-gradient: linear-gradient(135deg, #09090b 0%, #3f3f46 50%, #71717a 100%);
      --titanium-glow: rgba(0, 0, 0, 0.15);

      --pill-bg: rgba(255, 255, 255, 0.55);
      --pill-border: rgba(255, 255, 255, 0.8);
      --pill-hover-bg: rgba(255, 255, 255, 0.85);
      --pill-hover-border: rgba(9, 9, 11, 0.3);

      --dock-bg: rgba(255, 255, 255, 0.6);
      --dock-border: rgba(255, 255, 255, 0.9);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(228, 228, 231, 0.7) 100%);
      --indicator-border: rgba(0, 0, 0, 0.2);

      --orb-1: rgba(255, 255, 255, 0.8);
      --orb-2: rgba(212, 212, 216, 0.5);
      --orb-3: rgba(161, 161, 170, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px;
      transition: background 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* LIQUID BACKGROUND ORBS */
    .liquid-bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      will-change: transform;
      animation: fluidFloat 18s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 500px; height: 500px;
      top: -150px; left: -100px;
      background: radial-gradient(circle at 35% 35%, var(--orb-1) 0%, transparent 70%);
      animation-duration: 16s;
    }

    .orb-2 {
      width: 450px; height: 450px;
      bottom: -100px; right: -80px;
      background: radial-gradient(circle at 35% 35%, var(--orb-2) 0%, transparent 70%);
      animation-duration: 14s;
    }

    .orb-3 {
      width: 350px; height: 350px;
      top: 40%; left: 30%;
      background: radial-gradient(circle at 35% 35%, var(--orb-3) 0%, transparent 70%);
      animation-duration: 20s;
    }

    @keyframes fluidFloat {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      33% { transform: translate3d(40px, -50px, 0) scale(1.1) rotate(120deg); }
      66% { transform: translate3d(-30px, 40px, 0) scale(0.95) rotate(240deg); }
      100% { transform: translate3d(30px, 20px, 0) scale(1.05) rotate(360deg); }
    }

    /* MAIN CARD CONTAINER (SUPER-TRANSPARENT LIQUID GLASS) */
    .liquid-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 414px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1.5px solid var(--glass-border);
      border-radius: 44px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.4s cubic-bezier(0.19, 1, 0.22, 1), background 0.4s ease, border-color 0.4s ease;
    }

    /* Specular highlight border top */
    .liquid-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--glass-border-highlight), transparent);
      z-index: 15;
    }

    /* TOP BAR */
    .top-bar {
      padding: 20px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .theme-toggle-track {
      position: relative;
      width: 70px;
      height: 38px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .theme-toggle-track:hover { transform: scale(1.05); }

    .theme-orb-indicator {
      position: absolute;
      top: 3px; left: 3px;
      width: 29px; height: 29px;
      border-radius: 50%;
      background: var(--titanium-gradient);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 10px var(--titanium-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .orb-icon {
      font-size: 0.8rem;
      position: absolute;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .icon-sun { opacity: 0; transform: scale(0.5) rotate(-90deg); color: #000; }
    .icon-moon { opacity: 1; transform: scale(1) rotate(0deg); color: #fff; }

    [data-theme="light"] .theme-orb-indicator { transform: translate3d(32px, 0, 0); }
    [data-theme="light"] .icon-sun { opacity: 1; transform: scale(1) rotate(0deg); }
    [data-theme="light"] .icon-moon { opacity: 0; transform: scale(0.5) rotate(90deg); }

    .top-bar-controls {
      display: flex;
      gap: 10px;
    }

    .glass-btn {
      width: 40px; height: 40px;
      border-radius: 18px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.2);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, border-color 0.3s ease;
    }

    .glass-btn:hover {
      transform: translateY(-2px) scale(1.05);
      background: var(--pill-hover-bg);
      border-color: var(--pill-hover-border);
    }

    /* PROFILE HEADER */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 24px 8px;
      z-index: 15;
    }

    .avatar-ring {
      position: relative;
      width: 100px; height: 100px;
      border-radius: 50%;
      padding: 4px;
      background: var(--titanium-gradient);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 20px var(--titanium-glow);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .avatar-ring:hover {
      transform: scale(1.06) rotate(3deg);
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(80%);
      transition: filter 0.4s ease;
    }

    .avatar-ring:hover img { filter: grayscale(0%); }

    .profile-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 14px;
      letter-spacing: -0.03em;
      background: var(--titanium-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .profile-tagline {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* VIEWPORT SLIDER */
    .viewport-wrapper {
      width: 100%;
      overflow: hidden;
      flex: 1;
    }

    .viewport {
      width: 300%;
      display: flex;
      transform: translate3d(-33.3333%, 0, 0);
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .tab-page {
      width: 33.3333%;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ios-quote-card {
      padding: 22px;
      text-align: center;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 28px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }

    .quote-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.5;
    }

    .quote-author {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 12px;
      display: block;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .glass-link-item {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 24px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.15);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, border-color 0.3s ease;
    }

    .glass-link-item:hover {
      transform: translateY(-3px) scale(1.02);
      background: var(--pill-hover-bg);
      border-color: var(--pill-hover-border);
    }

    .link-icon-box {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      font-size: 1rem;
      color: var(--text-main);
    }

    .link-label { flex: 1; text-align: left; }
    .link-arrow { font-size: 0.8rem; color: var(--text-muted); }

    /* BOTTOM NAV DOCK CAPSULE */
    .bottom-nav-container {
      padding: 8px 22px 22px;
      z-index: 30;
      width: 100%;
    }

    .nav-dock {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--dock-bg);
      border: 1.5px solid var(--dock-border);
      border-radius: 40px;
      padding: 5px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.2);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 5px; left: 5px;
      width: calc((100% - 10px) / 3);
      height: calc(100% - 10px);
      background: var(--indicator-bg);
      border: 1px solid var(--indicator-border);
      border-radius: 34px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }

    .nav-tab-btn {
      flex: 1;
      height: 44px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .nav-tab-btn i {
      font-size: 1.15rem;
      color: var(--text-muted);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .nav-tab-btn.active i {
      color: var(--text-main);
      transform: scale(1.1);
    }

    /* MODAL GLASS */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid var(--glass-border-highlight);
      border-radius: 36px;
      padding: 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: var(--glass-shadow);
    }

    .modal-backdrop.active .modal-card { transform: scale(1); }

    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 16px; }

    .qr-wrapper {
      background: #ffffff;
      padding: 12px;
      border-radius: 20px;
      display: inline-block;
    }

    .btn-close {
      margin-top: 16px;
      padding: 10px 20px;
      border: 1.5px solid var(--glass-border);
      background: var(--pill-bg);
      color: var(--text-main);
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .btn-close:hover { background: var(--pill-hover-bg); }
  </style>
</head>
<body>

  <!-- DYNAMIC LIQUID BACKGROUND -->
  <div class="liquid-bg-canvas">
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
    <div class="liquid-orb orb-3"></div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="theme-toggle-track" id="theme-toggle" role="button" aria-label="Toggle Theme">
        <div class="theme-orb-indicator">
          <i class="fa-solid fa-moon orb-icon icon-moon"></i>
          <i class="fa-solid fa-sun orb-icon icon-sun"></i>
        </div>
      </div>

      <div class="top-bar-controls">
        <button class="glass-btn" id="open-qr-btn" aria-label="Open QR Code">
          <i class="fa-solid fa-qrcode"></i>
        </button>
      </div>
    </div>

    <!-- PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-ring">
        <img src="https://via.placeholder.com/150" alt="Avatar Nhật Huy">
      </div>
      <h1 class="profile-name">Nhật Huy</h1>
      <p class="profile-tagline">Digital Creator & Developer</p>
    </header>

    <!-- VIEWPORT SLIDER -->
    <div class="viewport-wrapper">
      <div class="viewport" id="viewport">

        <!-- TAB 1: SOCIAL LINKS -->
        <section class="tab-page" id="page-social">
          <div class="links-list">
            <a href="#" class="glass-link-item">
              <div class="link-icon-box"><i class="fa-brands fa-github"></i></div>
              <span class="link-label">GitHub</span>
              <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
            <a href="#" class="glass-link-item">
              <div class="link-icon-box"><i class="fa-brands fa-facebook"></i></div>
              <span class="link-label">Facebook</span>
              <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
          </div>
        </section>

        <!-- TAB 2: HOME (QUOTE / ABOUT) -->
        <section class="tab-page" id="page-home">
          <div class="ios-quote-card">
            <p class="quote-text">“Simplicity is the ultimate sophistication.”</p>
            <span class="quote-author">Leonardo da Vinci</span>
          </div>
        </section>

        <!-- TAB 3: WORK / CONTACT -->
        <section class="tab-page" id="page-work">
          <div class="links-list">
            <a href="#" class="glass-link-item">
              <div class="link-icon-box"><i class="fa-solid fa-briefcase"></i></div>
              <span class="link-label">Portfolio</span>
              <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
            <a href="#" class="glass-link-item">
              <div class="link-icon-box"><i class="fa-solid fa-envelope"></i></div>
              <span class="link-label">Contact Me</span>
              <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
          </div>
        </section>

      </div>
    </div>

    <!-- NAVIGATION DOCK CAPSULE -->
    <div class="bottom-nav-container">
      <nav class="nav-dock">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work">
          <i class="fa-solid fa-briefcase"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal" role="dialog" aria-hidden="true">
    <div class="modal-card">
      <h3 class="modal-title">QR Code</h3>
      <div class="qr-wrapper">
        <div id="qrcode-canvas"></div>
      </div>
      <div>
        <button class="btn-close" id="close-qr-btn">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initTabNavigation();
      initThemeToggle();
      initQRCodeModal();
    });

    /* Tab Navigation Logic */
    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");

      function switchTab(index) {
        viewport.style.transform = `translate3d(-${index * 33.3333}%, 0, 0)`;

        const activeBtn = navBtns[index];
        if (activeBtn && indicator) {
          indicator.style.transform = `translate3d(${activeBtn.offsetLeft - 5}px, 0, 0)`;
        }

        navBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      requestAnimationFrame(() => switchTab(1));
    }

    /* Theme Toggle Logic */
    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("liquid-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("liquid-theme", newTheme);
      });
    }

    /* QR Code Modal Logic */
    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");

      let qrGenerated = false;

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: window.location.href,
            width: 140,
            height: 140,
            colorDark: "#09090b",
            colorLight: "#ffffff"
          });
          qrGenerated = true;
        }
      });

      closeBtn.addEventListener("click", () => modal.classList.remove("active"));
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });
    }
  </script>
</body>
</html>
