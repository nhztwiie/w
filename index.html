  <style>
    /* ==========================================================
       TITANIUM & LIQUID GLASS SYSTEM - SOFT LIGHT & MAGICAL FIREFLIES
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #2a2d32 0%, #111317 65%, #08090a 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-highlight: rgba(255, 255, 255, 0.45);
      --glass-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.35),
        inset 0 -1px 2px rgba(0, 0, 0, 0.7);
      --glass-glow: rgba(224, 224, 224, 0.15);

      --text-title: #ffffff;
      --text-sub: #d1d5db;
      --text-quote: #f3f4f6;
      --text-author: #9ca3af;

      --pill-bg: rgba(255, 255, 255, 0.06);
      --pill-border: rgba(255, 255, 255, 0.18);
      --pill-hover-bg: rgba(255, 255, 255, 0.14);
      --pill-hover-border: rgba(255, 255, 255, 0.5);
      --pill-hover-glow: 0 12px 32px rgba(255, 255, 255, 0.15);

      --dock-bg: rgba(20, 22, 26, 0.5);
      --dock-border: rgba(255, 255, 255, 0.2);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(160, 160, 160, 0.18) 100%);
      --indicator-border: rgba(255, 255, 255, 0.45);

      --orb-1: rgba(255, 255, 255, 0.35);
      --orb-2: rgba(160, 170, 190, 0.4);
      --orb-3: rgba(210, 215, 225, 0.3);
    }

    :root[data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #f3f4f6 0%, #e5e7eb 60%, #cbd5e1 100%);

      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-border-highlight: rgba(255, 255, 255, 1);
      --glass-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.08),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.03);
      --glass-glow: rgba(0, 0, 0, 0.05);

      --text-title: #111827;
      --text-sub: #4b5563;
      --text-quote: #111827;
      --text-author: #6b7280;

      --pill-bg: rgba(255, 255, 255, 0.75);
      --pill-border: rgba(255, 255, 255, 0.95);
      --pill-hover-bg: rgba(255, 255, 255, 0.95);
      --pill-hover-border: #9ca3af;
      --pill-hover-glow: 0 12px 30px rgba(0, 0, 0, 0.08);

      --dock-bg: rgba(255, 255, 255, 0.7);
      --dock-border: rgba(255, 255, 255, 0.95);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(229, 231, 235, 0.85) 100%);
      --indicator-border: rgba(156, 163, 175, 0.5);

      --orb-1: rgba(255, 255, 255, 0.9);
      --orb-2: rgba(203, 213, 225, 0.6);
      --orb-3: rgba(226, 232, 240, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px;
      transition: background 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* BACKGROUND CANVAS & ORBS */
    .ios26-bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
      transform: translateZ(0);
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(25px);
      mix-blend-mode: overlay;
      will-change: transform, opacity;
      opacity: 0.85;
    }

    .orb-primary {
      width: 420px; height: 420px;
      top: -80px; left: -60px;
      background: radial-gradient(circle at 35% 35%, var(--orb-1) 0%, rgba(255,255,255,0.1) 60%, transparent 80%);
      animation: floatFluid1 12s infinite ease-in-out alternate;
    }

    .orb-secondary {
      width: 380px; height: 380px;
      bottom: -60px; right: -50px;
      background: radial-gradient(circle at 35% 35%, var(--orb-2) 0%, rgba(255,255,255,0.08) 60%, transparent 80%);
      animation: floatFluid2 15s infinite ease-in-out alternate;
    }

    .orb-accent {
      width: 300px; height: 300px;
      top: 40%; left: 30%;
      background: radial-gradient(circle at 35% 35%, var(--orb-3) 0%, rgba(255,255,255,0.1) 60%, transparent 80%);
      animation: floatFluid3 10s infinite ease-in-out alternate;
    }

    @keyframes floatFluid1 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(120px, 80px, 0) scale(1.15) rotate(15deg); }
      100% { transform: translate3d(40px, 140px, 0) scale(0.9) rotate(-10deg); }
    }

    @keyframes floatFluid2 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(-100px, -90px, 0) scale(1.2) rotate(-20deg); }
      100% { transform: translate3d(-40px, -150px, 0) scale(0.95) rotate(10deg); }
    }

    @keyframes floatFluid3 {
      0% { transform: translate3d(0, 0, 0) scale(0.9); }
      50% { transform: translate3d(-90px, 70px, 0) scale(1.25); }
      100% { transform: translate3d(100px, -60px, 0) scale(0.85); }
    }

    /* MAGICAL FIREFLIES (ĐOM ĐÓM LUNG LINH HƠN 50 HẠT) */
    .firefly {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
      animation: fireflyTwinkle var(--twinkle-duration, 3s) infinite ease-in-out;
    }

    @keyframes fireflyTwinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.95; transform: scale(1.4); filter: drop-shadow(0 0 10px currentColor); }
    }

    .glass-mesh-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 20px 20px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.3;
    }

    /* MAIN CARD CONTAINER */
    .liquid-card-ios26 {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 414px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1.5px solid var(--glass-border);
      border-radius: 44px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.45s cubic-bezier(0.19, 1, 0.22, 1), background 0.4s ease, border-color 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .liquid-card-ios26.tab-animating {
      transform: scale(0.985);
      filter: blur(0.5px);
    }

    .liquid-card-ios26::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--glass-border-highlight), transparent);
      z-index: 15;
    }

    /* TOP BAR */
    .top-bar {
      padding: 20px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      flex-shrink: 0;
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-track {
      position: relative;
      width: 78px;
      height: 42px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .theme-toggle-track:hover { transform: scale(1.05); }
    .theme-toggle-track:active { transform: scale(0.95); }

    .theme-orb-indicator {
      position: absolute;
      top: 3px; left: 3px;
      width: 33px; height: 33px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%);
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease;
      will-change: transform;
    }

    .orb-icon {
      font-size: 0.9rem;
      transition: opacity 0.3s ease, transform 0.3s ease;
      position: absolute;
    }

    .icon-sun { opacity: 0; transform: scale(0.5) rotate(-90deg); color: #111827; }
    .icon-moon { opacity: 1; transform: scale(1) rotate(0deg); color: #111827; }

    [data-theme="light"] .theme-orb-indicator {
      transform: translate3d(36px, 0, 0);
      background: linear-gradient(135deg, #ffffff 0%, #d1d5db 100%);
    }
    [data-theme="light"] .icon-sun { opacity: 1; transform: scale(1) rotate(0deg); }
    [data-theme="light"] .icon-moon { opacity: 0; transform: scale(0.5) rotate(90deg); }

    .glass-btn-ios26 {
      width: 42px; height: 42px;
      border-radius: 18px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.05rem;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-btn-ios26:hover {
      transform: translateY(-3px) scale(1.08);
      border-color: var(--text-sub);
      background: var(--pill-hover-bg);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.5);
    }

    .glass-btn-ios26:active { transform: scale(0.92); }

    .music-btn.playing i {
      animation: spinMusic 3s linear infinite;
      color: var(--text-sub);
    }

    @keyframes spinMusic {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* PROFILE HEADER */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 24px 8px;
      z-index: 15;
      flex-shrink: 0;
      transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), margin 0.4s cubic-bezier(0.19, 1, 0.22, 1);
    }

    .avatar-ring {
      position: relative;
      width: 104px; height: 104px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.05) 100%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3), 0 0 25px var(--glass-glow);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    }

    .avatar-ring:hover {
      transform: scale(1.06) rotate(3deg);
      box-shadow: 0 20px 45px rgba(255, 255, 255, 0.2), 0 0 35px var(--glass-glow);
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    .avatar-ring:hover img { 
      filter: grayscale(0%); 
      transform: scale(1.04);
    }

    .profile-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .profile-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 12px;
      letter-spacing: -0.03em;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .profile-name:hover {
      transform: scale(1.02);
      color: var(--text-sub);
    }

    .profile-tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 2px;
      letter-spacing: -0.01em;
    }

    .liquid-card-ios26.compact-mode .profile-header {
      transform: translate3d(0, 0, 0) scale(0.8);
      margin-bottom: -58px;
    }

    .liquid-card-ios26.compact-mode .profile-meta {
      opacity: 0;
      transform: translate3d(0, -15px, 0);
      pointer-events: none;
    }

    /* VIEWPORT SLIDER */
    .viewport-wrapper {
      width: 100%;
      overflow: hidden;
      flex: 1;
    }

    .viewport {
      width: 300%;
      display: flex;
      align-items: flex-start;
      transform: translate3d(-33.3333%, 0, 0);
      transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1);
      will-change: transform;
    }

    .tab-page {
      width: 33.3333%;
      padding: 12px 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ios26-quote-card {
      margin: 8px 0 16px;
      padding: 24px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--glass-border);
      border-radius: 30px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .ios26-quote-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--text-sub);
      box-shadow: 0 15px 35px rgba(255, 255, 255, 0.08), inset 0 1px 3px rgba(255, 255, 255, 0.4);
    }

    .quote-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-quote);
      line-height: 1.6;
    }

    .quote-author {
      font-size: 0.88rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 14px;
      display: block;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* LIQUID GLASS DYNAMIC LINK ITEMS */
    .ios26-link-item {
      position: relative;
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 26px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.2), 0 4px 15px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .ios26-link-item::after {
      content: '';
      position: absolute;
      top: 0; left: -150%;
      width: 150%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transform: skewX(-20deg);
      transition: none;
    }

    .ios26-link-item:hover::after {
      left: 150%;
      transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ios26-link-item:hover {
      transform: translateY(-5px) scale(1.03);
      background: var(--pill-hover-bg);
      border-color: var(--pill-hover-border);
      box-shadow: var(--pill-hover-glow), inset 0 1.5px 3px rgba(255, 255, 255, 0.6);
    }

    .ios26-link-item:active { 
      transform: translateY(-1px) scale(0.97); 
      background: rgba(255, 255, 255, 0.2);
    }

    .link-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      margin-right: 14px;
      object-fit: cover;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .ios26-link-item:hover .link-icon {
      transform: scale(1.15) rotate(6deg);
    }

    .link-label { 
      flex: 1; 
      text-align: left; 
      letter-spacing: -0.01em; 
      transition: transform 0.35s ease, color 0.35s ease;
    }

    .ios26-link-item:hover .link-label {
      transform: translateX(4px);
    }

    .link-arrow {
      font-size: 0.85rem;
      color: var(--text-sub);
      transition: transform 0.35s ease;
    }

    .ios26-link-item:hover .link-arrow {
      transform: translateX(5px);
    }

    /* BOTTOM NAV DOCK CAPSULE */
    .bottom-nav-container {
      padding: 6px 22px 22px;
      z-index: 30;
      width: 100%;
      flex-shrink: 0;
    }

    .ios26-nav-dock {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--dock-bg);
      border: 1.5px solid var(--dock-border);
      border-radius: 40px;
      padding: 6px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.3), 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 6px; left: 6px;
      width: calc((100% - 12px) / 3);
      height: calc(100% - 12px);
      background: var(--indicator-bg);
      border: 1.5px solid var(--indicator-border);
      border-radius: 34px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
      will-change: transform;
    }

    .nav-tab-btn {
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: transform 0.25s ease;
    }

    .nav-tab-btn:hover { transform: scale(1.1); }

    .nav-tab-btn i {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    [data-theme="light"] .nav-tab-btn i { color: #6b7280; }

    .nav-tab-btn.active i {
      color: var(--text-title);
      transform: scale(1.15);
    }

    [data-theme="light"] .nav-tab-btn.active i { color: #111827; }

    /* MODAL SYSTEM */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

    .qr-glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid var(--glass-border-highlight);
      border-radius: 40px;
      padding: 28px 24px;
      width: 88%;
      max-width: 320px;
      text-align: center;
      transform: translate3d(0, 15px, 0) scale(0.95);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: var(--glass-shadow);
    }

    .modal-backdrop.active .qr-glass-card { transform: translate3d(0, 0, 0) scale(1); }
    .qr-title { font-size: 1.2rem; font-weight: 700; color: var(--text-title); margin-bottom: 18px; }

    .qr-box-wrapper {
      position: relative;
      width: 180px; height: 180px;
      margin: 0 auto;
      padding: 12px;
      background: #ffffff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    #qrcode-canvas { width: 100% !important; height: 100% !important; display: flex; justify-content: center; align-items: center; }
    #qrcode-canvas img { border-radius: 12px; }

    .qr-avatar-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      object-fit: cover;
    }

    .btn-copy-link {
      width: 180px;
      margin: 18px auto 0;
      padding: 12px;
      border: 1px solid var(--glass-border-highlight);
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-title);
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-copy-link:hover {
      transform: translateY(-2px) scale(1.03);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }

    .btn-close-modal {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .btn-close-modal:hover { opacity: 1; transform: scale(1.05); }

    .email-textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 16px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-title);
      font-size: 0.9rem;
      resize: none;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .email-textarea:focus { 
      border-color: var(--glass-border-highlight); 
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- BACKGROUND SPHERES & DYNAMIC FIREFLIES CONTAINER -->
  <div class="ios26-bg-canvas" id="firefly-canvas">
    <div class="liquid-orb orb-primary"></div>
    <div class="liquid-orb orb-secondary"></div>
    <div class="liquid-orb orb-accent"></div>
  </div>
  <div class="glass-mesh-overlay"></div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card-ios26" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="theme-toggle-track" id="theme-toggle" role="button" aria-label="Toggle Theme">
        <div class="theme-orb-indicator">
          <i class="fa-solid fa-moon orb-icon icon-moon"></i>
          <i class="fa-solid fa-sun orb-icon icon-sun"></i>
        </div>
      </div>

      <div class="top-bar-controls">
        <button class="glass-btn-ios26" id="open-email-modal-btn" aria-label="Quick Email">
          <i class="fa-solid fa-envelope"></i>
        </button>

        <button class="glass-btn-ios26 music-btn" id="music-toggle-btn" aria-label="Toggle Music">
          <i class="fa-solid fa-music" id="music-icon"></i>
        </button>

        <button class="glass-btn-ios26" id="open-qr-btn" aria-label="Open QR Code">

    </div>

    <!-- PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-ring">
        <img src="images/Huy.png" alt="Avatar Nhật Huy" loading="eager">
      </div>

        <p class="profile-tagline">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT SLIDER -->
    <div class="viewport-wrapper">
      <div class="viewport" id="viewport">

        <!-- TAB 1: SOCIAL -->
        <section class="tab-page" id="page-social">
          <div class="links-list" id="social-links-list"></div>
        </section>

        <!-- TAB 2: HOME (QUOTE) -->
        <section class="tab-page" id="page-home">
          <div class="ios26-quote-card">
            <p class="quote-text">“<br>Even the darkest night will end,<br>and the sun will rise.</p>
            <span class="quote-author">Les Misérables - Victor Hugo</span>
          </div>

        <!-- TAB 3: WORK -->
        <section class="tab-page" id="page-work">
          <div class="links-list" id="work-links-list"></div>

      </div>
    </div>

    <!-- NAVIGATION DOCK CAPSULE -->
    <div class="bottom-nav-container">
      <nav class="ios26-nav-dock">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social">
          <i class="fa-solid fa-share-nodes"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home">
          <i class="fa-solid fa-house"></i>

        <button class="nav-tab-btn" data-index="2" aria-label="Work">

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal" role="dialog" aria-hidden="true">
    <div class="qr-glass-card">
      <h3 class="qr-title">Scan QR Code</h3>
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar" class="qr-avatar-center">
      </div>
      <button class="btn-copy-link" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>
      <button class="btn-close-modal" id="close-qr-btn">Close</button>
    </div>

  <!-- MODAL POP-UP GỬI TIN NHẮN TỨC THÌ -->
  <div class="modal-backdrop" id="email-modal" role="dialog" aria-hidden="true">
    <div class="qr-glass-card">
      <h3 class="qr-title">Instant Message</h3>
      <textarea id="visitor-message" class="email-textarea" placeholder="Type your message to Nhat Huy..."></textarea>
      <button class="btn-copy-link" id="send-instant-email-btn" style="width: 100%;">
        <i class="fa-solid fa-paper-plane"></i>
        <span id="send-btn-text">Send</span>
      </button>
      <button class="btn-close-modal" id="close-email-modal-btn">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    const PUBLIC_KEY = "rnOWqMh55RZYvY_WA";
    const SERVICE_ID = "service_040502w";
    const TEMPLATE_ID = "template_dc22zks";

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof bioData !== 'undefined' && bioData.tabs) {
        renderLinks("social-links-list", bioData.tabs.social);
        renderLinks("work-links-list", bioData.tabs.work);
      }

      initTabNavigation();
      initThemeToggle();
      initQRCodeModal();
      initEmailModal(); 
      initAudioPlayer();
      initEmailJSNotifier();
      initMagicalFireflies(); 
    });

    /* HỆ THỐNG HƠN 50 ĐOM ĐÓM LUNG LINH & TỤ LẠI TỰ NHIÊN THEO CON TRỎ */
    function initMagicalFireflies() {
      const container = document.getElementById('firefly-canvas');
      if (!container) return;

      const fireflyCount = 65; // Đặt số lượng lớn hơn 50 (65 hạt)
      const fireflies = [];

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let isInside = false;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        isInside = true;
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
          isInside = true;
        }
      }, { passive: true });

      window.addEventListener('mouseleave', () => { isInside = false; });

      // Tạo các hạt đom đóm với kích thước, vị trí và màu sắc ngẫu nhiên
      for (let i = 0; i < fireflyCount; i++) {
        const el = document.createElement('div');
        el.className = 'firefly';

        const size = 2 + Math.random() * 4.5; // Kích thước đa dạng từ hạt li ti đến hạt vừa
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        
        // Bảng màu lấp lánh (trắng sáng, vàng ấm, xanh ngọc dịu nhẹ)
        const colors = ['#ffffff', '#fffbeb', '#fef08a', '#e0f2fe', '#bae6fd', '#fbcfe8'];
        const color = colors[Math.floor(Math.random() * colors.length)];

        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.backgroundColor = color;
        el.style.boxShadow = `0 0 ${size * 2.5}px ${color}, 0 0 ${size * 5}px ${color}`;
        el.style.setProperty('--twinkle-duration', `${2.5 + Math.random() * 3.5}s`);

        container.appendChild(el);

        fireflies.push({
          el: el,
          x: x,
          y: y,
          baseX: x,
          baseY: y,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          angle: Math.random() * Math.PI * 2,
          speed: 0.4 + Math.random() * 0.8
        });
      }

      // Vòng lặp chuyển động mượt mà (Animation Loop)
      function animate() {
        fireflies.forEach(f => {
          f.angle += 0.015;
          f.baseX += f.vx + Math.cos(f.angle) * 0.25;
          f.baseY += f.vy + Math.sin(f.angle) * 0.25;

          // Vòng lặp biên màn hình
          if (f.baseX < 0) f.baseX = window.innerWidth;
          if (f.baseX > window.innerWidth) f.baseX = 0;
          if (f.baseY < 0) f.baseY = window.innerHeight;
          if (f.baseY > window.innerHeight) f.baseY = 0;

          let targetX = f.baseX;
          let targetY = f.baseY;

          // Hiệu ứng tụ lại tự nhiên khi chuột/touch ở gần (< 200px)
          if (isInside) {
            const dx = mouseX - f.baseX;
            const dy = mouseY - f.baseY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 200 && dist > 10) {
              const pull = (200 - dist) / 200;
              targetX += dx * pull * 0.4;
              targetY += dy * pull * 0.4;
            }
          }

          f.x += (targetX - f.x) * 0.07;
          f.y += (targetY - f.y) * 0.07;

          f.el.style.transform = `translate3d(${f.x}px, ${f.y}px, 0)`;
        });

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    }

    /* Hàm nhận diện chi tiết thiết bị & địa điểm */
    function getDeviceAndLocationInfo() {
      const ua = navigator.userAgent;
      let vendor = "Chưa xác định hãng";
      let model = "Thiết bị không xác định";
      let os = "Hệ điều hành không xác định";
      let deviceType = "Desktop/Laptop";

      const isMobile = /mobile/i.test(ua);
      const isTablet = /tablet|ipad|playbook|silk/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isTablet) deviceType = "Tablet";
      else if (isMobile) deviceType = "Mobile";

      if (/android/i.test(ua)) {
        const osMatch = ua.match(/Android\s+([\d.]+)/i);
        os = `Android ${osMatch ? osMatch[1] : ''}`;
      } else if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        const osMatch = ua.match(/OS\s+([\d_]+)/i);
        os = `iOS / iPadOS ${osMatch ? osMatch[1].replace(/_/g, '.') : ''}`;
      } else if (/windows nt/i.test(ua)) {
        os = "Windows PC";
      } else if (/macintosh|mac os x/i.test(ua)) {
        os = "macOS";
      }

      if (/android/i.test(ua)) {
        if (/samsung/i.test(ua) || /SM-/i.test(ua)) { vendor = "Samsung"; model = "Samsung Galaxy"; }
        else { model = "Android Device"; }
      } else if (/iphone|ipad/i.test(ua)) {
        vendor = "Apple"; model = "iPhone / iPad";
      } else {
        model = "Desktop/Laptop";
      }

      return { device: `${model} | Hãng: ${vendor} | ${os} (${deviceType})`, location: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Ho_Chi_Minh" };
    }

    function initEmailJSNotifier() {
      if (PUBLIC_KEY === "THAY_PUBLIC_KEY_CUA_BAN") return;
      emailjs.init(PUBLIC_KEY);

      if (!sessionStorage.getItem("email_notified")) {
        setTimeout(() => {
          if (sessionStorage.getItem("email_notified")) return; 
          const { device, location } = getDeviceAndLocationInfo();
          emailjs.send(SERVICE_ID, TEMPLATE_ID, {
            time: new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" }),
            device: device,
            location: location,
            message: "[System] New visitor access on w.bio",
            referrer: document.referrer || "Direct Access"
          }).then(() => sessionStorage.setItem("email_notified", "true")).catch(() => {});
        }, 3000);
      }
    }

    function initEmailModal() {
      const openBtn = document.getElementById("open-email-modal-btn");
      const closeBtn = document.getElementById("close-email-modal-btn");
      const modal = document.getElementById("email-modal");
      const sendBtn = document.getElementById("send-instant-email-btn");
      const sendBtnText = document.getElementById("send-btn-text");
      const messageInput = document.getElementById("visitor-message");

      openBtn.addEventListener("click", () => { modal.classList.add("active"); modal.setAttribute("aria-hidden", "false"); });
      closeBtn.addEventListener("click", () => { modal.classList.remove("active"); modal.setAttribute("aria-hidden", "true"); messageInput.value = ""; });
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });

      sendBtn.addEventListener("click", () => {
        const userMsg = messageInput.value.trim();
        if (!userMsg) { alert("Please enter your message!"); return; }

        sendBtnText.textContent = "Sending...";
        const { device, location } = getDeviceAndLocationInfo();
        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
          time: new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" }),
          device: device, location: location, message: userMsg, referrer: "Instant Message Pop-up"
        }).then(() => {
          sendBtnText.textContent = "Sent Successfully!";
          setTimeout(() => { modal.classList.remove("active"); sendBtnText.textContent = "Send"; messageInput.value = ""; }, 1500);
        }).catch(() => { sendBtnText.textContent = "Send Failed!"; setTimeout(() => sendBtnText.textContent = "Send", 2000); });
      });
    }

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !Array.isArray(items)) return;

      const fragment = document.createDocumentFragment();
      items.forEach((item, index) => {
        const a = document.createElement('a');
        a.href = item.url || '#';
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "ios26-link-item";
        a.style.animationDelay = `${index * 0.08}s`;
        a.innerHTML = `
          <img src="${item.icon}" alt="${item.title}" class="link-icon" loading="lazy">
          <span class="link-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        `;
        fragment.appendChild(a);
      });
      container.innerHTML = '';
      container.appendChild(fragment);
    }

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");
      const tabPages = document.querySelectorAll(".tab-page");

      const topBarEl = document.querySelector(".top-bar");
      const bottomNavEl = document.querySelector(".bottom-nav-container");
      const profileHeaderEl = document.querySelector(".profile-header");

      function adjustCardHeight(index) {
        requestAnimationFrame(() => {
          const topBarH = topBarEl ? topBarEl.offsetHeight : 0;
          const headerH = profileHeaderEl ? profileHeaderEl.offsetHeight : 0;
          const navH = bottomNavEl ? bottomNavEl.offsetHeight : 0;
          const contentH = tabPages[index] ? tabPages[index].scrollHeight : 0;
          mainCard.style.height = `${topBarH + headerH + contentH + navH}px`;
        });
      }

      function switchTab(index) {
        mainCard.classList.add("tab-animating");
        setTimeout(() => mainCard.classList.remove("tab-animating"), 350);

        viewport.style.transform = `translate3d(-${index * 33.3333}%, 0, 0)`;

        const activeBtn = navBtns[index];
        if (activeBtn && indicator) {
          indicator.style.transform = `translate3d(${activeBtn.offsetLeft - 6}px, 0, 0)`;
        }

        navBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));

        if (index === 1) mainCard.classList.remove("compact-mode");
        else mainCard.classList.add("compact-mode");

        adjustCardHeight(index);
      }

      navBtns.forEach((btn, i) => btn.addEventListener("click", () => switchTab(i)));

      window.addEventListener("resize", () => {
        const activeBtn = document.querySelector(".nav-tab-btn.active");
        if (activeBtn) switchTab(parseInt(activeBtn.getAttribute("data-index") || "1"));
      });

      requestAnimationFrame(() => switchTab(1));
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("ios26-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      toggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("ios26-theme", newTheme);
      });
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
        if (!qrGenerated) {
          new QRCode(qrCanvas, { text: shareUrl, width: 156, height: 156, colorDark: "#08090a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
          qrGenerated = true;
        }
      });
      closeBtn.addEventListener("click", () => modal.classList.remove("active"));
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";
          setTimeout(() => { copyText.textContent = "Copy link"; copyBtn.style.background = "rgba(255, 255, 255, 0.15)"; }, 2000);
        });
      });
    }

    function initAudioPlayer() {
      const musicBtn = document.getElementById("music-toggle-btn");
      const musicIcon = document.getElementById("music-icon");
      if (!musicBtn) return;

      let audioCtx = null, audioBuffer = null, sourceNode = null, gainNode = null, isPlaying = false, isLoaded = false;

      function updateUI(playing) {
        if (playing) { musicBtn.classList.add("playing"); musicIcon.className = "fa-solid fa-compact-disc"; }
        else { musicBtn.classList.remove("playing"); musicIcon.className = "fa-solid fa-music"; }
      }

      async function loadAudioFile() {
        try {
          const response = await fetch("audio/neungayay.mp3");
          const arrayBuffer = await response.arrayBuffer();
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          isLoaded = true;
        } catch (e) { console.log("Audio load error:", e); }
      }

      musicBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!isLoaded) await loadAudioFile();
        if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

        if (isPlaying) {
          if (sourceNode) { try { sourceNode.stop(); } catch(err) {} sourceNode = null; }
          isPlaying = false;
          updateUI(false);
        } else {
          if (!audioBuffer) return;
          sourceNode = audioCtx.createBufferSource();
          sourceNode.buffer = audioBuffer;
          sourceNode.loop = true;
          gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.4;
          sourceNode.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          sourceNode.start(0);
          isPlaying = true;
          updateUI(true);
        }
      });
    }
  </script>
