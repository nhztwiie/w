<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nhật Huy | Bio Link</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/email.png">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome & QRCode Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================
       BẢNG MÀU & HIỆU ỨNG LIQUID GLASS (DARK / LIGHT)
       ========================================================== */
    :root[data-theme="dark"] {
      --bg-base: #060913;
      --bg-gradient: radial-gradient(circle at 50% 30%, #172554 0%, #0b1329 55%, #030712 100%);
      
      --glass-bg: rgba(15, 23, 42, 0.25);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      --glass-glow: rgba(56, 189, 248, 0.4);

      --text-title: #ffffff;
      --text-sub: #38bdf8;
      --text-quote: #f1f5f9;
      --text-author: #94a3b8;

      --pill-bg: rgba(30, 41, 59, 0.35);
      --pill-border: rgba(255, 255, 255, 0.15);
      
      --nav-bg: rgba(15, 23, 42, 0.5);
      --indicator-bg: #38bdf8;
      --indicator-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      --nav-icon-active: #0f172a;
      --nav-icon-inactive: #94a3b8;
      --icon-glow: 0 0 12px rgba(56, 189, 248, 0.8);

      --link-bg: rgba(30, 41, 59, 0.3);
      --link-border: rgba(255, 255, 255, 0.12);
      --link-hover: rgba(51, 65, 85, 0.6);

      --qr-modal-bg: rgba(15, 23, 42, 0.7);
      --qr-card-bg: rgba(15, 23, 42, 0.65);
      --qr-card-border: rgba(255, 255, 255, 0.2);

      --arc-1: rgba(30, 58, 138, 0.6);
      --arc-2: rgba(30, 27, 75, 0.7);
      --arc-edge: rgba(186, 230, 253, 0.4);
    }

    :root[data-theme="light"] {
      --bg-base: #e0f2fe;
      --bg-gradient: radial-gradient(circle at 50% 30%, #f0f9ff 0%, #bae6fd 60%, #7dd3fc 100%);
      
      --glass-bg: rgba(255, 255, 255, 0.3);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 25px 50px rgba(14, 165, 233, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.95);
      --glass-glow: rgba(2, 132, 199, 0.3);

      --text-title: #0f172a;
      --text-sub: #0284c7;
      --text-quote: #0f172a;
      --text-author: #475569;

      --pill-bg: rgba(255, 255, 255, 0.45);
      --pill-border: rgba(255, 255, 255, 0.8);

      --nav-bg: rgba(255, 255, 255, 0.5);
      --indicator-bg: #0284c7;
      --indicator-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
      --nav-icon-active: #ffffff;
      --nav-icon-inactive: #64748b;
      --icon-glow: 0 0 12px rgba(2, 132, 199, 0.6);

      --link-bg: rgba(255, 255, 255, 0.38);
      --link-border: rgba(255, 255, 255, 0.85);
      --link-hover: rgba(255, 255, 255, 0.75);

      --qr-modal-bg: rgba(186, 230, 253, 0.5);
      --qr-card-bg: rgba(255, 255, 255, 0.82);
      --qr-card-border: rgba(255, 255, 255, 0.95);

      --arc-1: rgba(186, 230, 253, 0.7);
      --arc-2: rgba(125, 211, 252, 0.5);
      --arc-edge: rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-base);
      background-image: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 15px;
      transition: background 0.5s ease;
    }

    /* ==========================================================
       BACKGROUND SPHERES (GPU ACCELERATED)
       ========================================================== */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .glass-arc-sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, var(--arc-1) 0%, var(--arc-2) 70%, transparent 100%);
      border: 1.5px solid var(--arc-edge);
      box-shadow: 0 0 50px rgba(2, 132, 199, 0.15), inset 0 0 30px var(--arc-edge);
      backdrop-filter: blur(5px);
      animation: floatArc 16s infinite ease-in-out alternate;
      will-change: transform;
    }

    .arc-1 { width: 500px; height: 500px; top: -140px; left: -160px; animation-duration: 18s; }
    .arc-2 { width: 460px; height: 460px; bottom: -110px; right: -130px; animation-duration: 14s; }
    .arc-center { width: 300px; height: 300px; top: 45%; left: 48%; transform: translate(-50%, -50%); opacity: 0.7; animation-duration: 12s; }

    @keyframes floatArc {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(35px, 25px, 0) scale(1.05) rotate(8deg); }
      100% { transform: translate3d(-25px, 45px, 0) scale(0.95) rotate(-8deg); }
    }

    /* ==========================================================
       MAIN CARD CONTAINER
       ========================================================== */
    .liquid-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 410px;
  /* Thay đổi chiều cao cố định thành chiều cao tự động */
      height: auto; 
      min-height: 520px; /* Độ cao tối thiểu để trang Home không bị quá lùn */
      max-height: 90vh;  /* Tránh tràn màn hình trên các thiết bị nhỏ */
  
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1); /* Hiệu ứng co giãn mượt mà */
    }

    @keyframes glassAppear {
      from { opacity: 0; transform: scale(0.95) translateY(15px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ==========================================================
       TOP BAR & CÔNG TẮC THEME (CĂN CHỈNH TỰ ĐỘNG KHÔNG LỆCH)
       ========================================================== */
    .top-bar {
      padding: 18px 24px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    .theme-toggle-pill {
      position: relative;
      width: 68px;
      height: 36px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 2px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .theme-indicator {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.35s ease;
      z-index: 1;
      will-change: transform;
    }

    .theme-icon-box {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      z-index: 2;
      transition: color 0.3s ease;
    }

    .icon-moon { color: #ffffff; }
    .icon-sun { color: #f59e0b; }

    [data-theme="light"] .icon-moon { color: #64748b; }
    [data-theme="light"] .icon-sun { color: #ffffff; }

    .qr-glass-btn {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qr-glass-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 18px var(--glass-glow);
    }

    /* ==========================================================
       DYNAMIC HEADER & AVATAR CÂN ĐỐI NỘI DUNG
       ========================================================== */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5px 24px 0;
      z-index: 5;
      flex-shrink: 0;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .avatar-frame {
      position: relative;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      padding: 3px;
      background: rgba(255, 255, 255, 0.4);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15), 0 0 20px var(--glass-glow);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: width, height;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.35s ease;
    }

    .avatar-frame:hover img { filter: grayscale(0%); }

    .profile-info-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .profile-name-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 8px;
      letter-spacing: -0.3px;
    }

    .profile-subtitle {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 1px;
    }

    .home-quote-box {
      margin: auto 0;
      padding: 0 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .quote-text {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-quote);
      line-height: 1.55;
      letter-spacing: 0.2px;
    }

    .quote-author {
      font-size: 0.82rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 10px;
      display: block;
    }

    /* Thu nhỏ Avatar khi sang tab phụ */
    .liquid-card.compact-mode .avatar-frame {
      width: 68px;
      height: 68px;
    }

    .liquid-card.compact-mode .profile-info-block {
      opacity: 0;
      max-height: 0;
      transform: translateY(-8px);
      pointer-events: none;
      overflow: hidden;
    }

    /* ==========================================================
       VIEWPORT & CONTENT
       ========================================================== */
    .viewport {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      width: 300%;
      transform: translate3d(-33.333%, 0, 0);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .tab-page {
      width: 33.333%;
      height: 100%;
      padding: 10px 24px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      margin: auto 0;
    }

    .liquid-link-item {
      display: flex;
      align-items: center;
      padding: 13px 18px;
      background: var(--link-bg);
      border: 1.5px solid var(--link-border);
      border-radius: 22px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    .liquid-link-item:hover {
      transform: translate3d(0, -3px, 0) scale(1.015);
      background: var(--link-hover);
      box-shadow: 0 10px 25px var(--glass-glow);
    }

    .link-app-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 14px;
    }

    .link-text-label { flex: 1; text-align: left; }
    .link-chevron { font-size: 0.85rem; color: var(--text-sub); transition: transform 0.25s; }
    .liquid-link-item:hover .link-chevron { transform: translate3d(4px, 0, 0); }

    /* ==========================================================
       THANH TAB BÊN DƯỚI
       ========================================================== */
    .bottom-nav-container {
      padding: 10px 20px 20px;
      z-index: 50;
      width: 100%;
      flex-shrink: 0 !important;
      position: relative;
      display: block !important;
    }

    .bottom-nav-glass {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 32px;
      padding: 4px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      height: calc(100% - 8px);
      background: var(--indicator-bg);
      border-radius: 28px;
      box-shadow: var(--indicator-shadow);
      transform: translate3d(100%, 0, 0);
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
      will-change: transform;
    }

    .nav-tab-btn {
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: var(--nav-icon-inactive);
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: color 0.3s, transform 0.3s;
    }

    .nav-tab-btn.active {
      color: var(--nav-icon-active);
      transform: scale(1.1);
      text-shadow: var(--icon-glow);
    }

    /* ==========================================================
       MODAL QR CODE
       ========================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--qr-modal-bg);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-glass-card {
      background: var(--qr-card-bg);
      backdrop-filter: blur(28px);
      border: 1.5px solid var(--qr-card-border);
      border-radius: 36px;
      padding: 24px 20px;
      width: 88%;
      max-width: 310px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25), 0 0 25px var(--glass-glow);
      transform: scale(0.88);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.active .qr-glass-card { transform: scale(1); }

    .qr-modal-header {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-title);
      margin-bottom: 14px;
    }

    .qr-box-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto;
      padding: 10px;
      background: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode-canvas {
      width: 100% !important;
      height: 100% !important;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode-canvas img { border-radius: 10px; }

    .qr-center-avatar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      object-fit: cover;
      pointer-events: none;
    }

    .copy-link-btn {
      width: 180px;            /* Bằng đúng chiều rộng khung QR (180px) */
      margin: 16px auto 0;     /* margin-left/right: auto giúp nút nằm chính giữa */
      padding: 10px 14px;
      border: none;
      background: var(--indicator-bg);
      color: var(--nav-icon-active);
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      transition: all 0.25s ease;
    }
    
    .close-modal-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND LIQUID SPHERES -->
  <div class="bg-canvas">
    <div class="glass-arc-sphere arc-1"></div>
    <div class="glass-arc-sphere arc-2"></div>
    <div class="glass-arc-sphere arc-center"></div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card" id="main-card">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <!-- Theme Switcher -->
      <div class="theme-toggle-pill" id="theme-toggle">
        <div class="theme-indicator" id="theme-indicator"></div>
        <div class="theme-icon-box icon-moon"><i class="fa-solid fa-moon"></i></div>
        <div class="theme-icon-box icon-sun"><i class="fa-solid fa-sun"></i></div>
      </div>

      <button class="qr-glass-btn" id="open-qr-btn" aria-label="Open QR">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>

    <!-- DYNAMIC PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-frame">
        <img src="images/Huy.png" alt="Avatar Nhật Huy">
      </div>
      <div class="profile-info-block">
        <h1 class="profile-name-title">Nhật Huy</h1>
        <p class="profile-subtitle">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT CHUYỂN TAB -->
    <div class="viewport" id="viewport">

      <!-- TAB 1: SOCIAL MEDIA -->
      <section class="tab-page" id="page-social">
        <div class="links-list" id="social-links-list"></div>
      </section>

      <!-- TAB 2: HOME (CAPTION QUOTE) -->
      <section class="tab-page" id="page-home">
        <div class="home-quote-box">
          <br>
          <br>
          <br>
          <p class="quote-text">“<br>Even the darkest night wiil end,<br>and the sun will rise.</p>
          <span class="quote-author">Les Misérables - Victor Hugo</span>
        </div>
      </section>

      <!-- TAB 3: WORK -->
      <section class="tab-page" id="page-work">
        <div class="links-list" id="work-links-list"></div>
      </section>

    </div>

    <!-- THANH CHUYỂN TAB -->
    <div class="bottom-nav-container">
      <nav class="bottom-nav-glass">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Social Tab">
          <i class="fa-solid fa-globe"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home Tab">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work Tab">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal">
    <div class="qr-glass-card">
      <h3 class="qr-modal-header">Scan QR Code</h3>
      
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar Center" class="qr-center-avatar">
      </div>

      <button class="copy-link-btn" id="copy-btn">
        <i class="fa-regular fa-copy"></i>
        <span id="copy-text">Copy link</span>
      </button>

      <button class="close-modal-btn" id="close-qr-btn">Close</button>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderLinks("social-links-list", bioData.tabs.social);
      renderLinks("work-links-list", bioData.tabs.work);

      initTabNavigation();
      initThemeToggle();
      initQRCodeModal();
    });

    function renderLinks(containerId, items) {
      const container = document.getElementById(containerId);
      if (!container || !items) return;
      container.innerHTML = items.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="liquid-link-item" onclick="event.stopPropagation();">
          <img src="${item.icon}" alt="${item.title}" class="link-app-icon">
          <span class="link-text-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-chevron"></i>
        </a>
      `).join('');
    }

    let currentTabIndex = 1;

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");

      function switchTab(index) {
        currentTabIndex = index;

        viewport.style.transform = `translate3d(-${index * 33.333}%, 0, 0)`;
        indicator.style.transform = `translate3d(${index * 100}%, 0, 0)`;

        navBtns.forEach((btn, i) => {
          if (i === index) btn.classList.add("active");
          else btn.classList.remove("active");
        });

        if (index === 1) {
          mainCard.classList.remove("compact-mode");
        } else {
          mainCard.classList.add("compact-mode");
        }
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          switchTab(i);
        });
      });

      switchTab(1);
      window.switchTabGlobal = switchTab;
    }

    function initThemeToggle() {
      const toggle = document.getElementById("theme-toggle");
      const indicator = document.getElementById("theme-indicator");
      
      const savedTheme = localStorage.getItem("liquid-theme") || "dark";
      applyTheme(savedTheme);

      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        
        applyTheme(newTheme);
        localStorage.setItem("liquid-theme", newTheme);
      });

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        
        if (theme === "dark") {
          indicator.style.transform = "translate3d(0, 0, 0)";
          indicator.style.backgroundColor = "#38bdf8";
        } else {
          // Dùng translateX(100%) thay vì px cứng giúp khối ôm khít tuyệt đối nút mặt trời
          indicator.style.transform = "translate3d(100%, 0, 0)";
          indicator.style.backgroundColor = "#f59e0b";
        }
      }
    }

    function initQRCodeModal() {
      const openBtn = document.getElementById("open-qr-btn");
      const closeBtn = document.getElementById("close-qr-btn");
      const modal = document.getElementById("qr-modal");
      const qrCanvas = document.getElementById("qrcode-canvas");
      const copyBtn = document.getElementById("copy-btn");
      const copyText = document.getElementById("copy-text");

      const shareUrl = (typeof bioData !== 'undefined' && bioData.profile && bioData.profile.shareUrl) ? bioData.profile.shareUrl : window.location.href;
      let qrGenerated = false;

      openBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        modal.classList.add("active");
        if (!qrGenerated) {
          new QRCode(qrCanvas, {
            text: shareUrl,
            width: 160,
            height: 160,
            colorDark: "#060913",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      });

      copyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyText.textContent = "Copied!";
          copyBtn.style.background = "#22c55e";
          copyBtn.style.color = "#ffffff";

          setTimeout(() => {
            copyText.textContent = "Copy link";
            copyBtn.style.background = "var(--indicator-bg)";
            copyBtn.style.color = "var(--nav-icon-active)";
          }, 2000);
        });
      });

      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        modal.classList.remove("active");
      });

      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.remove("active");
      });
    }
  </script>
</body>
</html>
