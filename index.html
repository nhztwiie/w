  <style>
    /* ==========================================================
       TITANIUM & LIQUID GLASS SYSTEM - PHYSICS, SPOTLIGHT & SHIMMER
       ========================================================== */
    :root {
      --spring-easing: cubic-bezier(0.32, 0.72, 0, 1);
      --silky-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --liquid-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    :root[data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #2a2d32 0%, #111317 65%, #08090a 100%);
      --glass-bg: rgba(255, 255, 255, 0.045);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-highlight: rgba(255, 255, 255, 0.45);
      --glass-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.8),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.35),
        inset 0 -2px 4px rgba(0, 0, 0, 0.65);
      --glass-glow: rgba(224, 224, 224, 0.15);

      --spotlight-surface: rgba(255, 255, 255, 0.08);
      --spotlight-border: rgba(255, 255, 255, 0.55);

      --text-title: #ffffff;
      --text-sub: #d1d5db;
      --text-quote: #f3f4f6;
      --text-author: #9ca3af;
      --shimmer-highlight: #ffffff;
      --shimmer-base: rgba(243, 244, 246, 0.55);

      --pill-bg: rgba(255, 255, 255, 0.06);
      --pill-border: rgba(255, 255, 255, 0.16);
      --pill-hover-bg: rgba(255, 255, 255, 0.12);
      --pill-hover-border: rgba(255, 255, 255, 0.5);
      --pill-hover-glow: 0 12px 32px rgba(255, 255, 255, 0.12);

      --dock-bg: rgba(20, 22, 26, 0.55);
      --dock-border: rgba(255, 255, 255, 0.2);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(160, 160, 160, 0.16) 100%);
      --indicator-border: rgba(255, 255, 255, 0.45);

      --orb-1: rgba(255, 255, 255, 0.32);
      --orb-2: rgba(160, 170, 190, 0.35);
      --orb-3: rgba(210, 215, 225, 0.28);

      --accent-color: #ffffff;
      --slider-track: rgba(255, 255, 255, 0.16);
      --slider-fill: #ffffff;
      --vinyl-label-grad: linear-gradient(135deg, #4b5563 0%, #1f2937 100%);
    }

    :root[data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 0%, #f6f8f5 0%, #e9efe7 60%, #d8e2d4 100%);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.88);
      --glass-border-highlight: rgba(255, 255, 255, 1);

      --glass-glow: rgba(34, 197, 94, 0.12);

      --spotlight-surface: rgba(34, 197, 94, 0.08);
      --spotlight-border: rgba(22, 163, 74, 0.5);

      --text-title: #141f16;
      --text-sub: #4b5c4f;
      --text-quote: #141f16;
      --text-author: #657569;
      --shimmer-highlight: #16a34a;
      --shimmer-base: rgba(20, 31, 22, 0.72);

      --pill-bg: rgba(255, 255, 255, 0.75);
      --pill-border: rgba(255, 255, 255, 0.95);
      --pill-hover-bg: rgba(255, 255, 255, 0.96);
      --pill-hover-border: #86efac;
      --pill-hover-glow: 0 12px 30px rgba(34, 197, 94, 0.12);

      --dock-bg: rgba(255, 255, 255, 0.74);
      --dock-border: rgba(255, 255, 255, 0.95);
      --indicator-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(220, 252, 231, 0.85) 100%);
      --indicator-border: rgba(134, 239, 172, 0.6);

      --orb-1: rgba(255, 255, 255, 0.92);
      --orb-2: rgba(187, 247, 208, 0.5);
      --orb-3: rgba(254, 243, 199, 0.45);

      --accent-color: #16a34a;
      --slider-track: rgba(20, 31, 22, 0.12);
      --slider-fill: #16a34a;
      --vinyl-label-grad: linear-gradient(135deg, #86efac 0%, #22c55e 100%);
    }

    body {
      transition: background 0.6s ease;
    }

    .liquid-card-ios26 {
      transition: height 0.52s var(--spring-easing), box-shadow 0.4s ease, background 0.5s ease, border-color 0.5s ease, transform 0.5s var(--silky-ease), opacity 0.5s var(--silky-ease);
    }

    .theme-transitioning {
      opacity: 0 !important;
      transform: scale(0.96) translateY(8px) !important;
      filter: blur(8px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 16px;
    }

    .ios26-bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
    }

    #ambient-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      mix-blend-mode: overlay;
      will-change: transform;
      opacity: 0.85;
      z-index: 1;
      transition: background 0.6s ease;
    }

    .orb-primary {
      width: 420px; height: 420px;
      top: -80px; left: -60px;
      background: radial-gradient(circle at 35% 35%, var(--orb-1) 0%, rgba(255,255,255,0.1) 60%, transparent 80%);
      animation: floatFluid1 14s infinite ease-in-out alternate;
    }

    .orb-secondary {
      width: 380px; height: 380px;
      bottom: -60px; right: -50px;
      background: radial-gradient(circle at 35% 35%, var(--orb-2) 0%, rgba(255,255,255,0.08) 60%, transparent 80%);
      animation: floatFluid2 16s infinite ease-in-out alternate;
    }

    .orb-accent {
      width: 300px; height: 300px;
      top: 40%; left: 30%;
      background: radial-gradient(circle at 35% 35%, var(--orb-3) 0%, rgba(255,255,255,0.1) 60%, transparent 80%);
      animation: floatFluid3 11s infinite ease-in-out alternate;
    }

    @keyframes floatFluid1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(90px, 110px, 0) scale(1.12); }
    }
    @keyframes floatFluid2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-80px, -110px, 0) scale(1.15); }
    }
    @keyframes floatFluid3 {
      0% { transform: translate3d(0, 0, 0) scale(0.92); }
      100% { transform: translate3d(80px, -60px, 0) scale(1.18); }
    }

    .glass-mesh-overlay {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 20px 20px;
      z-index: 2;
      pointer-events: none;
      opacity: 0.3;
    }

    .liquid-card-ios26 {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 414px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1.5px solid var(--glass-border);
      border-radius: 44px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateZ(0);
    }

    .liquid-card-ios26::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mouse-x) var(--mouse-y),
        var(--spotlight-surface),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      z-index: 4;
    }

    .liquid-card-ios26:hover::after {
      opacity: 1;
    }

    .card-border-glow {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: radial-gradient(
        280px circle at var(--mouse-x) var(--mouse-y),
        var(--spotlight-border),
        transparent 70%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 25;
    }

    .liquid-card-ios26:hover .card-border-glow {
      opacity: 1;
    }

    .water-ripple {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.05) 60%, transparent 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      pointer-events: none;
      animation: dropletExpand 0.75s var(--spring-easing) forwards;
      z-index: 50;
    }

    @keyframes dropletExpand {
      0% { width: 0; height: 0; opacity: 0.9; }
      100% { width: 220px; height: 220px; opacity: 0; }
    }

    .top-bar {
      padding: 20px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 20;
      flex-shrink: 0;
    }

    .theme-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .realtime-clock {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-track {
      position: relative;
      width: 78px;
      height: 42px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid var(--glass-border);
      border-radius: 40px;
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.25s var(--spring-easing);
    }

    .theme-toggle-track:hover { transform: scale(1.04); }
    .theme-toggle-track:active { transform: scale(0.95); }

    .theme-orb-indicator {
      position: absolute;
      top: 3px; left: 3px;
      width: 33px; height: 33px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%);
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s var(--liquid-bounce), background 0.4s ease;
    }

    .orb-icon {
      font-size: 0.9rem;
      transition: opacity 0.3s ease, transform 0.3s ease;
      position: absolute;
      color: #111827;
    }

    .icon-sun { opacity: 0; transform: scale(0.5) rotate(-90deg); }
    .icon-moon { opacity: 1; transform: scale(1) rotate(0deg); }

    [data-theme="light"] .theme-orb-indicator {
      transform: translate3d(36px, 0, 0);
      background: linear-gradient(135deg, #ffffff 0%, #dcfce7 100%);
    }
    [data-theme="light"] .icon-sun { opacity: 1; transform: scale(1) rotate(0deg); }
    [data-theme="light"] .icon-moon { opacity: 0; transform: scale(0.5) rotate(90deg); }

    .glass-btn-ios26, .ios26-link-item, .btn-action-item, .btn-download-icon {
      --btn-x: 50%;
      --btn-y: 50%;
      position: relative;
      overflow: hidden;
      transition: transform 0.28s var(--spring-easing), border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-btn-ios26::before, .ios26-link-item::before, .btn-action-item::before, .btn-download-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(90px circle at var(--btn-x) var(--btn-y), rgba(255, 255, 255, 0.28), transparent 70%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .glass-btn-ios26:hover::before, .ios26-link-item:hover::before, .btn-action-item:hover::before, .btn-download-icon:hover::before {
      opacity: 1;
    }

    .glass-btn-ios26:active,
    .ios26-link-item:active,
    .btn-action-item:active,
    .btn-download-icon:active,
    .nav-tab-btn:active {
      transform: scale(0.96) !important;
      transition-duration: 0.08s;
    }

    .glass-btn-ios26 {
      width: 42px; height: 42px;
      border-radius: 18px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-title);
      font-size: 1.05rem;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
    }

    .glass-btn-ios26:hover {
      transform: translateY(-2px) scale(1.06);
      border-color: var(--glass-border-highlight);
      background: var(--pill-hover-bg);
    }

    .music-btn.playing i {
      animation: spinMusic 4s linear infinite;
      color: var(--accent-color);
    }

    @keyframes spinMusic {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px 24px 8px;
      z-index: 15;
      flex-shrink: 0;
      transition: transform 0.5s var(--spring-easing), margin 0.5s var(--spring-easing);
    }

    @keyframes avatarBreathe {
      0%, 100% { transform: translate3d(0, 0px, 0) scale(1); }
      50% { transform: translate3d(0, -3px, 0) scale(1.026); }
    }

    .avatar-breathe-wrap {
      animation: avatarBreathe 5.5s ease-in-out infinite;
      will-change: transform;
    }

    .avatar-ring {
      position: relative;
      width: 104px; height: 104px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.08) 100%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28), 0 0 22px var(--glass-glow);
      transform-origin: center center;
      will-change: transform;
      transition: 
        transform 0.72s var(--silky-ease),
        box-shadow 0.72s var(--silky-ease);
      cursor: pointer;
    }

    .avatar-ring:hover {
      transform: translate3d(5px, -2px, 0) rotate(8.5deg) scale(1.055);
      box-shadow: 6px 16px 34px rgba(0, 0, 0, 0.3), 0 0 32px var(--glass-glow);
    }

    .avatar-ring img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      transition: filter 0.65s var(--silky-ease), transform 0.72s var(--silky-ease);
    }

    .avatar-ring:hover img {
      filter: grayscale(0%);
      transform: scale(1.02);
    }

    .profile-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.35s var(--spring-easing), transform 0.35s var(--spring-easing);
    }

    .profile-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-title);
      margin-top: 12px;
      letter-spacing: -0.03em;
    }

    .profile-tagline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 2px;
      letter-spacing: -0.01em;
    }

    .liquid-card-ios26.compact-mode .profile-header {
      transform: scale(0.8);
      margin-bottom: -58px;
    }

    .liquid-card-ios26.compact-mode .profile-meta {
      opacity: 0;
      transform: translate3d(0, -15px, 0);
      pointer-events: none;
    }

    .viewport-wrapper {
      width: 100%;
      overflow: hidden;
      flex: 1;
      z-index: 10;
    }

    .viewport {
      width: 300%;
      display: flex;
      align-items: flex-start;
      transform: translate3d(-33.3333%, 0, 0);
      transition: transform 0.56s var(--spring-easing);
      will-change: transform;
    }

    .tab-page {
      width: 33.3333%;
      padding: 12px 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0.45;
      transform: scale(0.95);
      filter: blur(6px);
      transition: 
        opacity 0.5s var(--spring-easing),
        transform 0.55s var(--spring-easing),
        filter 0.5s var(--spring-easing);
    }

    .tab-page.active-tab {
      opacity: 1;
      transform: scale(1);
      filter: blur(0px);
    }

    @keyframes blurReveal {
      0% {
        opacity: 0;
        filter: blur(12px);
        transform: translateY(10px) scale(0.97);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0) scale(1);
      }
    }

    @keyframes textShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .ios26-quote-card {
      margin: 8px 0 16px;
      padding: 24px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--glass-border);
      border-radius: 30px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
      transition: transform 0.35s var(--spring-easing), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .ios26-quote-card:hover {
      transform: translateY(-3px) scale(1.015);
      border-color: var(--glass-border-highlight);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), inset 0 1px 3px rgba(255, 255, 255, 0.4);
    }

    .quote-text {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.8;
      white-space: nowrap;
      background: linear-gradient(
        110deg,
        var(--shimmer-base) 30%,
        var(--shimmer-highlight) 50%,
        var(--shimmer-base) 70%
      );
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: 
        blurReveal 0.95s var(--spring-easing) forwards,
        textShimmer 5.5s linear infinite;
    }

    .quote-author {
      font-size: 0.88rem;
      font-style: italic;
      color: var(--text-author);
      margin-top: 14px;
      display: block;
      opacity: 0;
      animation: blurReveal 0.95s var(--spring-easing) 0.22s forwards;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ios26-link-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: var(--pill-bg);
      border: 1.5px solid var(--pill-border);
      border-radius: 26px;
      text-decoration: none;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.95rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.2);
    }

    .ios26-link-item:hover {
      transform: translateY(-4px) scale(1.02);
      background: var(--pill-hover-bg);
      border-color: var(--pill-hover-border);
      box-shadow: var(--pill-hover-glow);
    }

    .link-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      margin-right: 14px;
      object-fit: cover;
      transition: transform 0.35s var(--liquid-bounce);
    }

    .ios26-link-item:hover .link-icon {
      transform: scale(1.14) rotate(6deg);
    }

    .link-label {
      flex: 1;
      text-align: left;
      letter-spacing: -0.01em;
      transition: transform 0.3s var(--spring-easing);
    }

    .ios26-link-item:hover .link-label {
      transform: translateX(4px);
    }

    .link-arrow {
      font-size: 0.85rem;
      color: var(--text-sub);
      transition: transform 0.3s var(--spring-easing);
    }

    .ios26-link-item:hover .link-arrow {
      transform: translateX(5px);
    }

    .bottom-nav-container {
      padding: 6px 22px 22px;
      z-index: 30;
      width: 100%;
      flex-shrink: 0;
    }

    .ios26-nav-dock {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--dock-bg);
      border: 1.5px solid var(--dock-border);
      border-radius: 40px;
      padding: 6px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.3), 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .nav-indicator-pill {
      position: absolute;
      top: 6px; left: 6px;
      width: calc((100% - 12px) / 3);
      height: calc(100% - 12px);
      background: var(--indicator-bg);
      border: 1.5px solid var(--indicator-border);
      border-radius: 34px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      transition: transform 0.5s var(--spring-easing);
      z-index: 1;
      will-change: transform;
    }

    .nav-tab-btn {
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .nav-tab-btn i {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.45);
      display: inline-block;
      will-change: transform;
      transition: color 0.3s ease;
    }

    [data-theme="light"] .nav-tab-btn i { color: #657569; }
    .nav-tab-btn.active i { color: var(--text-title); }
    [data-theme="light"] .nav-tab-btn.active i { color: #141f16; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: 
        opacity 0.4s var(--spring-easing),
        backdrop-filter 0.45s var(--spring-easing),
        -webkit-backdrop-filter 0.45s var(--spring-easing);
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .qr-glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1.5px solid var(--glass-border-highlight);
      border-radius: 40px;
      padding: 28px 24px;
      width: 88%;
      max-width: 320px;
      text-align: center;
      opacity: 0;
      transform: scale(0.95) translateY(10px);
      transition: 
        transform 0.5s var(--spring-easing),
        opacity 0.4s var(--spring-easing);
      will-change: transform, opacity;
      box-shadow: var(--glass-shadow);
    }

    .modal-backdrop.active .qr-glass-card {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .qr-title { font-size: 1.2rem; font-weight: 700; color: var(--text-title); margin-bottom: 18px; }

    .qr-box-wrapper {
      position: relative;
      width: 180px; height: 180px;
      margin: 0 auto;
      padding: 12px;
      background: #ffffff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
    }

    #qrcode-canvas { width: 100% !important; height: 100% !important; display: flex; justify-content: center; align-items: center; }
    #qrcode-canvas img { border-radius: 12px; }

    .qr-avatar-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      object-fit: cover;
    }

    .qr-actions-row {
      width: 180px;
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action-item {
      flex: 1;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--glass-border-highlight);
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-title);
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-download-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 1px solid var(--glass-border-highlight);
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-title);
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-action-item:hover,
    .btn-download-icon:hover {
      transform: translateY(-2px) scale(1.03);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
    }

    .btn-close-modal {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-title);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s var(--spring-easing);
    }
    .btn-close-modal:hover { opacity: 1; transform: scale(1.04); }
    .btn-close-modal:active { transform: scale(0.96); }

    .email-textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 16px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-title);
      font-size: 0.9rem;
      resize: none;
      outline: none;
      margin-bottom: 12px;
      user-select: text;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .email-textarea:focus {
      border-color: var(--glass-border-highlight);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
    }

    /* ==========================================================
       SPOTIFY & IOS27 MUSIC PLAYER MODAL STYLING (REFINED)
       ========================================================== */
    .music-modal-card {
      background: var(--glass-bg);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1.5px solid var(--glass-border-highlight);
      border-radius: 42px;
      padding: 28px 24px 22px;
      width: 90%;
      max-width: 356px;
      text-align: center;
      opacity: 0;
      transform: scale(0.92) translateY(16px);
      transition: transform 0.5s var(--spring-easing), opacity 0.4s var(--spring-easing), background 0.4s ease, border-color 0.4s ease;
      box-shadow: var(--glass-shadow);
      color: var(--text-title);
    }

    .modal-backdrop.active .music-modal-card {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .vinyl-container {
      position: relative;
      width: 168px;
      height: 168px;
      margin: 4px auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-record {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      /* Tinh tế, có vệt ánh sáng nhẹ & rãnh đĩa để nhận biết chuyển động xoay mượt mà mà không gây rối mắt */
      background: 
        conic-gradient(
          from 0deg,
          rgba(255, 255, 255, 0.14) 0deg,
          transparent 45deg,
          transparent 180deg,
          rgba(255, 255, 255, 0.12) 225deg,
          transparent 270deg,
          rgba(255, 255, 255, 0.14) 360deg
        ),
        repeating-radial-gradient(
          circle at center,
          #141619 0px,
          #141619 5px,
          #1f2328 6px,
          #141619 10px
        );
      border: 2px solid var(--glass-border-highlight);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35), inset 0 0 12px rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      will-change: transform;
    }

    /* Chấm nhỏ định vị trên đĩa than giúp mắt dễ nhận diện đĩa đang quay nhẹ nhàng */
    .vinyl-record::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-color);
      opacity: 0.75;
      box-shadow: 0 0 6px var(--accent-color);
    }

    .vinyl-record.spinning {
      animation: spinVinyl 7.5s linear infinite;
    }

    @keyframes spinVinyl {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .vinyl-label {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--vinyl-label-grad);
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    /* Vạch chỉ báo nhỏ trên nhãn trung tâm để tăng độ rõ khi xoay */
    .vinyl-label::before {
      content: '';
      position: absolute;
      top: 6px;
      width: 3px;
      height: 8px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.85);
    }

    .vinyl-center-hole {
      width: 14px;
      height: 14px;
      background: #111317;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.65);
    }

    /* Tiêu đề bài hát trên 1 dòng + dòng phụ ALL-ROUNDER in nghiêng nhỏ hơn */
    .music-title-group {
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .music-track-title {
      font-size: clamp(0.95rem, 3.8vw, 1.08rem);
      font-weight: 800;
      color: var(--text-title);
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .music-track-subtitle {
      font-size: 0.78rem;
      font-style: italic;
      font-weight: 500;
      color: var(--text-sub);
      margin-top: 3px;
      letter-spacing: 0.04em;
      opacity: 0.85;
    }

    /* Thanh thời lượng (00:00, không mút tròn) */
    .player-slider-group {
      margin-bottom: 16px;
    }

    .player-time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 7px;
      font-variant-numeric: tabular-nums;
    }

    .ios27-bar-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--slider-track);
      outline: none;
      cursor: pointer;
      overflow: hidden;
      transition: height 0.2s ease;
    }

    .ios27-bar-slider:hover {
      height: 8px;
    }

    /* Ẩn hoàn toàn mút tròn trên Chrome/Safari/Edge */
    .ios27-bar-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 0px;
      height: 0px;
      box-shadow: -400px 0 0 400px var(--slider-fill);
    }

    /* Ẩn hoàn toàn mút tròn trên Firefox */
    .ios27-bar-slider::-moz-range-thumb {
      width: 0px;
      height: 0px;
      border: none;
      background: transparent;
      box-shadow: -400px 0 0 400px var(--slider-fill);
    }

    /* Hàng nút điều khiển: Tua lùi 5s | Phát/Dừng | Tua tới 5s | Nghe lại */
    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px 0 16px;
    }

    .player-ctrl-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid var(--glass-border);
      background: var(--pill-bg);
      color: var(--text-title);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.22s var(--spring-easing), background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      position: relative;
    }

    .seek-step-label {
      font-size: 0.62rem;
      font-weight: 800;
      margin-left: 1px;
    }

    .player-ctrl-btn.main-play {
      width: 56px;
      height: 56px;
      background: var(--text-title);
      color: #111317;
      border-color: var(--text-title);
      font-size: 1.15rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    }

    [data-theme="light"] .player-ctrl-btn.main-play {
      background: #141f16;
      color: #ffffff;
      border-color: #141f16;
    }

    .player-ctrl-btn:hover {
      transform: scale(1.08);
      border-color: var(--glass-border-highlight);
    }

    .player-ctrl-btn:active {
      transform: scale(0.94);
    }

    .player-ctrl-btn.active-mode {
      color: var(--accent-color);
      border-color: var(--accent-color);
      background: var(--pill-hover-bg);
      box-shadow: 0 0 14px var(--glass-glow);
    }

    /* Thanh âm lượng tinh giản: không chỉ số, không mút tròn */
    .volume-control-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--pill-bg);
      padding: 11px 16px;
      border-radius: 22px;
      border: 1.5px solid var(--glass-border);
      margin-top: 6px;
    }

    .volume-control-wrapper i {
      font-size: 0.88rem;
      color: var(--text-sub);
      width: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND SPHERES & INTERACTIVE AMBIENT CANVAS -->
  <div class="ios26-bg-canvas">
    <div class="liquid-orb orb-primary"></div>
    <div class="liquid-orb orb-secondary"></div>
    <div class="liquid-orb orb-accent"></div>
    <canvas id="ambient-particles"></canvas>
  </div>
  <div class="glass-mesh-overlay"></div>

  <!-- MAIN CARD CONTAINER -->
  <main class="liquid-card-ios26" id="main-card">
    <div class="card-border-glow"></div>

    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="theme-column">
        <div class="theme-toggle-track" id="theme-toggle" role="button" aria-label="Toggle Theme">
          <div class="theme-orb-indicator">
            <i class="fa-solid fa-moon orb-icon icon-moon"></i>
            <i class="fa-solid fa-sun orb-icon icon-sun"></i>
          </div>
        </div>
        <div class="realtime-clock" id="realtime-clock">00:00:00</div>
      </div>

      <div class="top-bar-controls">
        <button class="glass-btn-ios26" id="open-email-modal-btn" aria-label="Quick Email">
          <i class="fa-solid fa-envelope"></i>
        </button>

        <button class="glass-btn-ios26 music-btn" id="open-music-modal-btn" aria-label="Open Music Player">
          <i class="fa-solid fa-music" id="music-main-icon"></i>
        </button>

        <button class="glass-btn-ios26" id="open-qr-btn" aria-label="Open QR Code">
          <i class="fa-solid fa-qrcode"></i>
        </button>
      </div>
    </div>

    <!-- PROFILE HEADER -->
    <header class="profile-header">
      <div class="avatar-breathe-wrap">
        <div class="avatar-ring">
          <img src="images/Huy.png" alt="Avatar Nhật Huy" loading="eager">
        </div>
      </div>
      <div class="profile-meta">
        <h1 class="profile-name">Nhật Huy</h1>
        <p class="profile-tagline">ung dung.</p>
      </div>
    </header>

    <!-- VIEWPORT SLIDER -->
    <div class="viewport-wrapper">
      <div class="viewport" id="viewport">

        <!-- TAB 1: SOCIAL -->
        <section class="tab-page" id="page-social">
          <div class="links-list" id="social-links-list"></div>
        </section>

        <!-- TAB 2: HOME (QUOTE) -->
        <section class="tab-page active-tab" id="page-home">
          <div class="ios26-quote-card">
            <p class="quote-text">“<br>Một lần gió thoảng qua song,<br>Mà nghe hoa đã động lòng vì xuân.</p>
            <span class="quote-author">w.</span>
          </div>
        </section>

        <!-- TAB 3: WORK -->
        <section class="tab-page" id="page-work">
          <div class="links-list" id="work-links-list"></div>
        </section>

      </div>
    </div>

    <!-- NAVIGATION DOCK CAPSULE -->
    <div class="bottom-nav-container">
      <nav class="ios26-nav-dock" id="nav-dock">
        <div class="nav-indicator-pill" id="nav-indicator"></div>
        
        <button class="nav-tab-btn" data-index="0" aria-label="Account">
          <i class="fa-solid fa-user"></i>
        </button>

        <button class="nav-tab-btn active" data-index="1" aria-label="Home">
          <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-tab-btn" data-index="2" aria-label="Work">
          <i class="fa-solid fa-briefcase"></i>
        </button>
      </nav>
    </div>

  </main>

  <!-- MODAL QR CODE -->
  <div class="modal-backdrop" id="qr-modal" role="dialog" aria-hidden="true">
    <div class="qr-glass-card">
      <h3 class="qr-title">Scan QR Code</h3>
      <div class="qr-box-wrapper">
        <div id="qrcode-canvas"></div>
        <img src="images/Huy.png" alt="Avatar" class="qr-avatar-center">
      </div>
      
      <div class="qr-actions-row">
        <button class="btn-action-item" id="copy-btn">
          <i class="fa-regular fa-copy"></i>
          <span id="copy-text">Copy link</span>
        </button>
        <button class="btn-download-icon" id="download-qr-btn" aria-label="Download QR" title="Download QR">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/>
            <path d="m7 10 5 5 5-5"/>
            <path d="M5 19h14"/>
          </svg>
        </button>
      </div>

      <button class="btn-close-modal" id="close-qr-btn">Close</button>
    </div>
  </div>

  <!-- MODAL POP-UP GỬI TIN NHẮN TỨC THÌ -->
  <div class="modal-backdrop" id="email-modal" role="dialog" aria-hidden="true">
    <div class="qr-glass-card">
      <h3 class="qr-title">Instant Message</h3>
      <textarea id="visitor-message" class="email-textarea" placeholder="Type your message to Nhat Huy..."></textarea>
      <button class="btn-action-item" id="send-instant-email-btn" style="width: 100%;">
        <i class="fa-solid fa-paper-plane"></i>
        <span id="send-btn-text">Send</span>
      </button>
      <button class="btn-close-modal" id="close-email-modal-btn">Close</button>
    </div>
  </div>

  <!-- MODAL TRÌNH PHÁT NHẠC KIỂU SPOTIFY & GAINNODE -->
  <div class="modal-backdrop" id="music-modal" role="dialog" aria-hidden="true">
    <div class="music-modal-card">
      <div class="vinyl-container">
        <div class="vinyl-record" id="vinyl-record">
          <div class="vinyl-label">
            <div class="vinyl-center-hole"></div>
          </div>
        </div>
      </div>

      <div class="music-title-group">
        <div class="music-track-title">Nếu Ngày Ấy - SOOBIN</div>
        <div class="music-track-subtitle">ALL-ROUNDER</div>
      </div>

      <!-- Thanh tua thời gian thực (00:00, không mút tròn) -->
      <div class="player-slider-group">
        <div class="player-time-row">
          <span id="current-time-lbl">00:00</span>
          <span id="duration-lbl">00:00</span>
        </div>
        <input type="range" id="seek-slider" class="ios27-bar-slider" min="0" max="100" value="0" step="0.1">
      </div>

      <!-- Nút điều khiển: Tua lùi 5s | Phát/Dừng | Tua tới 5s | Nghe lại -->
      <div class="player-controls-row">
        <button class="player-ctrl-btn" id="modal-rewind-btn" title="Tua lùi 5 giây" aria-label="Rewind 5 seconds">
          <i class="fa-solid fa-backward"></i>
          <span class="seek-step-label">5</span>
        </button>

        <button class="player-ctrl-btn main-play" id="modal-play-btn" title="Phát / Dừng" aria-label="Play or Pause">
          <i class="fa-solid fa-play" id="modal-play-icon"></i>
        </button>

        <button class="player-ctrl-btn" id="modal-forward-btn" title="Tua tới 5 giây" aria-label="Forward 5 seconds">
          <i class="fa-solid fa-forward"></i>
          <span class="seek-step-label">5</span>
        </button>

        <button class="player-ctrl-btn" id="modal-loop-btn" title="Nghe lại" aria-label="Repeat">
          <i class="fa-solid fa-repeat"></i>

    function initAutoThemeAndClock() {
      const clockEl = document.getElementById("realtime-clock");

      function applyAutoThemeByHour(hour) {
        if (!localStorage.getItem("ios26-user-overridden")) {
          const autoTheme = (hour >= 6 && hour <= 17) ? "light" : "dark";
          if (document.documentElement.getAttribute("data-theme") !== autoTheme) {

          }
        }
      }

      function updateClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        const ss = String(now.getSeconds()).padStart(2, "0");
        if (clockEl) {
          clockEl.textContent = `${hh}:${mm}:${ss}`;
        }
        applyAutoThemeByHour(now.getHours());
      }

      updateClock();
      setInterval(updateClock, 1000);
    }

    /* ==========================================================
       1. APPLE MACOS DOCK (MAGNETIC SPRING MAGNIFICATION)
       ========================================================== */
    function initMagneticDock() {
      const dock = document.getElementById("nav-dock");
      const btns = Array.from(dock.querySelectorAll(".nav-tab-btn"));
      if (!dock || !btns.length) return;

      const items = btns.map(btn => ({
        btn,
        icon: btn.querySelector("i"),
        scale: 1,
        targetScale: 1,
        x: 0,
        targetX: 0,
        vScale: 0,
        vX: 0
      }));

      let isHovering = false;
      let animId = null;

      function updatePhysics() {
        let moving = false;
        const stiffness = 0.22;
        const damping = 0.68;

        items.forEach(item => {
          const fScale = (item.targetScale - item.scale) * stiffness;
          item.vScale = (item.vScale + fScale) * damping;
          item.scale += item.vScale;

          const fX = (item.targetX - item.x) * stiffness;
          item.vX = (item.vX + fX) * damping;
          item.x += item.vX;

          if (Math.abs(item.targetScale - item.scale) > 0.001 || Math.abs(item.vScale) > 0.001 ||
              Math.abs(item.targetX - item.x) > 0.01 || Math.abs(item.vX) > 0.01) {
            moving = true;
          } else {
            item.scale = item.targetScale;
            item.x = item.targetX;
          }

          const liftY = -(item.scale - 1) * 14;
          item.icon.style.transform = `translate3d(${item.x.toFixed(2)}px, ${liftY.toFixed(2)}px, 0) scale(${item.scale.toFixed(3)})`;
        });

        if (moving || isHovering) {
          animId = requestAnimationFrame(updatePhysics);
        } else {
          animId = null;
        }
      }

      function resetTargets() {
        isHovering = false;
        items.forEach(item => {
          item.targetScale = 1;
          item.targetX = 0;
        });
        if (!animId) animId = requestAnimationFrame(updatePhysics);
      }

      dock.addEventListener("mousemove", (e) => {
        isHovering = true;
        const maxRange = 135;
        const maxScale = 1.48;

        items.forEach(item => {
          const rect = item.btn.getBoundingClientRect();
          const center = rect.left + rect.width / 2;
          const dist = e.clientX - center;
          const absDist = Math.abs(dist);

          if (absDist < maxRange) {
            const norm = 1 - absDist / maxRange;
            const ease = Math.cos((1 - norm) * (Math.PI / 2));
            item.targetScale = 1 + (maxScale - 1) * ease;
            item.targetX = -Math.sign(dist) * Math.sin(norm * Math.PI) * 9;
          } else {
            item.targetScale = 1;
            item.targetX = 0;
          }
        });

        if (!animId) animId = requestAnimationFrame(updatePhysics);
      });

      dock.addEventListener("mouseleave", resetTargets);
      btns.forEach(btn => btn.addEventListener("click", resetTargets));
    }

    /* ==========================================================
       3. INTERACTIVE AMBIENT CANVAS (FIREFLIES & FALLING LEAVES)
       ========================================================== */
    function initAmbientCanvas() {
      const canvas = document.getElementById("ambient-particles");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      const mouse = { x: -9999, y: -9999, active: false };

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });

      window.addEventListener("touchmove", (e) => {
        if (e.touches[0]) {
          mouse.x = e.touches[0].clientX;
          mouse.y = e.touches[0].clientY;
          mouse.active = true;
        }
      }, { passive: true });

      window.addEventListener("mouseleave", () => { mouse.active = false; });
      window.addEventListener("touchend", () => { mouse.active = false; });

      const LEAF_PALETTES = [
        { main: "#4ade80", edge: "#15803d", vein: "#dcfce7" },
        { main: "#22c55e", edge: "#166534", vein: "#bbf7d0" },
        { main: "#84cc16", edge: "#4d7c0f", vein: "#ecfccb" },
        { main: "#e09f3e", edge: "#b45309", vein: "#fef3c7" },
        { main: "#ea580c", edge: "#9a3412", vein: "#ffedd5" }
      ];

      const PARTICLE_COUNT = 54;
      const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,
        radius: Math.random() * 2.3 + 1.5,
        leafSize: Math.random() * 5 + 6.5,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.025,
        flipPhase: Math.random() * Math.PI * 2,
        flipSpeed: 0.02 + Math.random() * 0.025,
        swayAmp: 0.45 + Math.random() * 0.55,
        phase: Math.random() * Math.PI * 2,
        speed: 0.015 + Math.random() * 0.02,
        swirlDir: Math.random() > 0.5 ? 1 : -1,
        orbitRadius: 28 + Math.random() * 54,
        palette: LEAF_PALETTES[Math.floor(Math.random() * LEAF_PALETTES.length)]
      }));

      function drawNaturalLeaf(p, alpha) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);

        const tiltScale = 0.55 + 0.45 * Math.abs(Math.cos(p.flipPhase));
        ctx.scale(1, tiltScale);

        const s = p.leafSize;
        ctx.globalAlpha = Math.min(0.95, alpha + 0.25);

        ctx.shadowColor = "rgba(20, 31, 22, 0.16)";
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 3;

        const grad = ctx.createLinearGradient(-s, -s * 0.5, s, s * 0.5);
        grad.addColorStop(0, p.palette.main);
        grad.addColorStop(1, p.palette.edge);
        ctx.fillStyle = grad;

        ctx.beginPath();
        ctx.moveTo(-s * 1.15, 0);
        ctx.bezierCurveTo(-s * 0.45, -s * 0.85, s * 0.45, -s * 0.75, s * 1.2, 0);
        ctx.bezierCurveTo(s * 0.45, s * 0.75, -s * 0.45, s * 0.85, -s * 1.15, 0);
        ctx.closePath();
        ctx.fill();

        ctx.shadowColor = "transparent";

        ctx.strokeStyle = p.palette.edge;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-s * 1.15, 0);
        ctx.quadraticCurveTo(-s * 1.45, s * 0.15, -s * 1.6, s * 0.25);
        ctx.stroke();

        ctx.strokeStyle = p.palette.vein;
        ctx.lineWidth = 0.65;
        ctx.globalAlpha = Math.min(0.75, alpha * 0.8);
        ctx.beginPath();
        ctx.moveTo(-s * 1.05, 0);
        ctx.lineTo(s * 1.0, 0);
        ctx.moveTo(-s * 0.3, 0);
        ctx.lineTo(s * 0.1, -s * 0.35);
        ctx.moveTo(-s * 0.3, 0);
        ctx.lineTo(s * 0.1, s * 0.35);
        ctx.moveTo(s * 0.2, 0);
        ctx.lineTo(s * 0.55, -s * 0.28);
        ctx.moveTo(s * 0.2, 0);
        ctx.lineTo(s * 0.55, s * 0.28);
        ctx.stroke();

        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        const isLight = document.documentElement.getAttribute("data-theme") === "light";

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.phase += p.speed;
          p.flipPhase += p.flipSpeed;
          let proximityBoost = 0;

          if (mouse.active) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.hypot(dx, dy);
            const influenceRadius = 250;

            if (dist < influenceRadius && dist > 1) {
              const norm = 1 - dist / influenceRadius;
              proximityBoost = norm * 0.5;
              const nx = dx / dist;
              const ny = dy / dist;

              if (dist > p.orbitRadius) {
                const pull = norm * norm * 0.085;
                p.vx += nx * pull;
                p.vy += ny * pull;
              } else {
                const repel = (1 - dist / p.orbitRadius) * 0.038;
                p.vx -= nx * repel;
                p.vy -= ny * repel;
              }

              const swirl = norm * 0.045 * p.swirlDir;
              p.vx += -ny * swirl;
              p.vy += nx * swirl;
              p.rotation += p.rotSpeed * (1 + norm * 2.2);
            }
          }

          p.vx *= 0.965;
          p.vy *= 0.965;

          if (isLight) {
            const windSway = Math.sin(p.phase * 1.2) * p.swayAmp;
            p.x += p.vx + windSway;
            p.y += p.vy + 0.55 + Math.cos(p.phase) * 0.15;
            p.rotation += p.rotSpeed + windSway * 0.02;
          } else {
            p.x += p.vx + Math.sin(p.phase) * 0.28;
            p.y += p.vy - 0.16 + Math.cos(p.phase * 0.8) * 0.14;
          }

          if (p.x < -30) p.x = width + 30;
          if (p.x > width + 30) p.x = -30;
          if (p.y < -30) p.y = height + 30;
          if (p.y > height + 30) p.y = -30;

          const basePulse = 0.55 + Math.sin(p.phase * 1.4) * 0.3;
          const finalAlpha = Math.min(1, basePulse + proximityBoost);

          if (isLight) {
            drawNaturalLeaf(p, finalAlpha);
          } else {
            const dynamicRadius = p.radius * (1 + proximityBoost * 0.35);
            const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, dynamicRadius * 4.2);
            glow.addColorStop(0, `rgba(255, 252, 225, ${finalAlpha})`);
            glow.addColorStop(0.4, `rgba(253, 224, 71, ${finalAlpha * 0.45})`);
            glow.addColorStop(1, "rgba(255, 255, 255, 0)");

            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(p.x, p.y, dynamicRadius * 4.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        requestAnimationFrame(animate);
      }

      animate();
    }

    /* ==========================================================

    function initTabNavigation() {
      const navBtns = document.querySelectorAll(".nav-tab-btn");
      const indicator = document.getElementById("nav-indicator");
      const viewport = document.getElementById("viewport");
      const mainCard = document.getElementById("main-card");
      const tabPages = document.querySelectorAll(".tab-page");

      const topBarEl = document.querySelector(".top-bar");
      const bottomNavEl = document.querySelector(".bottom-nav-container");
      const profileHeaderEl = document.querySelector(".profile-header");

      function adjustCardHeight(index) {
        requestAnimationFrame(() => {
          const topBarH = topBarEl ? topBarEl.offsetHeight : 0;
          const headerH = profileHeaderEl ? profileHeaderEl.offsetHeight : 0;
          const navH = bottomNavEl ? bottomNavEl.offsetHeight : 0;
          const currentTabPage = tabPages[index];
          const contentH = currentTabPage ? currentTabPage.scrollHeight : 0;

          mainCard.style.height = `${topBarH + headerH + contentH + navH}px`;
        });
      }

      function switchTab(index) {
        viewport.style.transform = `translate3d(-${index * 33.3333}%, 0, 0)`;

        const activeBtn = navBtns[index];
        if (activeBtn && indicator) {
          indicator.style.transform = `translate3d(${activeBtn.offsetLeft - 6}px, 0, 0)`;
        }

        navBtns.forEach((btn, i) => btn.classList.toggle("active", i === index));
        tabPages.forEach((page, i) => page.classList.toggle("active-tab", i === index));

        if (index === 1) {
          mainCard.classList.remove("compact-mode");
        } else {
          mainCard.classList.add("compact-mode");
        }

        adjustCardHeight(index);
      }

      navBtns.forEach((btn, i) => {
        btn.addEventListener("click", () => switchTab(i));
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const activeBtn = document.querySelector(".nav-tab-btn.active");
          if (activeBtn) {
            switchTab(parseInt(activeBtn.getAttribute("data-index") || "1", 10));
          }
        }, 100);
      });

      requestAnimationFrame(() => switchTab(1));
    }

        a.target = "_blank";
        a.rel = "noopener noreferrer";

          <span class="link-label">${item.title}</span>
          <i class="fa-solid fa-chevron-right link-arrow"></i>
        `;
        fragment.appendChild(a);
      });

      container.innerHTML = '';
      container.appendChild(fragment);
    }

    function getDeviceAndLocationInfo() {
      const ua = navigator.userAgent;
      let vendor = "Chưa xác định hãng";
      let model = "Thiết bị không xác định";
      let os = "Hệ điều hành không xác định";
      let deviceType = "Desktop/Laptop";

      const isMobile = /mobile/i.test(ua);
      const isTablet = /tablet|ipad|playbook|silk/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isTablet) deviceType = "Tablet";
      else if (isMobile) deviceType = "Mobile";

      if (/android/i.test(ua)) {
        const osMatch = ua.match(/Android\s+([\d.]+)/i);
        os = `Android ${osMatch ? osMatch[1] : ''}`;
      } else if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        const osMatch = ua.match(/OS\s+([\d_]+)/i);
        os = `iOS / iPadOS ${osMatch ? osMatch[1].replace(/_/g, '.') : ''}`;
      } else if (/windows nt/i.test(ua)) {
        os = /windows nt 10.0/i.test(ua) ? "Windows 10 / 11" : "Windows PC";
      } else if (/macintosh|mac os x/i.test(ua)) {
        const osMatch = ua.match(/Mac OS X\s+([\d_]+)/i);
        os = `macOS ${osMatch ? osMatch[1].replace(/_/g, '.') : ''}`;
      } else if (/cros/i.test(ua)) os = "ChromeOS";
      else if (/linux/i.test(ua)) os = "Linux";

      if (/android/i.test(ua)) {
        if (/samsung|SM-/i.test(ua)) {
          vendor = "Samsung";
          const match = ua.match(/SM-[A-Z0-9]+/i);
          model = match ? match[0] : "Samsung Galaxy";
        } else if (/xiaomi|redmi|poco/i.test(ua)) {
          vendor = "Xiaomi";
          model = "Xiaomi Device";
        } else if (/oppo|CPH\d+/i.test(ua)) {
          vendor = "OPPO";
          model = "OPPO Device";
        } else if (/vivo|V2\d+/i.test(ua)) {
          vendor = "Vivo";
          model = "Vivo Device";
        }
      } else if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        vendor = "Apple";
        model = (/ipad/i.test(ua) || navigator.maxTouchPoints > 1) ? "iPad" : "iPhone";
      } else if (/macintosh/i.test(ua)) {
        vendor = "Apple";
        model = "Mac / MacBook";
      }

      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Ho_Chi_Minh";
      const language = navigator.language || "vi-VN";
      const location = (timeZone.includes("Ho_Chi_Minh") || timeZone.includes("Bangkok"))
        ? `Việt Nam (${timeZone})`
        : `Timezone: ${timeZone} | Ngôn ngữ: ${language}`;

      return {
        device: `Mã/Tên: ${model} | Hãng: ${vendor} | Hệ điều hành: ${os} (${deviceType})`,
        location
      };
    }

    function initEmailJSNotifier() {
      if (PUBLIC_KEY === "THAY_PUBLIC_KEY_CUA_BAN" || typeof emailjs === "undefined") return;

          }).then(() => sessionStorage.setItem("email_notified", "true"))

    }

      function closeModal() {
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
        messageInput.value = "";
      }

      openBtn.addEventListener("click", openModal);
      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

      sendBtn.addEventListener("click", () => {
        const userMsg = messageInput.value.trim();
        if (!userMsg) {
          alert("Please enter your message!");
          return;
        }

        sendBtnText.textContent = "Sending...";
        sendBtn.style.opacity = "0.7";
        sessionStorage.setItem("email_notified", "true");

        const { device, location } = getDeviceAndLocationInfo();
        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
          time: new Date().toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" }),
          device,
          location,
          message: userMsg,
          referrer: "Instant Message Pop-up (Web Form)"
        }).then(() => {
          sendBtnText.textContent = "Sent Successfully!";
          sendBtn.style.background = "#22c55e";
          setTimeout(() => {
            closeModal();
            sendBtnText.textContent = "Send";
            sendBtn.style.background = "rgba(255, 255, 255, 0.15)";
            sendBtn.style.opacity = "1";
          }, 1500);
        }).catch(() => {
          sendBtnText.textContent = "Send Failed!";
          setTimeout(() => {
            sendBtnText.textContent = "Send";
            sendBtn.style.opacity = "1";
          }, 2000);
        });
      });
    }

    /* ==========================================================
       TRÌNH PHÁT NHẠC KIỂU SPOTIFY & GAINNODE TĂNG CƯỜNG ÂM LƯỢNG (neungayay.mp3)
       ========================================================== */
    function initSpotifyAudioPlayer() {
      const openModalBtn = document.getElementById("open-music-modal-btn");
      const closeModalBtn = document.getElementById("close-music-modal-btn");
      const musicModal = document.getElementById("music-modal");
      const mainMusicBtn = document.getElementById("open-music-modal-btn");
      const musicMainIcon = document.getElementById("music-main-icon");

      const playBtn = document.getElementById("modal-play-btn");
      const playIcon = document.getElementById("modal-play-icon");
      const rewindBtn = document.getElementById("modal-rewind-btn");
      const forwardBtn = document.getElementById("modal-forward-btn");
      const loopBtn = document.getElementById("modal-loop-btn");
      const vinylRecord = document.getElementById("vinyl-record");

      const seekSlider = document.getElementById("seek-slider");
      const volumeSlider = document.getElementById("volume-slider");
      const currentTimeLbl = document.getElementById("current-time-lbl");
      const durationLbl = document.getElementById("duration-lbl");

      let audioCtx = null;
      let audioBuffer = null;
      let sourceNode = null;
      let gainNode = null;

      let isPlaying = false;
      let isLoaded = false;
      let isLooping = false;

      let startTime = 0;
      let pauseOffset = 0;
      let duration = 0;
      let animFrameId = null;

      // Định dạng 00:00 (cả phút và giây 2 chữ số)
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "00:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function openModal() {
        musicModal.classList.add("active");
        musicModal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        musicModal.classList.remove("active");
        musicModal.setAttribute("aria-hidden", "true");
      }

      openModalBtn.addEventListener("click", openModal);
      closeModalBtn.addEventListener("click", closeModal);
      musicModal.addEventListener("click", (e) => { if (e.target === musicModal) closeModal(); });

      async function loadAudioFile() {
        if (isLoaded) return;
        try {
          const response = await fetch("audio/neungayay.mp3");
          const arrayBuffer = await response.arrayBuffer();
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          duration = audioBuffer.duration;
          durationLbl.textContent = formatTime(duration);
          seekSlider.max = duration;
          isLoaded = true;
        } catch (e) {
          console.error("Lỗi tải tệp âm thanh neungayay.mp3:", e);
        }
      }

      function updateUIState(playing) {
        if (playing) {
          playIcon.className = "fa-solid fa-pause";
          vinylRecord.classList.add("spinning");
          mainMusicBtn.classList.add("playing");
          musicMainIcon.className = "fa-solid fa-compact-disc";
        } else {
          playIcon.className = "fa-solid fa-play";
          vinylRecord.classList.remove("spinning");
          mainMusicBtn.classList.remove("playing");
          musicMainIcon.className = "fa-solid fa-music";
        }
      }

      function playSound(offset = 0) {
        if (!isLoaded || !audioBuffer) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (sourceNode) {
          sourceNode.onended = null;
          try { sourceNode.stop(); } catch(e) {}
        }

        const safeOffset = Math.max(0, Math.min(offset, duration));

        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.loop = isLooping;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(volumeSlider.value);

        sourceNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        sourceNode.onended = () => {
          if (!isLooping && isPlaying) {
            const elapsed = audioCtx.currentTime - startTime;
            if (elapsed >= duration - 0.1) {
              stopSound(false);
              pauseOffset = 0;
              seekSlider.value = 0;
              currentTimeLbl.textContent = "00:00";
            }
          }
        };

        sourceNode.start(0, safeOffset);
        startTime = audioCtx.currentTime - safeOffset;
        isPlaying = true;
        updateUIState(true);
        trackProgress();
      }

      function stopSound(preserveOffset = true) {
        if (sourceNode) {
          sourceNode.onended = null;
          try {
            if (preserveOffset && duration > 0) {
              pauseOffset = (audioCtx.currentTime - startTime) % duration;
            }
            sourceNode.stop();
          } catch(e) {}
          sourceNode = null;
        }
        isPlaying = false;
        updateUIState(false);
        if (animFrameId) cancelAnimationFrame(animFrameId);
      }

      function trackProgress() {
        if (!isPlaying || duration <= 0) return;
        const currentPos = (audioCtx.currentTime - startTime) % duration;
        seekSlider.value = currentPos;
        currentTimeLbl.textContent = formatTime(currentPos);
        animFrameId = requestAnimationFrame(trackProgress);
      }

      function jumpTime(deltaSeconds) {
        if (!isLoaded || duration <= 0) return;
        const currentPos = isPlaying
          ? (audioCtx.currentTime - startTime) % duration
          : pauseOffset;
        const targetPos = Math.max(0, Math.min(currentPos + deltaSeconds, duration));
        pauseOffset = targetPos;
        seekSlider.value = targetPos;
        currentTimeLbl.textContent = formatTime(targetPos);

        if (isPlaying) {
          playSound(targetPos);
        }
      }

      playBtn.addEventListener("click", async () => {
        if (!isLoaded) await loadAudioFile();
        if (!isLoaded) return;

        if (isPlaying) {
          stopSound(true);
        } else {
          playSound(pauseOffset);
        }
      });

      rewindBtn.addEventListener("click", async () => {
        if (!isLoaded) await loadAudioFile();
        jumpTime(-5);
      });

      forwardBtn.addEventListener("click", async () => {
        if (!isLoaded) await loadAudioFile();
        jumpTime(5);
      });

      loopBtn.addEventListener("click", () => {
        isLooping = !isLooping;
        if (sourceNode) sourceNode.loop = isLooping;
        loopBtn.classList.toggle("active-mode", isLooping);
      });

      seekSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        currentTimeLbl.textContent = formatTime(val);
        pauseOffset = val;
        if (isPlaying) {
          playSound(pauseOffset);
        }
      });

      volumeSlider.addEventListener("input", (e) => {
        const vol = parseFloat(e.target.value);
        if (gainNode) {
          gainNode.gain.value = vol; // Khuếch đại lên đến 250% (2.5)
        }
      });

      // Phím tắt tiện ích khi mở pop-up nhạc (Space: Play/Pause, Mũi tên Trái/Phải: Tua 5s)
      document.addEventListener("keydown", (e) => {
        if (!musicModal.classList.contains("active")) return;
        if (e.code === "Space") {
          e.preventDefault();
          playBtn.click();
        } else if (e.code === "ArrowLeft") {
          e.preventDefault();
          jumpTime(-5);
        } else if (e.code === "ArrowRight") {
          e.preventDefault();
          jumpTime(5);
        } else if (e.code === "Escape") {
          closeModal();
        }
      });

      // Tải ngầm file nhạc trước
      loadAudioFile();
    }
  </script>
</body>
